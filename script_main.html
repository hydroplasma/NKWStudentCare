<script>
    let CONFIG = { site_config: {}, school_config: {} };
    let STATUS_LIST = [];
    let TEACHERS = [];
    let PERIODS = [];
    let CLASSROOMS = []; // Teacher-specific classrooms
    let ALL_CLASSROOMS = []; // All classrooms in the school
    let StudentCounts = []; // Teacher-specific student counts
    let ALL_STUDENT_COUNTS = []; // All student counts in the school

    // Set TODAY dynamically to current date
    const TODAY = new Date().toISOString().split('T')[0]; // e.g., "2025-06-03"
    const DEFAULT_LOGO = 'https://i.postimg.cc/RZ0PCqVy/NKW-LOGO.png';

    // Web Worker สำหรับประมวลผลตาราง
    const tableWorker = new Worker(URL.createObjectURL(new Blob([`
        self.onmessage = function(e) {
            const { attendanceLog, statusList, allClassrooms, allStudentCounts, allowedClassroomIds } = e.data;
            const statusCounts = {};
            statusList.forEach(status => statusCounts[status.label] = 0);
            const latestEntries = {};
            if (Array.isArray(attendanceLog)) {
                attendanceLog.forEach(entry => {
                    if (!latestEntries[entry.room_id] || new Date(entry.updated_at || entry.date) > new Date(latestEntries[entry.room_id].updated_at || entry.date)) {
                        latestEntries[entry.room_id] = entry;
                    }
                });
            }
            let totalStudents = 0;
            const tableData = [];
            Object.values(latestEntries).forEach(entry => {
                const classroom = allClassrooms.find(c => c.id === entry.room_id);
                if (classroom) {
                    const dayCounts = {};
                    statusList.forEach(status => dayCounts[status.label] = 0);
                    const classroomName = classroom.name || entry.room_id;
                    if (Array.isArray(entry.students)) {
                        entry.students.forEach(student => {
                            if (statusCounts[student.status] !== undefined) {
                                statusCounts[student.status]++;
                                dayCounts[student.status]++;
                            }
                        });
                    }
                    const studentCountEntry = allStudentCounts.find(sc => sc.room_id === entry.room_id);
                    const studentCount = studentCountEntry ? studentCountEntry.count : 0;
                    totalStudents += studentCount;
                    tableData.push({
                        classroom: classroomName,
                        studentCount: studentCount,
                        counts: dayCounts,
                        checked: true,
                        classroomId: entry.room_id,
                        isResponsible: allowedClassroomIds.includes(entry.room_id)
                    });
                }
            });
            allClassrooms.forEach(classroom => {
                if (!Object.keys(latestEntries).includes(classroom.id)) {
                    const studentCountEntry = allStudentCounts.find(sc => sc.room_id === classroom.id);
                    const studentCount = studentCountEntry ? studentCountEntry.count : 0;
                    totalStudents += studentCount;
                    tableData.push({
                        classroom: classroom.name || classroom.id,
                        studentCount: studentCount,
                        checked: false,
                        counts: statusList.reduce((acc, status) => { acc[status.label] = 0; return acc; }, {}),
                        classroomId: classroom.id,
                        isResponsible: allowedClassroomIds.includes(classroom.id)
                    });
                }
            });
            tableData.sort((a, b) => a.classroom.localeCompare(b.classroom));
            self.postMessage({ tableData, statusCounts, totalStudents });
        };
    `], { type: 'application/javascript' })));

    // Function to check and reset date if expired (1-hour expiration)
    function checkDateExpiration(fieldId, defaultDate) {
        const storedData = JSON.parse(localStorage.getItem(`${fieldId}-selected-date`) || '{}');
        const selectedDate = storedData.date;
        const timestamp = storedData.timestamp;

        if (selectedDate && timestamp) {
            const now = new Date().getTime();
            const expirationTime = 60 * 60 * 1000; // 1 hour in milliseconds
            if (now - timestamp > expirationTime) {
                localStorage.removeItem(`${fieldId}-selected-date`);
                return defaultDate;
            }
            return selectedDate;
        }
        return defaultDate;
    }

      loadInitialData(); // เรียกฟังก์ชันโหลดข้อมูลเริ่มต้น
    });

    // Function to lighten a hex color
    function lightenColor(hex, percent) {
        let r = parseInt(hex.slice(1, 3), 16);
        let g = parseInt(hex.slice(3, 5), 16);
        let b = parseInt(hex.slice(5, 7), 16);
        r = Math.min(255, Math.floor(r + (255 - r) * (percent / 100)));
        g = Math.min(255, Math.floor(g + (255 - g) * (percent / 100)));
        b = Math.min(255, Math.floor(b + (255 - b) * (percent / 100)));
        return `rgb(${r}, ${g}, ${b})`;
    }

    // Function to darken a hex color
    function darkenColor(hex, percent) {
        let r = parseInt(hex.slice(1, 3), 16);
        let g = parseInt(hex.slice(3, 5), 16);
        let b = parseInt(hex.slice(5, 7), 16);
        r = Math.max(0, Math.floor(r * (100 - percent) / 100));
        g = Math.max(0, Math.floor(g * (100 - percent) / 100));
        b = Math.max(0, Math.floor(b * (100 - percent) / 100));
        return `rgb(${r}, ${g}, ${b})`;
    }

    // Function to format date with Thai month names
    function formatDateThai(dateString) {
        try {
            if (!dateString || !/^\d{4}-\d{2}-\d{2}$/.test(dateString)) {
                return "วันที่ไม่ถูกต้อง";
            }
            const monthsThai = [
                "มกราคม", "กุมภาพันธ์", "มีนาคม", "เมษายน", "พฤษภาคม", "มิถุนายน",
                "กรกฎาคม", "สิงหาคม", "กันยายน", "ตุลาคม", "พฤศจิกายน", "ธันวาคม"
            ];
            const parts = dateString.split('-');
            const day = parseInt(parts[2], 10);
            const month = parseInt(parts[1], 10) - 1;
            const year = parseInt(parts[0], 10) + 543;
            return `${day} ${monthsThai[month]} ${year}`;
        } catch (error) {
            console.error('Error in formatDateThai:', error);
            return "วันที่ไม่ถูกต้อง";
        }
    }

    // Utility to wrap google.script.run in a Promise with timeout
    function runGoogleScript(funcName, ...args) {
        return new Promise((resolve, reject) => {
            const timeout = setTimeout(() => {
                reject(new Error('Request timed out'));
            }, 10000); // 10 seconds timeout

            google.script.run
                .withSuccessHandler(response => {
                    clearTimeout(timeout);
                    if (response && typeof response === 'object' && 'status' in response) {
                        resolve(response);
                    } else {
                        reject(new Error('Invalid response format from server'));
                    }
                })
                .withFailureHandler(error => {
                    clearTimeout(timeout);
                    reject(new Error(error.message || 'Failed to execute server function'));
                })
                [funcName](...args);
        });
    }

    function loadPeriodButtons(containerId) {
        try {
            console.log('Loading period buttons for container:', containerId);
            const periodButtonsContainer = $(containerId);
            periodButtonsContainer.empty();
            if (!PERIODS || !PERIODS.length) {
                console.warn('No periods available');
                return;
            }
            PERIODS.forEach(period => {
                const isActive = period.id === "morning";
                const button = $(`
                    <button type="button" class="period-btn px-4 py-2 border rounded-md shadow-sm text-sm font-medium ${isActive ? 'active' : 'text-gray-700 bg-white hover:bg-gray-50'} focus:outline-none" data-period="${period.id}">
                        ${period.name}
                    </button>
                `);
                periodButtonsContainer.append(button);
            });
            $(`${containerId} .period-btn`).click(function() {
                $(`${containerId} .period-btn`).removeClass("active text-white").addClass("text-gray-700 bg-white");
                $(this).addClass("active text-white").removeClass("text-gray-700 bg-white");
                if (containerId === "#period-buttons") {
                    checkDateAndPeriod();
                }
            });
        } catch (error) {
            console.error('Error in loadPeriodButtons:', error);
            Swal.fire({
                icon: 'error',
                title: 'ข้อผิดพลาด',
                text: 'เกิดข้อผิดพลาดในการโหลดปุ่มช่วงเวลา: ' + error.message,
                confirmButtonText: 'ตกลง'
            });
        }
    }

    async function loadClassroomsDropdown(containerId) {
        try {
            console.log('Loading classrooms dropdown for container:', containerId);
            const classroomSelect = $(containerId);
            classroomSelect.empty();
            classroomSelect.append('<option value="">-- เลือกห้องเรียน --</option>');
            const teacher = JSON.parse(localStorage.getItem("teacher") || "null");
            if (!teacher || !teacher.classroom_ids) {
                console.log('No teacher data or classroom_ids, skipping classroom load');
                return;
            }
            const allowedClassroomIds = Array.isArray(teacher.classroom_ids) ? teacher.classroom_ids : teacher.classroom_ids.split(',').map(id => id.trim());

            if (!CLASSROOMS || CLASSROOMS.length === 0) {
                $.LoadingOverlay("show", { text: "กำลังโหลดรายการห้องเรียน..." });
                const response = await runGoogleScript('getClassrooms', allowedClassroomIds);
                $.LoadingOverlay("hide");
                if (response.status !== 'success') {
                    throw new Error(response.error?.details || 'Failed to load classrooms');
                }
                CLASSROOMS = response.data || [];
            }

            if (!CLASSROOMS.length) {
                Swal.fire({
                    icon: 'warning',
                    title: 'ไม่มีห้องเรียน',
                    text: 'ไม่มีข้อมูลห้องเรียนจาก server กรุณาตรวจสอบ Google Sheets',
                    confirmButtonText: 'ตกลง'
                });
                return;
            }

            CLASSROOMS.forEach(classroom => {
                if (allowedClassroomIds.includes(classroom.id)) {
                    classroomSelect.append(`<option value="${classroom.id}">${classroom.name}</option>`);
                }
            });
            if (classroomSelect.find('option').length <= 1) {
                Swal.fire({
                    icon: 'warning',
                    title: 'ไม่มีห้องเรียน',
                    text: 'ไม่มีห้องเรียนที่สามารถเลือกได้ กรุณาตรวจสอบ classroom_ids ใน Google Sheets',
                    confirmButtonText: 'ตกลง'
                });
            }
        } catch (error) {
            $.LoadingOverlay("hide");
            console.error('Error in loadClassroomsDropdown:', error);
            Swal.fire({
                icon: 'error',
                title: 'ข้อผิดพลาด',
                text: 'เกิดข้อผิดพลาดในการโหลดรายการห้องเรียน: ' + error.message,
                confirmButtonText: 'ตกลง'
            });
        }
    }

    async function loadAllClassroomsAndStudents() {
        try {
            $.LoadingOverlay("show", { text: "กำลังโหลดข้อมูลห้องเรียนทั้งโรงเรียน..." });
            const classroomResponse = await runGoogleScript('getClassrooms', []);
            if (classroomResponse.status !== 'success') {
                throw new Error(classroomResponse.error?.details || 'Failed to load all classrooms');
            }
            ALL_CLASSROOMS = classroomResponse.data || [];

            if (ALL_CLASSROOMS.length > 0) {
                const studentResponse = await runGoogleScript('getStudents', ALL_CLASSROOMS.map(c => c.id));
                if (studentResponse.status !== 'success') {
                    throw new Error(studentResponse.error?.details || 'Failed to load student counts');
                }
                const studentsByClassroom = studentResponse.data || {};
                ALL_STUDENT_COUNTS = [];
                for (const roomId in studentsByClassroom) {
                    if (studentsByClassroom.hasOwnProperty(roomId)) {
                        const count = Array.isArray(studentsByClassroom[roomId]) ? studentsByClassroom[roomId].length : 0;
                        ALL_STUDENT_COUNTS.push({ room_id: roomId, count: count });
                    }
                }
            } else {
                ALL_STUDENT_COUNTS = [];
            }
        } catch (error) {
            console.error('Error in loadAllClassroomsAndStudents:', error);
            Swal.fire({
                icon: 'error',
                title: 'ข้อผิดพลาด',
                text: 'เกิดข้อผิดพลาดในการโหลดข้อมูลห้องเรียนทั้งหมด: ' + error.message,
                confirmButtonText: 'ตกลง'
            });
        } finally {
            $.LoadingOverlay("hide");
        }
    }

    async function checkDateAndPeriod() {

            if (date && periodBtn.length > 0) {

                    confirmButtonText: 'ตกลง'
                });
            }
        } catch (error) {
            console.error('Error in checkDateAndPeriod:', error);
            Swal.fire({
                icon: 'error',
                title: 'ข้อผิดพลาด',
                text: 'เกิดข้อผิดพลาดในการตรวจสอบวันที่และช่วงเวลา: ' + error.message,
                confirmButtonText: 'ตกลง'
            });
        }
    }

    async function loadClassroomsTable(date, period) {
        try {
            $.LoadingOverlay("show", { text: "กำลังโหลดตารางห้องเรียน..." });
            const teacher = JSON.parse(localStorage.getItem("teacher") || "null");
            const allowedClassroomIds = teacher && teacher.classroom_ids
                ? Array.isArray(teacher.classroom_ids) ? teacher.classroom_ids : teacher.classroom_ids.split(',').map(id => id.trim())
                : [];
            
            // เช็คว่าเป็น Admin หรือไม่ (ถ้าไม่มี classroom_ids ถือเป็น Admin)
            const isAdmin = !teacher || !teacher.classroom_ids;

            if (!ALL_CLASSROOMS || ALL_CLASSROOMS.length === 0) {
                await loadAllClassroomsAndStudents();
            }

            if (!ALL_CLASSROOMS || !Array.isArray(ALL_CLASSROOMS) || !ALL_CLASSROOMS.length) {
                Swal.fire({
                    icon: 'warning',
                    title: 'ไม่มีห้องเรียน',
                    text: 'ไม่มีข้อมูลห้องเรียนจาก server กรุณาตรวจสอบ Google Sheets',
                    confirmButtonText: 'ตกลง'
                });
                $("#classrooms-container").addClass("hidden");
                $.LoadingOverlay("hide");
                return;
            }

            // 1. ดึงข้อมูลการเช็คชื่อของวันปัจจุบัน
            const attendanceResponse = await runGoogleScript('getAttendance', date, period, null);
            if (attendanceResponse.status !== 'success') {
                throw new Error(attendanceResponse.error?.details || 'Failed to load attendance data');
            }
            const attendanceLog = attendanceResponse.data;

            // 2. 💡 [เพิ่มใหม่] หาวันที่ จันทร์ - ศุกร์ ของสัปดาห์ที่เลือก เพื่อดึงสถานะรายสัปดาห์
            const weekDates = getWeekDates(date);
            const weeklyResponse = await runGoogleScript('getWeeklyAttendanceByRoom', weekDates, period);
            
            // 💡 แก้ไขบรรทัดนี้ให้ดึงเฉพาะ .data ออกมาใช้งาน
            const statusMap = (weeklyResponse.status === 'success') ? weeklyResponse.data : {};

            const classroomsList = $("#classrooms-list");
            classroomsList.empty();

            // ใช้ Web Worker ประมวลผลข้อมูลรายวันเหมือนเดิม
            tableWorker.onmessage = function(e) {
                const { tableData, statusCounts, totalStudents } = e.data;
                const fragment = document.createDocumentFragment();

                tableData.forEach((entry, index) => {
                    // เรียกใช้งานฟังก์ชันสร้างแถบ จ.-ศ. ทั้งหมด (ส่งชื่อห้องและสิทธิ์ไปครบถ้วน)
                    const weeklyStatusHtml = buildWeeklyStatusHtml(entry.classroomId, entry.classroom, weekDates, statusMap, entry.isResponsible);

                    const actionCell = entry.isResponsible
                        ? `
                            <button class="check-attendance-btn px-4 py-2 bg-gradient-to-r from-blue-600 to-indigo-600 text-white rounded-xl shadow-md hover:shadow-lg text-sm font-bold active:scale-95 transition"

    async function loadModalStudents(date, period, classroomId) {

            const response = await runGoogleScript('getStudentsAndAttendance', classroomId, date, period);
            if (response.status !== 'success') {
                throw new Error(response.error?.details || 'Failed to load students and attendance');
            }

            const { students, attendance } = response.data;
            const existingEntry = attendance;

            if (!students || !students.length) {
                studentsList.append(`
                    <tr>
                        <td colspan="5" class="py-10 text-center text-gray-400 font-medium">ไม่พบข้อมูลนักเรียนในห้องเรียนนี้</td>

                    confirmButtonText: 'ตกลง'
                });
                $.LoadingOverlay("hide");
                return;
            }

            const fragment = document.createDocumentFragment();
            students.forEach(student => {
                let studentStatus = "มา";
                let reason = "";
                
                if (existingEntry && Array.isArray(existingEntry.students)) {
                    const studentEntry = existingEntry.students.find(s => String(s.student_id) === String(student.student_id));
                    if (studentEntry) {
                        studentStatus = studentEntry.status;
                        reason = studentEntry.reason || "";

              // สร้างกลุ่มปุ่มกด 5 สถานะ
                const statusButtons = STATUS_LIST.map(statusObj => {
                    let activeCls = '';
                    if (statusObj.label === 'มา') activeCls = 'bg-emerald-500 text-white border-emerald-500 shadow-sm shadow-emerald-200';
                    else if (statusObj.label === 'ขาด') activeCls = 'bg-rose-500 text-white border-rose-500 shadow-sm shadow-rose-200';
                    else if (statusObj.label === 'สาย') activeCls = 'bg-amber-500 text-white border-amber-500 shadow-sm shadow-amber-200';
                    else if (statusObj.label === 'ลา') activeCls = 'bg-blue-500 text-white border-blue-500 shadow-sm shadow-blue-200';
                    else if (statusObj.label === 'ป่วย') activeCls = 'bg-purple-500 text-white border-purple-500 shadow-sm shadow-purple-200';
                    else activeCls = 'bg-gray-800 text-white border-gray-800 shadow-sm';

                    const inactiveCls = 'bg-gray-50 text-gray-400 border-gray-200 hover:bg-gray-100';
                    
                    const isCurrent = statusObj.label === studentStatus;
                    const currentCls = isCurrent ? activeCls : inactiveCls;

                    // กลับมาใช้ flex-1 แบบเดิม แต่จะไปจำกัดขนาดความกว้างที่กล่องครอบ
                    return `<button type="button"
                        class="status-btn flex-1 py-2 px-1 rounded-lg text-[11px] font-bold border transition-all active:scale-95 leading-none min-w-0 whitespace-nowrap ${currentCls}"
                        data-status="${statusObj.label}"
                        data-active-class="${activeCls}"
                        data-inactive-class="${inactiveCls}"
                        onclick="selectStatus(this)">
                        ${statusObj.label}
                    </button>`;
                }).join('');
                
                const row = document.createElement('tr');
                row.className = `bg-white transition-colors duration-300 hover:bg-gray-50`;
                
                row.innerHTML = `
                    <td class="text-center">${student.student_id || ''}</td>

                    <td>${student.name || ''}</td>
                    
                    <td class="text-center align-middle">
                        <input type="hidden" class="modal-student-status" data-student-id="${student.student_id}" value="${studentStatus}">

                    </td>

                fragment.appendChild(row);
            });

            $.LoadingOverlay("hide");
            console.error('Error in loadModalStudents:', error);
            Swal.fire({

                title: 'ข้อผิดพลาด',

        // ฟังก์ชันสลับสีปุ่มและเก็บค่าสถานะเมื่อกดเลือก
    function selectStatus(btnElement) {
        const group = $(btnElement).closest('.status-btn-group');
        const hiddenInput = group.siblings('.modal-student-status');
        const selectedStatus = $(btnElement).data('status');

        // 1. เก็บค่าสถานะลงใน input ที่ซ่อนไว้ (เพื่อให้ระบบ Save ดึงค่าไปใช้ได้เหมือนเดิม)
        hiddenInput.val(selectedStatus);

        // 2. รีเซ็ตปุ่มทั้งหมดในแถวเดียวกันให้เป็นสีเทา (Inactive)
        group.find('.status-btn').each(function() {
            const activeCls = $(this).data('active-class');
            const inactiveCls = $(this).data('inactive-class');
            $(this).removeClass(activeCls).addClass(inactiveCls);
        });

        // 3. เปลี่ยนสีปุ่มที่เพิ่งกดให้เป็นสีสดใส (Active)
        const activeCls = $(btnElement).data('active-class');
        const inactiveCls = $(btnElement).data('inactive-class');
        $(btnElement).removeClass(inactiveCls).addClass(activeCls);
    }

    // 1. ฟังก์ชันหาวันที่ จันทร์ - ศุกร์ จากวันที่เลือก
function getWeekDates(selectedDate) {
  const curr = new Date(selectedDate);
  const dayOfWeek = curr.getDay();
  // ปรับให้อยู่วันจันทร์เสมอ
  const first = curr.getDate() - dayOfWeek + (dayOfWeek === 0 ? -6 : 1); 
  const weekDates = [];
  for (let i = 0; i < 5; i++) {
    const d = new Date(curr.setDate(first + i));
    const localDate = new Date(d.getTime() - (d.getTimezoneOffset() * 60000)).toISOString().split('T')[0];
    weekDates.push(localDate);
  }
  return weekDates;
}

// 2. ฟังก์ชันวาดแถบสถานะ จ. - ศ. (ตามรูป)
function buildWeeklyStatusHtml(roomId, classroomName, weekDates, statusMap, isResponsible, type) {
  if (!isResponsible) return '';
  type = type || 'attendance';

  const dayNames = ['จ.', 'อ.', 'พ.', 'พฤ.', 'ศ.'];
  let html = '<div class="flex items-center space-x-2 text-sm font-medium justify-center">';

  weekDates.forEach((date, index) => {
    const isChecked = statusMap[roomId] && statusMap[roomId][date];
    const clickableStyle = 'cursor: pointer; transition: transform 0.1s;';
    const hoverAttr = `onmouseover="this.style.transform='scale(1.2)'" onmouseout="this.style.transform='scale(1)'"`;

    const clickAction = type === 'cleaning'
      ? `onclick="goToCleaningDateAndCheck('${date}', '${roomId}', '${classroomName}')"`
      : `onclick="goToDateAndCheck('${date}', '${roomId}', '${classroomName}')"`;

    if (isChecked) {
      html += `<span class="text-gray-700 select-none" title="คลิกเพื่อดู/แก้ไข ${date}" ${clickAction} ${hoverAttr} style="${clickableStyle}">${dayNames[index]}<span class="text-emerald-500 font-bold ml-0.5">✓</span></span>`;
    } else {
      html += `<span class="text-gray-700 select-none" title="ยังไม่ได้เช็ค ${date}" ${clickAction} ${hoverAttr} style="${clickableStyle}">${dayNames[index]}<span class="text-red-500 font-bold ml-0.5">⚡</span></span>`;
    }
  });

  html += '</div>';
  return html;
}

            <iframe id="subject-attendance-frame" class="w-full h-full border-none"></iframe>
          </div>
        </div>
      </div>
    `);
  }

  $.LoadingOverlay("show", { text: "กำลังโหลดระบบเช็คชื่อรายวิชา..." });

  google.script.run
    .withSuccessHandler(function (url) {
      const iframe = document.getElementById('subject-attendance-frame');
      // ใส่ cache-buster เพื่อบังคับ reload ทุกครั้งที่เปิด
      iframe.src = url + '?page=subject_attendance&t=' + Date.now();

      iframe.onload = function () {
        $.LoadingOverlay("hide");
        $('#subject-attendance-modal').css('display', 'flex');
      };
    })
    .withFailureHandler(function (err) {
      $.LoadingOverlay("hide");
      Swal.fire('Error', 'ไม่สามารถโหลดหน้าต่างเช็คชื่อรายวิชาได้: ' + err.message, 'error');
    })
    .getScriptUrl(); // ฟังก์ชันนี้มีอยู่แล้วใน Code.gs
}
// CLEANING TAB — Phase 1
// ========================================

async function loadCleaningTable(date) {
  try {
    $.LoadingOverlay("show", { text: "กำลังโหลดตารางเขตพื้นที่..." });
    $("#cleaning-empty").show();
    $("#cleaning-table-container").hide();

    const teacher = JSON.parse(localStorage.getItem("teacher") || "null");
    const allowedClassroomIds = teacher && teacher.classroom_ids
      ? (Array.isArray(teacher.classroom_ids) ? teacher.classroom_ids : teacher.classroom_ids.split(',').map(id => id.trim()))
      : [];

    if (!ALL_CLASSROOMS || ALL_CLASSROOMS.length === 0) {
      await loadAllClassroomsAndStudents();
    }

    if (!ALL_CLASSROOMS || !ALL_CLASSROOMS.length) {
      $.LoadingOverlay("hide");
      Swal.fire('ไม่มีห้องเรียน', 'ไม่พบข้อมูลห้องเรียน', 'warning');
      return;
    }

    // Weekly status
    const weekDates = getWeekDates(date);
    const weeklyResponse = await runGoogleScript('getCleaningWeeklyStatus', weekDates);
    const statusMap = (weeklyResponse.status === 'success') ? weeklyResponse.data : {};

    const tbody = $("#cleaning-list");
    tbody.empty();
    const fragment = document.createDocumentFragment();

    const tableData = ALL_CLASSROOMS.map(classroom => {
      const studentCountEntry = ALL_STUDENT_COUNTS.find(sc => sc.room_id === classroom.id);
      return {
        classroomId: classroom.id,
        classroom: classroom.name || classroom.id,
        studentCount: studentCountEntry ? studentCountEntry.count : 0,
        isResponsible: allowedClassroomIds.includes(classroom.id)
      };
    });

    tableData.sort((a, b) => a.classroom.localeCompare(b.classroom, 'th'));

    tableData.forEach(entry => {
      const weeklyHtml = buildWeeklyStatusHtml(
        entry.classroomId, entry.classroom, weekDates, statusMap, entry.isResponsible, 'cleaning'
      );

      const actionCell = entry.isResponsible
        ? `<button class="cleaning-check-btn px-4 py-2 bg-gradient-to-r from-blue-600 to-indigo-700 text-white rounded-xl shadow-md hover:shadow-lg text-sm font-bold active:scale-95 transition"
                  data-classroom-id="${entry.classroomId}" data-classroom-name="${entry.classroom}">
            เช็คเขตพื้นที่
          </button>`
        : '<span class="text-xs text-gray-400">—</span>';

      const row = document.createElement('tr');
      row.className = 'hover:bg-blue-50 transition-colors border-b border-gray-100';
      row.innerHTML = `
        <td class="px-4 py-4 text-left font-bold text-gray-700">${entry.classroom}</td>
        <td class="px-4 py-4 text-center text-gray-500">${entry.studentCount}</td>
        <td class="px-4 py-4 text-center">${weeklyHtml}</td>
        <td class="px-4 py-4 text-center">${actionCell}</td>
      `;
      fragment.appendChild(row);
    });

    tbody[0].appendChild(fragment);
    $("#cleaning-empty").hide();
    $("#cleaning-table-container").removeClass("hidden").show();
    updateCleaningTitle(date);

    $(".cleaning-check-btn").click(function() {
      openCleaningModal(date, $(this).data("classroom-id"), $(this).data("classroom-name"));
    });

    $.LoadingOverlay("hide");
  } catch (error) {
    $.LoadingOverlay("hide");
    console.error('Error in loadCleaningTable:', error);
    Swal.fire('ข้อผิดพลาด', error.message, 'error');
  }
}

function updateCleaningTitle(date) {
  $("#cleaning-title").html(`
    <span class="text-base text-gray-600">🧹 เขตพื้นที่</span><br>
    <span class="text-xs text-gray-500">${formatDateThai(date)}</span>
  `);
}

function openCleaningModal(date, classroomId, classroomName) {
  if ($('#cleaning-modal').length === 0) {
    $('body').append(`
      <div id="cleaning-modal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/50 backdrop-blur-sm p-4" style="display:none;">
        <div class="app-card w-full max-w-6xl max-h-[92vh] flex flex-col overflow-hidden bg-white shadow-2xl rounded-3xl">
          <div class="flex justify-between items-center p-5 bg-gradient-to-r from-blue-800 to-indigo-900 text-white">
            <h2 id="cleaning-modal-title" class="text-lg font-bold">🧹 เช็คเขตพื้นที่</h2>
            <button type="button" class="text-white hover:text-gray-200 text-2xl font-bold leading-none" onclick="$('#cleaning-modal').hide()">×</button>
          </div>
          <div class="relative flex-grow w-full" style="height: 80vh;">
            <iframe id="cleaning-frame" class="w-full h-full border-none"></iframe>
          </div>
        </div>
      </div>
    `);
  }

  $("#cleaning-modal-title").text(`🧹 เช็คเขตพื้นที่ — ${classroomName} (${formatDateThai(date)})`);

  $.LoadingOverlay("show", { text: "กำลังโหลดระบบเขตพื้นที่..." });

  google.script.run
    .withSuccessHandler(function(url) {
      const iframe = document.getElementById('cleaning-frame');
      iframe.src = url + '?page=cleaning&date=' + encodeURIComponent(date) +
                   '&room=' + encodeURIComponent(classroomId) + '&t=' + Date.now();
      iframe.onload = function() {
        $.LoadingOverlay("hide");
        $('#cleaning-modal').css('display', 'flex');
      };
    })
    .withFailureHandler(function(err) {
      $.LoadingOverlay("hide");
      Swal.fire('Error', 'ไม่สามารถโหลดได้: ' + err.message, 'error');
    })
    .getScriptUrl();
}

function goToCleaningDateAndCheck(dateStr, classroomId, classroomName) {
  $("#cleaning-date").val(dateStr);
  saveSelectedDate("cleaning-date", dateStr);
  const dateInput = document.getElementById('cleaning-date');
  if (dateInput && dateInput._flatpickr) dateInput._flatpickr.setDate(dateStr);
  openCleaningModal(dateStr, classroomId, classroomName);
}

</script>
