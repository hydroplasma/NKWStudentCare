  <script>
    let CACHED_TEACHERS = [], currentStudentData = [], currentSortColumn = '', isAscending = true;
  $(document).ready(() => { const d = new Date(); $('#dashStartDate').val(new Date(d.getFullYear(), d.getMonth(), 1).toISOString().split('T')[0]); $('#dashEndDate').val(d.toISOString().split('T')[0]); loadFilters(); });
  function loadFilters() { google.script.run.withSuccessHandler(res => { if(res.status==='success') { let html = '<label class="checkbox-item"><input type="checkbox" name="filterPeriod" value="" onclick="handleSingleSelect(this)"> <span>ทุกช่วงเวลา</span></label>'; res.data.forEach(p => html += `<label class="checkbox-item"><input type="checkbox" name="filterPeriod" value="${p.id}" onclick="handleSingleSelect(this)"> <span>${p.name}</span></label>`); $('#chkPeriodContainer').html(html); } }).getPeriods(); google.script.run.withSuccessHandler(res => { if(res.status==='success') { let html = '<label class="checkbox-item"><input type="checkbox" name="filterClassroom" value="" onclick="handleSingleSelect(this)"> <span>ทุกห้องเรียน</span></label>'; res.data.forEach(c => html += `<label class="checkbox-item"><input type="checkbox" name="filterClassroom" value="${c.id}" onclick="handleSingleSelect(this)"> <span>${c.name}</span></label>`); $('#chkClassroomContainer').html(html); } }).getClassrooms([]); }
  function handleSingleSelect(cb) { if(cb.checked) $(`input[name="${cb.name}"]`).not(cb).prop('checked', false); }
  function dashRunSummary() { const start = $('#dashStartDate').val(), end = $('#dashEndDate').val(), statusEl = $('input[name="filterStatus"]:checked'), periodEl = $('input[name="filterPeriod"]:checked'), roomEl = $('input[name="filterClassroom"]:checked'); if(!start||!end) return Swal.fire('แจ้งเตือน','กรุณาระบุวันที่','warning'); if(!statusEl.length) return Swal.fire('แจ้งเตือน','กรุณาเลือกสถานะ','warning'); const btn = $('#btnRunSummary'); btn.prop('disabled',true).html('<svg class="animate-spin h-5 w-5 inline mr-2" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> กำลังประมวลผล...'); google.script.run.withSuccessHandler(res => { btn.prop('disabled',false).html('🔍 ประมวลผล'); if(res.status==='success') { currentStudentData = (res.data.students || []).map(s => { s.percentage = s.total_checks > 0 ? parseFloat(((s.filtered_count/s.total_checks)*100).toFixed(1)) : 0; return s; }); renderDashboard(res.data); } else Swal.fire('Error',res.message,'error'); }).withFailureHandler(err => { btn.prop('disabled',false).html('🔍 ประมวลผล'); Swal.fire('Error',err.message,'error'); }).getDashboardStatsSummary(start,end,periodEl.val()?[periodEl.val()]:[], [statusEl.val()], roomEl.val()||""); }
  function renderDashboard(data) { $('#dashSummary').show(); $('#dashTotalFiltered').text(currentStudentData.length || 0); $('#dashTotalChecks').text(data.grandTotalChecks || 0); currentSortColumn = ''; $('.sort-icon').text('↕️').removeClass('opacity-100').addClass('opacity-50'); renderStudentTable(); if(data.periodSummary?.length) renderPeriodSummary(data.periodSummary); else $('#periodSummaryContainer').hide(); setTimeout(()=>document.getElementById('dashSummary').scrollIntoView({behavior:'smooth'}),100); }
  function sortTable(column) { if(!currentStudentData || currentStudentData.length === 0) return; if(currentSortColumn === column) { isAscending = !isAscending; } else { currentSortColumn = column; isAscending = true; } $('.sort-icon').text('↕️').removeClass('opacity-100').addClass('opacity-50'); const iconEl = $(`th[onclick="sortTable('${column}')"] .sort-icon`); iconEl.text(isAscending ? '⬆️' : '⬇️').removeClass('opacity-50').addClass('opacity-100'); currentStudentData.sort((a, b) => { let valA = a[column]; let valB = b[column]; if(typeof valA === 'string') { return isAscending ? valA.localeCompare(valB, 'th') : valB.localeCompare(valA, 'th'); } if(valA < valB) return isAscending ? -1 : 1; if(valA > valB) return isAscending ? 1 : -1; return 0; }); renderStudentTable(); }
  function renderStudentTable() { const tbody = $('#dashTableStudents'); tbody.empty(); currentStudentData.forEach((row,i)=>{ const percent = (row.percentage||0).toFixed(1); tbody.append(`<tr><td class="p-3 text-center">${i+1}</td><td class="p-3">${row.classroom_name}</td><td class="p-3 font-medium">${row.name}</td><td class="p-3 text-center"><span class="px-3 py-1 rounded-full ${row.filtered_count>3?'bg-red-100 text-red-700':'bg-orange-100 text-orange-700'}">${row.filtered_count}</span></td><td class="p-3 text-center font-bold ${percent>=50?'text-red-500':percent>=25?'text-amber-500':'text-gray-600'}">${percent}%</td><td class="p-3 text-center"><button onclick="openPrintSettings('${row.student_id}','${(row.name||'').replace(/'/g,"\\'")}','${(row.classroom_name||'').replace(/'/g,"\\'")}')" class="px-3 py-2 bg-white border rounded-xl text-orange-600 text-xs font-bold hover:bg-orange-50 active:scale-95 transition-transform">🖨️ พิมพ์</button></td></tr>`); }); }
  function renderPeriodSummary(summaryData) { $('#periodSummaryContainer').show(); const thead = $('#summaryPeriodHead'), tbody = $('#summaryPeriodBody'); thead.empty(); tbody.empty(); const periodMap = { morning:'เช้า', noon:'เที่ยง', evening:'เย็น' }; let periods = new Set(); summaryData.forEach(room=>Object.keys(room.periods||{}).forEach(p=>periods.add(p))); periods = Array.from(periods); const maxTotal = summaryData.length ? Math.max(...summaryData.map(r=>r.total)) : 0; let headHtml = '<tr><th class="p-3 text-left">ชั้นเรียน</th>'; periods.forEach(p=>headHtml+=`<th class="p-3 text-center">${periodMap[p.toLowerCase()]||p}</th>`); headHtml += '<th class="p-3 text-center">รวมทั้งหมด</th><th class="p-3 text-center">ร้อยละ</th></tr>'; thead.html(headHtml); summaryData.forEach(room=>{ let rowHtml = `<tr><td class="p-3 font-semibold">${room.classroom}</td>`; periods.forEach(p=>{ const count = room.periods[p]||0; rowHtml+=`<td class="p-3 text-center">${count}</td>`; }); const percent = maxTotal>0 ? ((room.total/maxTotal)*100).toFixed(1) : 0; rowHtml+=`<td class="p-3 text-center font-bold bg-orange-50">${room.total}</td><td class="p-3 text-center font-bold ${percent>=80?'text-emerald-600':percent>=50?'text-amber-500':'text-red-500'}">${percent}%</td></tr>`; tbody.append(rowHtml); }); }
  function selectDocType(btn) { $('.doc-type-btn').removeClass('border-orange-500 bg-orange-500 text-white').addClass('border-gray-300 bg-white text-gray-600'); $(btn).removeClass('border-gray-300 bg-white text-gray-600').addClass('border-orange-500 bg-orange-500 text-white'); $('#printDocType').val($(btn).data('type')); }
  function openPrintSettings(id,name,cls){ $('#printStdId').val(id); $('#printStdName').val(name); $('#printStdClass').val(cls); $('#printDate').val(new Date().toISOString().split('T')[0]); selectDocType($('.doc-type-btn[data-type="parent_notify"]')[0]); $('#printSettingsModal').removeClass('hidden').css('display','flex'); setTimeout(()=>$('#printSettingsSheet').addClass('show'),10); if(!CACHED_TEACHERS.length) google.script.run.withSuccessHandler(res=>{ if(res.status==='success'){ CACHED_TEACHERS=res.data; let html='<option value="">-- เลือกครูที่ปรึกษา --</option>'; const cur=JSON.parse(localStorage.getItem("teacher")||"{}"); CACHED_TEACHERS.forEach(t=>html+=`<option value="${t.name}" ${String(t.id)===String(cur.id)?'selected':''}>${t.name}</option>`); $('#printTeacher').html(html); } }).getTeachers(); else { let html='<option value="">-- เลือกครูที่ปรึกษา --</option>'; const cur=JSON.parse(localStorage.getItem("teacher")||"{}"); CACHED_TEACHERS.forEach(t=>html+=`<option value="${t.name}" ${String(t.id)===String(cur.id)?'selected':''}>${t.name}</option>`); $('#printTeacher').html(html); } }
  function closePrintSettings(){ $('#printSettingsSheet').removeClass('show'); setTimeout(()=>$('#printSettingsModal').addClass('hidden').css('display','none'),300); }
function confirmPrint(){

    const thaiDateHeader=`${d.getDate()} ${months[d.getMonth()]} ${d.getFullYear()+543}`; 
    const start=$('#dashStartDate').val();
    const end=$('#dashEndDate').val(); 
    const statusVal=$('input[name="filterStatus"]:checked').val(); 
    const periodVal = $('input[name="filterPeriod"]:checked').val() || "";

    closePrintSettings(); 
    
    const printWin=window.open('','_blank'); 
    if(!printWin){ Swal.fire('แจ้งเตือน','กรุณาอนุญาต Pop-up','warning'); return; } 
    printWin.document.write('<html><body><h3>กำลังประมวลผลข้อมูล...</h3></body></html>'); 
    
    // ส่งพารามิเตอร์ให้ครบ 6 ตัว: studentId, startDate, endDate, statusFilters, classroomId, periodFilter
    google.script.run.withSuccessHandler(res=>{ 
      if(res.status==='success'){ 
        console.log("วันที่ที่ได้รับ:", res.data); // เช็คใน Console (F12) ว่ามีวันที่มาไหม
        const dateInfo = processDateGroups(res.data.rawDates); 
        generatePrintWindow(printWin, name, cls, statusVal, dateInfo, teacher, thaiDateHeader, docType, periodVal); 
      } else { 
        printWin.close(); Swal.fire('Error', res.message, 'error'); 
      } 
    }).withFailureHandler(err=>{ 
      printWin.close(); Swal.fire('Error', err.message, 'error'); 
    }).getStudentReportData(id, start, end, [statusVal], "", periodVal); 
  }
  function processDateGroups(rawDates){ if(!rawDates?.length) return {text:"-",range:"-"}; const months=["มกราคม","กุมภาพันธ์","มีนาคม","เมษายน","พฤษภาคม","มิถุนายน","กรกฎาคม","สิงหาคม","กันยายน","ตุลาคม","พฤศจิกายน","ธันวาคม"]; const groups={}, ordered=[]; rawDates.forEach(d=>{ const [y,m,day]=d.split('-').map(Number); const key=`${months[m-1]} พ.ศ. ${y+543}`; if(!groups[key]){ groups[key]=[]; ordered.push(key); } groups[key].push(day); }); let text=""; ordered.forEach((k,i)=>{ const days=groups[k].join(", "); text+=i===0?`${days} ${k}`:` และวันที่ ${days} ${k}`; }); const range=ordered.length===1?ordered[0]:`${ordered[0]} ถึงเดือน ${ordered[ordered.length-1]}`; return {text,range}; }
  function generatePrintWindow(win, name, cls, status, dateInfo, teacher, thaiDateHeader, docType, periodVal) {

    let periodText = periodVal === "morning" ? " (ช่วงเช้า)" : periodVal === "noon" ? " (ช่วงเที่ยง)" : periodVal === "evening" ? " (ช่วงเย็น)" : "";

    // กำหนดรายละเอียดตามประเภทเอกสาร
    const configs = {

            signerName: "....................................................",
            signerPosition: "ผู้อำนวยการโรงเรียนน้ำคำวิทยา",
            hasReturn: true,
            isMemo: false // ไม่ใช่บันทึกข้อความ
        },
        teacher_notify: {
            subject: `แจ้งพฤติกรรมการ${statusText}เรียนของนักเรียน`,
            to: `ครูที่ปรึกษาชั้นมัธยมศึกษาปีที่ ${cleanClass} (${teacher})`,
            body: `ตามที่งานระบบดูแลช่วยเหลือนักเรียนได้ตรวจสอบข้อมูลการมาเรียนของนักเรียนในที่ปรึกษาของท่าน พบว่า ${name} นักเรียนชั้นมัธยมศึกษาปีที่ ${cleanClass} มีสถิติการ${statusText}เรียน${periodText} ในช่วงเดือน ${dateInfo.range} ในวันที่ดังนี้: ${dateInfo.text}<br><br>จึงเรียนมาเพื่อโปรดทราบและดำเนินการติดตาม กำกับดูแล และให้ความช่วยเหลือนักเรียนในความปกครองของท่านตามระเบียบของโรงเรียนต่อไป`,
            signerName: "....................................................",
            signerPosition: "หัวหน้างานระบบดูแลช่วยเหลือนักเรียน",
            hasReturn: false,
            isMemo: true // เป็นบันทึกข้อความ
        },
        parent_invite: {
            subject: `ขอเชิญผู้ปกครองมาพบเพื่อปรึกษาหารือ`,
            to: `ผู้ปกครองของ ${name}`,
            body: `เนื่องด้วย ${name} นักเรียนชั้นมัธยมศึกษาปีที่ ${cleanClass} ซึ่งอยู่ในความปกครองของท่าน มีสถิติการ${statusText}เรียนสะสมอย่างต่อเนื่อง เพื่อร่วมกันหาแนวทางในการส่งเสริมและช่วยเหลือนักเรียนให้มีพฤติกรรมการเรียนที่ดีขึ้น โรงเรียนจึงใคร่ขอเรียนเชิญท่านผู้ปกครองมาพบครูที่ปรึกษา ในวันที่ ........................................................ เวลา ................... น. ณ ห้องแนะแนว โรงเรียนน้ำคำวิทยา<br><br>จึงเรียนมาเพื่อโปรดให้ความอนุเคราะห์เข้าร่วมประชุมโดยพร้อมเพรียงกัน`,
            attachment: `สถิติการ${statusText}เรียน${periodText} วันที่ ${dateInfo.text}`,
            signerName: "....................................................",
            signerPosition: "ผู้อำนวยการโรงเรียนน้ำคำวิทยา",
            hasReturn: true,
            isMemo: false // ไม่ใช่บันทึกข้อความ
        }
    };

    const cfg = configs[docType];

    win.document.open();
    win.document.write(`
    <!DOCTYPE html>
    <html lang="th">
    <head>
      <meta charset="UTF-8">
      <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;700&display=swap" rel="stylesheet">
      <style>

        .page { background: white; width: 210mm; min-height: 297mm; padding: 2.5cm 2cm 2cm 3cm; margin: auto; box-sizing: border-box; box-shadow: 0 0 10px rgba(0,0,0,0.1); position: relative; display: flex; flex-direction: column; }

        .sig-section { margin-top: 40px; text-align: center; width: 350px; margin-left: auto; margin-right: 0; }
        .footer-section { position: absolute; bottom: 2cm; left: 3cm; font-size: 14pt; line-height: 1.6; }
        .return-box { margin-top: 50px; border-top: 1px dashed #333; padding-top: 20px; }
        @media print { body { background: none; } .page { box-shadow: none; margin: 0; } .toolbar { display: none; } }
      </style>
    </head>
    <body>
      <div class="toolbar">
        <button onclick="window.print()" style="padding:5px 10px; border:1px solid #ccc; border-radius:5px; background:white; cursor:pointer;">🖨️ พิมพ์</button>
      </div>
      <div class="page">
        <div class="main-content">
          ${cfg.isMemo ? `
            <div style="text-align:center; font-weight:bold;">บันทึกข้อความ</div>
            <div style="display: grid; grid-template-columns: 1fr 1fr; margin-top: 1em;">
                <div><b contenteditable="true">ส่วนราชการ</b> <span contenteditable="true">โรงเรียนน้ำคำวิทยา อำเภอเมืองศรีสะเกษ จังหวัดศรีสะเกษ</span></div>
                <div style="text-align: right;"><b contenteditable="true">วันที่</b> <span contenteditable="true">${thaiDateHeader}</span></div>
                <div><b contenteditable="true">ที่</b> <span contenteditable="true">ศธ ๐๔๒๑๕.๐๘๔ / ........................</span></div>
            </div>
          ` : `
            <div class="krut">ตราครุฑ</div>
            <div style="text-align: right;">
              <div contenteditable="true">โรงเรียนน้ำคำวิทยา</div>
              <div contenteditable="true">อำเภอเมืองศรีสะเกษ จังหวัดศรีสะเกษ ๓๓๐๐๐</div>
            </div>
            <div style="margin-top: 2em;">
              <span contenteditable="true">${thaiDateHeader}</span>
            </div>
          `}

          <div style="margin-top: 1em;"><b>เรื่อง</b> <span contenteditable="true">${cfg.subject}</span></div>
          <div><b>เรียน</b> <span contenteditable="true">${cfg.to}</span></div>
          ${cfg.attachment ? `<div><b>สิ่งที่ส่งมาด้วย</b> <span contenteditable="true">${cfg.attachment}</span></div>` : ''}

          <div class="content" contenteditable="true">${cfg.body}</div>
          
          <div class="sig-section">
