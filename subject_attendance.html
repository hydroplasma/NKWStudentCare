<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>เช็คชื่อเข้าเรียนรายวิชา</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
  <script src="https://npmcdn.com/flatpickr/dist/l10n/th.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
  <style>
    body { background-color: #f5f5f5; font-family: sans-serif; }
    .app-card { background-color: #ffffff; border-radius: 28px; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.04); }
    input[type="text"], select { border-radius: 20px !important; background-color: #f9fafb !important; border: 1px solid #e5e7eb !important; padding: 10px 16px !important; }
    .btn-save { background: linear-gradient(135deg, #f97316, #ea580c); color: white; border-radius: 40px; padding: 12px 24px; font-weight: bold; }

    /* ==== Status Radio Buttons ==== */
    .status-radio-group {
      display: flex;
      gap: 6px;
      justify-content: center;
      flex-wrap: nowrap;
    }
    .status-radio { display: none; }
    .status-label {
      padding: 7px 16px;
      border-radius: 40px;
      font-size: 13px;
      font-weight: 700;
      border: 2px solid #e5e7eb;
      background: #f9fafb;
      color: #6b7280;
      cursor: pointer;
      transition: all 0.15s ease;
      user-select: none;
      white-space: nowrap;
      min-width: 56px;
      text-align: center;
      display: inline-block;
    }
    .status-label:hover { transform: translateY(-1px); box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    .status-radio:checked + .status-label[data-status="มา"]   { background: #22c55e; color: #fff; border-color: #22c55e; box-shadow: 0 2px 8px rgba(34,197,94,0.35); }
    .status-radio:checked + .status-label[data-status="ขาด"]  { background: #ef4444; color: #fff; border-color: #ef4444; box-shadow: 0 2px 8px rgba(239,68,68,0.35); }
    .status-radio:checked + .status-label[data-status="ลา"]   { background: #3b82f6; color: #fff; border-color: #3b82f6; box-shadow: 0 2px 8px rgba(59,130,246,0.35); }
    .status-radio:checked + .status-label[data-status="สาย"]  { background: #eab308; color: #fff; border-color: #eab308; box-shadow: 0 2px 8px rgba(234,179,8,0.35); }
    .status-radio:checked + .status-label[data-status="ป่วย"] { background: #a855f7; color: #fff; border-color: #a855f7; box-shadow: 0 2px 8px rgba(168,85,247,0.35); }
  </style>
</head>
<body class="p-4">
  <div class="max-w-4xl mx-auto">
    <div class="app-card p-6 mb-4 text-center">
      <h1 class="text-xl font-bold text-gray-800">📚 ระบบเช็คชื่อเข้าเรียนรายวิชา</h1>
    </div>

    <!-- เลือกวันที่และคาบสอน -->
    <div class="app-card p-6 mb-4 grid grid-cols-1 md:grid-cols-2 gap-4 items-end">
      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-1">📅 วันที่เช็คชื่อ</label>
        <input type="text" id="subject-date" class="w-full bg-white cursor-pointer" placeholder="คลิกเพื่อเลือกวันที่">
      </div>
      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-1">⏰ เลือกคาบสอน / วิชา</label>
        <select id="subject-schedule-select" class="w-full bg-white font-medium">
          <option value="">-- กรุณาเลือกคาบสอน --</option>
        </select>
      </div>
    </div>

    <!-- ตารางรายชื่อนักเรียน -->
    <div id="subject-attendance-container" class="app-card p-6 hidden">
      <div class="flex justify-between items-center mb-4 flex-wrap gap-2">
        <div>
          <h3 id="class-info-title" class="font-bold text-gray-800"></h3>
          <p id="class-info-sub" class="text-xs text-gray-500"></p>
          <p id="existing-hint" class="text-xs text-emerald-600 font-semibold mt-1 hidden">✏️ มีการบันทึกไว้แล้ว — แก้ไขได้เลย</p>
        </div>
        <button id="mark-all-present" class="bg-emerald-50 text-emerald-600 border border-emerald-200 px-4 py-2 rounded-xl text-xs font-bold">✓ มาทั้งหมด</button>
      </div>

      <div class="overflow-x-auto rounded-2xl border border-gray-100 mb-4">
        <table class="w-full border-collapse text-sm">
          <thead>
            <tr class="bg-orange-500 text-white">
              <th class="p-3 text-center w-16">เลขที่</th>
              <th class="p-3 text-left">ชื่อ-สกุล</th>
              <th class="p-3 text-center" style="min-width: 300px;">สถานะ</th>
              <th class="p-3 text-left w-44">หมายเหตุ</th>
            </tr>
          </thead>
          <tbody id="subject-student-tbody" class="bg-white"></tbody>
        </table>
      </div>

      <button id="save-subject-attendance-btn" class="w-full btn-save shadow-lg shadow-orange-500/20">💾 บันทึกผลการเข้าเรียน</button>
    </div>
  </div>

  <script>
    let currentScheduleList = [];
    let selectedSchedule = null;
    let currentDateStr = '';

    $(document).ready(function() {
      const params = new URLSearchParams(window.location.search);
      const preselectDate = params.get('date');
      const preselectSubject = params.get('subject');
      const targetDate = preselectDate || new Date().toISOString().split('T')[0];
      currentDateStr = targetDate;

      flatpickr("#subject-date", {
        dateFormat: "Y-m-d",
        defaultDate: targetDate,
        locale: "th",
        allowInput: true,
        onChange: function(selectedDates, dateStr) {
          if (!dateStr || dateStr === currentDateStr) return;
          currentDateStr = dateStr;
          loadTeacherSchedule(dateStr);
        }
      });

      loadTeacherSchedule(targetDate, preselectSubject);
    });

    function loadTeacherSchedule(dateStr, preselectSubject) {
  const teacher = JSON.parse(localStorage.getItem('teacher') || '{}');
  const teacherEmail = teacher.email || teacher.username;

  console.log('[loadTeacherSchedule] date =', dateStr, ', email =', teacherEmail);

  if (!teacherEmail) {
    Swal.fire('ผิดพลาด', 'ไม่พบข้อมูลครูผู้ใช้ระบบ', 'error');
    return;
  }

  Swal.fire({
    title: 'กำลังโหลดตารางสอน...',
    html: `<div style="color:#666;font-size:14px;margin-top:8px;">วันที่ ${formatDateThai(dateStr)}</div>`,
    allowOutsideClick: false,
    allowEscapeKey: false,
    didOpen: () => Swal.showLoading()
  });

  const select = $('#subject-schedule-select');
  select.html('<option value="">-- กำลังโหลด... --</option>');
  $('#subject-attendance-container').addClass('hidden');
  selectedSchedule = null;
  currentScheduleList = [];

  google.script.run
    .withSuccessHandler(function(res) {
      console.log('[getTeacherSubjectSchedule] response =', res);
      Swal.close();

      if (res && res.status === 'success') {
        currentScheduleList = res.data || [];
        select.empty();
        select.append('<option value="">-- กรุณาเลือกคาบสอน --</option>');

        if (currentScheduleList.length === 0) {
          const hint = res.message ? ` (${res.message})` : '';
          select.html(`<option value="">-- ไม่มีตารางสอนในวันนี้${hint} --</option>`);
          return;
        }

        let preselectIndex = -1;
        currentScheduleList.forEach((sch, index) => {
          let codeText = sch.subjectCode ? ` (${sch.subjectCode})` : '';
          let roomText = "";
          if (sch.gradeLevel && sch.room) roomText = ` - ${sch.gradeLevel}/${sch.room}`;
          else if (sch.gradeLevel || sch.room) roomText = ` - ${sch.gradeLevel || sch.room}`;
          select.append(`<option value="${index}">คาบที่ ${sch.period} : ${sch.subjectName}${codeText}${roomText}</option>`);
          if (preselectSubject && sch.subjectCode === preselectSubject && preselectIndex === -1) preselectIndex = index;
        });
        if (preselectIndex >= 0) select.val(String(preselectIndex)).trigger('change');
      } else {
        const errMsg = (res && res.message) ? res.message : 'response ไม่ถูกต้อง';
        select.html(`<option value="">-- โหลดไม่สำเร็จ: ${errMsg} --</option>`);
        Swal.fire('ผิดพลาด', 'ไม่สามารถโหลดตารางสอนได้: ' + errMsg, 'error');
      }
    })
    .withFailureHandler(function(err) {
      console.error('[getTeacherSubjectSchedule] FAILED =', err);
      Swal.close();
      const msg = (err && err.message) ? err.message : 'Unknown error';
      select.html(`<option value="">-- โหลดไม่สำเร็จ: ${msg} --</option>`);
      Swal.fire('ผิดพลาด', 'ไม่สามารถโหลดตารางสอนได้: ' + msg, 'error');
    })
    .getTeacherSubjectSchedule(teacherEmail, dateStr);
}

    function formatDateThai(dateStr) {
      try {
        if (!dateStr) return '';
        const months = ["ม.ค.","ก.พ.","มี.ค.","เม.ย.","พ.ค.","มิ.ย.","ก.ค.","ส.ค.","ก.ย.","ต.ค.","พ.ย.","ธ.ค."];
        const [y,m,d] = dateStr.split('-');
        return `${parseInt(d)} ${months[parseInt(m)-1]} ${parseInt(y)+543}`;
      } catch(e) { return dateStr; }
    }

    // === 2. เลือกคาบสอน → โหลดนักเรียน + ข้อมูลที่เคยบันทึก ===
    $('#subject-schedule-select').change(function() {
      const index = $(this).val();
      if (index === '') {
        $('#subject-attendance-container').addClass('hidden');
        selectedSchedule = null;
        return;
      }
      selectedSchedule = currentScheduleList[index];
      loadClassroomStudents(selectedSchedule, currentDateStr);
    });

    function loadClassroomStudents(sch, dateStr) {
      Swal.fire({
        title: 'กำลังโหลดรายชื่อนักเรียน...',
        allowOutsideClick: false,
        allowEscapeKey: false,
        didOpen: () => Swal.showLoading()
      });

      // ขั้นที่ 1: ดึงรายชื่อนักเรียน
      google.script.run
        .withSuccessHandler(function(resStudents) {
          // ขั้นที่ 2: ดึงข้อมูลที่เคยบันทึกไว้ (ถ้ามี)
          google.script.run
            .withSuccessHandler(function(resAtt) {
              Swal.close();
              renderStudentTable(sch, resStudents, resAtt, dateStr);
            })
            .withFailureHandler(function() {
              Swal.close();
              renderStudentTable(sch, resStudents, null, dateStr);
            })
            .getSubjectAttendanceForEdit(
              dateStr, sch.subjectCode, sch.subjectName, sch.gradeLevel, sch.room
            );
        })
        .withFailureHandler(function(err) {
          Swal.close();
          Swal.fire('ผิดพลาด', 'ไม่สามารถโหลดรายชื่อนักเรียนได้: ' + err.message, 'error');
        })
        .getClassroomStudents(sch.classroomId);
    }

    // === 3. วาดตารางด้วย Radio Button ===
    function renderStudentTable(sch, resStudents, resAtt, dateStr) {
      const students = (resStudents && resStudents.students) || [];

      const existingMap = {};
      let hasExisting = false;
      if (resAtt && resAtt.status === 'success' && Array.isArray(resAtt.data)) {
        resAtt.data.forEach(r => {
          existingMap[String(r.student_id)] = { status: r.status, note: r.note || '' };
          hasExisting = true;
        });
      }

      let codeText = sch.subjectCode ? ` (${sch.subjectCode})` : '';
      $('#class-info-title').text(`📋 วิชา ${sch.subjectName}${codeText}`);

      let roomText = "";
      if (sch.gradeLevel && sch.room) roomText = `${sch.gradeLevel}/${sch.room}`;
      else if (sch.gradeLevel || sch.room) roomText = `${sch.gradeLevel || sch.room}`;

      $('#class-info-sub').text(`ห้อง: ${roomText} | คาบที่: ${sch.period} | วันที่: ${formatDateThai(dateStr)}`);
      $('#existing-hint').toggleClass('hidden', !hasExisting);

      const tbody = $('#subject-student-tbody');
      tbody.empty();

      if (students.length === 0) {
        tbody.append('<tr><td colspan="4" class="text-center p-6 text-gray-400">ไม่พบรายชื่อนักเรียน</td></tr>');
        $('#subject-attendance-container').removeClass('hidden');
        return;
      }

      const statuses = ['มา', 'ขาด', 'ลา', 'สาย', 'ป่วย'];

      students.forEach((s, idx) => {
        const existing = existingMap[String(s.student_id)];
        const currentStatus = existing ? existing.status : 'มา';
        const currentNote = existing ? existing.note : '';
        const sid = s.student_id;

        const radios = statuses.map(st => {
          const checked = st === currentStatus ? 'checked' : '';
          return `
            <input type="radio" class="status-radio"
                   name="status_${sid}" id="st_${sid}_${st}"
                   value="${st}" data-student-id="${sid}" ${checked}>
            <label for="st_${sid}_${st}" class="status-label" data-status="${st}">${st}</label>
          `;
        }).join('');

        tbody.append(`
          <tr class="border-b border-gray-50 hover:bg-orange-50/40">
            <td class="p-3 text-center text-gray-600">${s.no || (idx + 1)}</td>
            <td class="p-3 text-gray-800 font-medium">${s.name}</td>
            <td class="p-3 text-center">
              <div class="status-radio-group">${radios}</div>
            </td>
            <td class="p-3">
              <input type="text" class="student-attend-note w-full text-xs"
                     data-student-id="${sid}" placeholder="หมายเหตุ" value="${currentNote}">
            </td>
          </tr>
        `);
      });

      $('#subject-attendance-container').removeClass('hidden');
    }

    // === 4. มาทั้งหมด ===
    $('#mark-all-present').click(function() {
      $('.status-radio[value="มา"]').prop('checked', true);
    });

    // === 5. บันทึก (แก้ไขย้อนหลังได้) ===
    $('#save-subject-attendance-btn').click(function() {
      if (!selectedSchedule) {
        Swal.fire('กรุณาเลือกคาบสอน', '', 'warning');
        return;
      }

      const date = $('#subject-date').val() || currentDateStr;
      const teacher = JSON.parse(localStorage.getItem('teacher') || '{}');
      const teacherEmail = teacher.email || teacher.username;

      const studentsPayload = [];
      const seen = new Set();

      $('input[type="radio"].status-radio:checked').each(function() {
        const sid = String($(this).data('student-id'));
        if (seen.has(sid)) return;
        seen.add(sid);

        const status = $(this).val();
        const row = $(this).closest('tr');
        const note = row.find('.student-attend-note').val() || '';
        const studentName = row.find('td:nth-child(2)').text().trim();

        studentsPayload.push({ student_id: sid, name: studentName, status, note });
      });

      if (studentsPayload.length === 0) {
        Swal.fire('ไม่มีข้อมูลนักเรียน', 'กรุณาโหลดรายชื่อก่อนบันทึก', 'warning');
        return;
      }

      const payload = {
        date: date,
        subjectCode: selectedSchedule.subjectCode,
        subjectName: selectedSchedule.subjectName,
        teacherEmail: teacherEmail,
        gradeLevel: selectedSchedule.gradeLevel,
        room: selectedSchedule.room,
        students: studentsPayload
      };

      Swal.fire({
        title: 'กำลังบันทึก...',
        allowOutsideClick: false,
        allowEscapeKey: false,
        didOpen: () => Swal.showLoading()
      });

      google.script.run
        .withSuccessHandler(function(res) {
          Swal.close();
          if (res && res.status === 'success') {
            Swal.fire({
              title: 'สำเร็จ',
              html: `${res.message || 'บันทึกเรียบร้อย'}<br><small class="text-gray-500">${formatDateThai(date)}</small>`,
              icon: 'success',
              timer: 2000,
              showConfirmButton: false
            }).then(() => {
              if (selectedSchedule) loadClassroomStudents(selectedSchedule, date);
            });
          } else {
            Swal.fire('เกิดข้อผิดพลาด', res ? res.message : 'ไม่สามารถบันทึกได้', 'error');
          }
        })
        .withFailureHandler(function(err) {
          Swal.close();
          Swal.fire('ผิดพลาด', err.message, 'error');
        })
        .saveSubjectAttendance(JSON.stringify(payload));
    });
  </script>
</body>
</html>
