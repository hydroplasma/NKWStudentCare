<script>
    function loadClassroomSummary() {
        try {
            console.log('Loading classroom summary');
            $("#summary-classroom").val("");
            $("#summary-date").val(checkDateExpiration("summary-date", TODAY));
            $("#summary-period-buttons .period-btn").removeClass("active bg-indigo-600 text-white").addClass("text-gray-700 bg-white");
            $("#summary-period-buttons .period-btn[data-period='morning']").addClass("active bg-indigo-600 text-white").removeClass("text-gray-700 bg-white");
            $("#classroom-summary-list").empty();
            $("#classroom-students-list").empty();
            if (window.classroomPieChart) {
                window.classroomPieChart.destroy();
                window.classroomPieChart = null;
            }
            if (window.classroomBarChart) {
                window.classroomBarChart.destroy();
                window.classroomBarChart = null;
            }
            $("#empty-dashboard").show();
            $("#classroom-chart-container").hide();
            $("#classroom-table-container").hide();
            $("#classroom-students-list-container").hide();
            // Removed line related to classroom-preview-btn
            loadClassroomsDropdown("#summary-classroom");
            updateClassroomSummaryTitle();
        } catch (error) {
            console.error('Error in loadClassroomSummary:', error);
            Swal.fire({
                icon: 'error',
                title: 'ข้อผิดพลาด',
                text: 'เกิดข้อผิดพลาดในการโหลดสรุปตามห้องเรียน: ' + error.message,
                confirmButtonText: 'ตกลง'
            });
        }
    }

    async function updateClassroomSummaryTitle() {
        try {
            const classroomId = $("#summary-classroom").val();
            const date = $("#summary-date").val() || TODAY;
            const period = $("#summary-period-buttons .period-btn.active").data("period") || 'morning';
            const periodName = period ? PERIODS.find(p => p.id === period)?.name || period : 'เช้า';
            
            const teacher = JSON.parse(localStorage.getItem("teacher") || "{}");
            if (!teacher || !teacher.classroom_ids) {
                // If no teacher data, set a default title and return
                const schoolName = CONFIG.school_config.schoolName || 'โรงเรียน';
                 $("#classroom-summary-title").html(`
                    สรุปเช็คชื่อนักเรียน ห้อง -- เลือกห้องเรียน --<br>
                    ${schoolName}<br>
                    วันที่ ${formatDateThai(date)} ช่วง${periodName}
                `);
                return;
            }
            const allowedClassroomIds = teacher.classroom_ids;

            $.LoadingOverlay("show");
            const response = await runGoogleScript('getClassrooms', allowedClassroomIds);
            $.LoadingOverlay("hide"); // Hide overlay after script run

            let classroomName = '-- เลือกห้องเรียน --';
            const schoolName = CONFIG.school_config.schoolName || 'โรงเรียน';

            if (response.status === 'success') {
                const classrooms = response.data;
                 if (classrooms && classrooms.length > 0 && classroomId) {
                    classroomName = classrooms.find(c => c.id === classroomId)?.name || classroomId;
                }
            } else {
                console.warn(response.error.details || 'Failed to load classrooms for title');
                // Keep classroomName as '-- เลือกห้องเรียน --' or classroomId if it exists
                if (classroomId) classroomName = classroomId;
            }
            
            $("#classroom-summary-title").html(`
                สรุปเช็คชื่อนักเรียน ห้อง ${classroomName}<br>
                ${schoolName}<br>
                วันที่ ${formatDateThai(date)} ช่วง${periodName}
            `);
        } catch (error) {
            $.LoadingOverlay("hide");
            console.error('Error in updateClassroomSummaryTitle:', error);
             const date = $("#summary-date").val() || TODAY;
            const period = $("#summary-period-buttons .period-btn.active").data("period") || 'morning';
            const periodName = period ? PERIODS.find(p => p.id === period)?.name || period : 'เช้า';
            const schoolName = CONFIG.school_config.schoolName || 'โรงเรียน';
            $("#classroom-summary-title").html(`
                สรุปเช็คชื่อนักเรียน ห้อง -- เลือกห้องเรียน --<br>
                ${schoolName}<br>
                วันที่ ${formatDateThai(date)} ช่วง${periodName}
            `);
            Swal.fire({
                icon: 'error',
                title: 'ข้อผิดพลาด',
                text: 'เกิดข้อผิดพลาดในการอัปเดตหัวข้อสรุปห้องเรียน: ' + error.message,
                confirmButtonText: 'ตกลง'
            });
        }
    }

    async function loadClassroomsDropdown(containerId) { // This function is duplicated in script_main, ensure consistency or refactor
        try {
            console.log('Loading classrooms dropdown for container:', containerId);
            const classroomSelect = $(containerId);
            classroomSelect.empty();
            classroomSelect.append('<option value="">-- เลือกห้องเรียน --</option>');
            const teacher = JSON.parse(localStorage.getItem("teacher") || "{}");
             if (!teacher || !teacher.classroom_ids || !Array.isArray(teacher.classroom_ids) || teacher.classroom_ids.length === 0) {
                console.warn('No teacher data or classroom_ids for dropdown');
                return;
            }
            const allowedClassroomIds = teacher.classroom_ids;

            $.LoadingOverlay("show");
            const response = await runGoogleScript('getClassrooms', allowedClassroomIds);
            $.LoadingOverlay("hide");
            if (response.status !== 'success') {
                throw new Error(response.error.details || 'Failed to load classrooms');
            }
            const classrooms = response.data;
            if (!classrooms || !classrooms.length) {
                 console.warn('No classrooms returned from server for dropdown');
                return;
            }
            classrooms.forEach(classroom => {
                if (allowedClassroomIds.includes(classroom.id)) {
                    classroomSelect.append(`<option value="${classroom.id}">${classroom.name}</option>`);
                }
            });
            if (classroomSelect.find('option').length <= 1) {
                console.warn('No allowed classrooms to populate dropdown');
            }
        } catch (error) {
            $.LoadingOverlay("hide");
            console.error('Error in loadClassroomsDropdown (summary):', error);
            // Avoid Swal here if it's too disruptive for a dropdown load failure
        }
    }

    async function loadClassroomSummaryData(classroomId, date, period) {
        try {
            $.LoadingOverlay("show");
            console.log('Loading classroom summary data for:', { classroomId, date, period });

            const attendanceResponse = await runGoogleScript('getAttendance', date, period, classroomId);
            if (attendanceResponse.status !== 'success') {
                throw new Error(attendanceResponse.error.details || 'Failed to load attendance data');
            }
            const attendanceLog = attendanceResponse.data;
            const filteredData = attendanceLog.filter(entry =>
                entry.room_id === classroomId &&
                entry.date === date &&
                entry.period === period
            ).sort((a, b) => new Date(b.updated_at || b.date) - new Date(a.updated_at || b.date));
            
            if (filteredData.length === 0) {
                $.LoadingOverlay("hide");
                Swal.fire({
                    icon: 'info',
                    title: 'ไม่พบข้อมูล',
                    text: 'ยังไม่มีข้อมูลการเช็คชื่อสำหรับห้องเรียน วันที่ และช่วงเวลาที่เลือก',
                    confirmButtonText: 'ตกลง'
                });
                $("#classroom-chart-container").hide();
                $("#classroom-table-container").hide();
                $("#classroom-students-list-container").hide();
                // Removed line related to classroom-preview-btn
                $("#empty-dashboard").show();
                return;
            }

            const studentResponse = await runGoogleScript('getStudents', [classroomId]);
            if (studentResponse.status !== 'success') {
                throw new Error(studentResponse.error.details || 'Failed to load students');
            }
            const studentsByClassroom = studentResponse.data;
            const students = studentsByClassroom[classroomId] || [];

            const latestEntry = filteredData[0];
            const statusCounts = {};
            STATUS_LIST.forEach(status => {
                statusCounts[status.label] = 0;
            });
            
            const allStudents = [];
            latestEntry.students.forEach(student => {
                if (statusCounts[student.status] !== undefined) {
                    statusCounts[student.status]++;
                } else {
                    console.warn('Unknown status found:', student.status);
                }
                const studentData = students.find(s => String(s.student_id) === String(student.student_id));
                if (studentData) {
                    allStudents.push({
                        student_id: student.student_id,
                        no: studentData.no,
                        name: studentData.name,
                        status: student.status,
                        reason: student.reason || ''
                    });
                }
            });
            
            const tableData = [{
                date: latestEntry.date,
                period: PERIODS.find(p => p.id === latestEntry.period)?.name || latestEntry.period,
                counts: statusCounts
            }];

            updateClassroomTable(tableData, allStudents.length);
            updateClassroomCharts(statusCounts);
            updateClassroomStudentsList(allStudents);

            $("#classroom-table-container").show();
            $("#classroom-chart-container").show();
            $("#classroom-students-list-container").show();
            // Removed lines related to classroom-preview-btn
            $("#empty-dashboard").hide();

            // Removed event listener for classroom-preview-btn

            $.LoadingOverlay("hide");
        } catch (error) {
            $.LoadingOverlay("hide");
            console.error('Error in loadClassroomSummaryData:', error);
            Swal.fire({
                icon: 'error',
                title: 'ข้อผิดพลาด',
                text: 'เกิดข้อผิดพลาดในการโหลดข้อมูลสรุป: ' + error.message,
                confirmButtonText: 'ตกลง'
            });
        }
    }

    function updateClassroomCharts(statusCounts) {
        try {
            const pieCanvas = document.getElementById('classroom-pie-chart');
            if (!pieCanvas) {
                // console.warn('Canvas for classroom pie chart not found.');
                return;
            }
            const pieCtx = pieCanvas.getContext('2d');
            if (window.classroomPieChart) {
                window.classroomPieChart.destroy();
            }
            window.classroomPieChart = new Chart(pieCtx, {
                type: 'pie',
                data: {
                    labels: STATUS_LIST.map(status => status.label),
                    datasets: [{
                        data: STATUS_LIST.map(status => statusCounts[status.label] || 0),
                        backgroundColor: STATUS_LIST.map(status => status.hexColor)
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { position: 'right' },
                        title: {
                            display: true,
                            text: 'สัดส่วนสถานะการเข้าเรียน'
                        }
                    },
                    layout: {
                        padding: 10
                    }
                }
            });

            const barCanvas = document.getElementById('classroom-bar-chart');
             if (!barCanvas) {
                // console.warn('Canvas for classroom bar chart not found.');
                return;
            }
            const barCtx = barCanvas.getContext('2d');
            if (window.classroomBarChart) {
                window.classroomBarChart.destroy();
            }
            window.classroomBarChart = new Chart(barCtx, {
                type: 'bar',
                data: {
                    labels: STATUS_LIST.map(status => status.label),
                    datasets: [{
                        label: 'จำนวนนักเรียน',
                        data: STATUS_LIST.map(status => statusCounts[status.label] || 0),
                        backgroundColor: STATUS_LIST.map(status => status.hexColor)
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false },
                        title: {
                            display: true,
                            text: 'จำนวนนักเรียนตามสถานะการเข้าเรียน'
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            ticks: { precision: 0 }
                        }
                    },
                    layout: {
                        padding: {
                            top: 10,
                            bottom: 10
                        }
                    }
                }
            });

            const pieChartCard = $('#classroom-pie-chart').closest('.bg-white.rounded-lg.shadow.p-4');
            if (pieChartCard.length) {
                 $('#classroom-pie-chart').css({ 'width': '100%', 'height': '300px' });
            }


            const barChartCard = $('#classroom-bar-chart').closest('.bg-white.rounded-lg.shadow.p-4');
             if (barChartCard.length) {
                $('#classroom-bar-chart').css({ 'width': '100%', 'height': '300px' });
            }

        } catch (error) {
            console.error('Error in updateClassroomCharts:', error);
            // Avoid Swal here as it can be too disruptive if charts fail repeatedly
        }
    }

    function updateClassroomTable(tableData, totalStudents) {
        try {
            const container = $("#classroom-summary-list");
            container.empty();
            
            tableData.forEach(entry => {
                const totalCard = `
                    <div class="p-4 text-center rounded-lg shadow-sm" style="background-color: ${lightenColor('#e5e7eb', 20)}; color: #374151;">
                        <div class="flex items-center justify-center mb-2">
                            <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path>
                            </svg>
                            <h3 class="text-sm font-medium">นักเรียนทั้งหมด</h3>
                        </div>
                        <p class="text-lg font-semibold">${totalStudents} คน</p>
                        <p class="text-xs text-gray-500">(100%)</p>
                    </div>
                `;

                const cards = STATUS_LIST.map(status => {
                    const count = entry.counts[status.label] || 0;
                    const percentage = totalStudents > 0 ? ((count / totalStudents) * 100).toFixed(2) : 0;
                    const hexColor = status.hexColor || '#000000';
                    const lighterColor = lightenColor(hexColor, 80);
                    const darkerColor = darkenColor(hexColor, 20);
                    return `
                        <div class="p-4 text-center rounded-lg shadow-sm" style="background-color: ${lighterColor}; color: ${darkerColor};">
                            <div class="flex items-center justify-center mb-2">
                                <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                                </svg>
                                <h3 class="text-sm font-medium">${status.label}</h3>
                            </div>
                            <p class="text-lg font-semibold">${count} คน</p>
                            <p class="text-xs text-gray-500">(${percentage}%)</p>
                        </div>
                    `;
                }).join('');
                
                container.append(`
                    <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-6 gap-4">
                        ${totalCard}
                        ${cards}
                    </div>
                `);
            });
        } catch (error) {
            console.error('Error in updateClassroomTable:', error);
            // Avoid Swal here
        }
    }

    function updateClassroomStudentsList(studentList) {
        try {
            const studentsList = $("#classroom-students-list");
            studentsList.empty();
            
            if (studentList.length === 0) {
                studentsList.append('<tr><td colspan="4" class="px-6 py-4 text-center text-gray-500">ไม่มีข้อมูลนักเรียน</td></tr>');
                return;
            }

            studentList.forEach(student => {
                const row = `
                    <tr class="border-b border-gray-200">
                        <td class="px-6 py-4 whitespace-nowrap border-r border-gray-200">${student.student_id}</td>
                        <td class="px-6 py-4 whitespace-nowrap border-r border-gray-200">${student.no}</td>
                        <td class="px-6 py-4 whitespace-nowrap border-r border-gray-200">${student.name}</td>
                        <td class="px-6 py-4 whitespace-nowrap">${student.status}${student.reason ? ` (${student.reason})` : ''}</td>
                    </tr>
                `;
                studentsList.append(row);
            });

            const table = studentsList.closest('table');
            table.addClass('min-w-full w-full border');
            table.closest('.table-responsive').addClass('w-full');
            table.find('thead tr').addClass('bg-gradient-to-r from-blue-400 to-teal-400 text-white border-b border-gray-300');
            table.find('thead th').addClass('border-r border-gray-300 font-bold');
            table.find('thead th:last-child').removeClass('border-r');
            table.find('tbody tr td:last-child').removeClass('border-r');
        } catch (error) {
            console.error('Error in updateClassroomStudentsList:', error);
            // Avoid Swal here
        }
    }

async function loadCleaningSummary() {
  try {
    $("#cleaning-summary-empty").show();
    $("#cleaning-summary-content").addClass("hidden");

    // Default: ต้นเดือน → วันนี้
    const today = TODAY;
    const start = today.slice(0, 7) + '-01';

    if (!$("#cleaning-summary-start").val()) {
      $("#cleaning-summary-start").val(start);
      flatpickr("#cleaning-summary-start", {
        dateFormat: "Y-m-d", locale: "th", defaultDate: start
      });
    }
    if (!$("#cleaning-summary-end").val()) {
      $("#cleaning-summary-end").val(today);
      flatpickr("#cleaning-summary-end", {
        dateFormat: "Y-m-d", locale: "th", defaultDate: today
      });
    }

    // Load classroom dropdown (เฉพาะครั้งแรก)
    if ($("#cleaning-summary-room option").length <= 1) {
      const cr = await runGoogleScript('getClassrooms', []);
      if (cr.status === 'success') {
        cr.data.forEach(c => {
          $("#cleaning-summary-room").append(`<option value="${c.id}">${c.name}</option>`);
        });
      }
    }

    // Bind run button
    $("#cleaning-summary-run").off("click").on("click", runCleaningSummary);
  } catch (error) {
    console.error('Error in loadCleaningSummary:', error);
  }
}

async function runCleaningSummary() {
  const startDate = $("#cleaning-summary-start").val();
  const endDate = $("#cleaning-summary-end").val();
  const classroomId = $("#cleaning-summary-room").val() || "";

  if (!startDate || !endDate) {
    Swal.fire('แจ้งเตือน', 'กรุณาเลือกช่วงวันที่', 'warning');
    return;
  }
  if (startDate > endDate) {
    Swal.fire('แจ้งเตือน', 'วันที่เริ่มต้นต้องไม่มากกว่าวันที่สิ้นสุด', 'warning');
    return;
  }

  $.LoadingOverlay("show", { text: "กำลังประมวลผล..." });
  try {
    const res = await runGoogleScript('getCleaningStats', {
      startDate, endDate, classroom_id: classroomId
    });

    if (res.status !== 'success') throw new Error(res.message);

    renderCleaningSummary(res.data);
    $("#cleaning-summary-empty").hide();
    $("#cleaning-summary-content").removeClass("hidden");
  } catch (error) {
    console.error('Error:', error);
    Swal.fire('ผิดพลาด', error.message, 'error');
  } finally {
    $.LoadingOverlay("hide");
  }
}

function renderCleaningSummary(data) {
  // ===== Summary Cards =====
  $("#clean-stat-avg").text((data.avgScore || 0) + '%');
  $("#clean-stat-total").text((data.scoreDetails || []).length);

  // Top room
  const roomScores = {};
  (data.scoreDetails || []).forEach(d => {
    if (!roomScores[d.classroom_id]) roomScores[d.classroom_id] = [];
    const [s, m] = String(d.total_score).split('/').map(Number);
    if (!isNaN(s) && !isNaN(m) && m > 0) roomScores[d.classroom_id].push((s / m) * 100);
  });
  let topRoom = '-';
  let topAvg = 0;
  for (const room in roomScores) {
    const avg = roomScores[room].reduce((a, b) => a + b, 0) / roomScores[room].length;
    if (avg > topAvg) {
      topAvg = avg;
      const found = ALL_CLASSROOMS.find(c => c.id === room);
      topRoom = found ? found.name : room;
    }
  }
  $("#clean-stat-top-room").text(topRoom);

  // ===== Top 5 Students =====
  const topTbody = $("#clean-top-students");
  topTbody.empty();
  if (!data.topStudents || data.topStudents.length === 0) {
    topTbody.append('<tr><td colspan="3" class="text-center p-4 text-gray-400">ไม่มีข้อมูล</td></tr>');
  } else {
    // map student_id → name (จาก CONFIG.students ถ้ามี)
    const nameMap = {};
    for (const room in (window.CONFIG_STUDENTS || {})) {
      (window.CONFIG_STUDENTS[room] || []).forEach(s => {
        nameMap[String(s.student_id)] = s.name;
      });
    }

    data.topStudents.forEach((s, i) => {
      const medal = i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : `#${i + 1}`;
      const realName = nameMap[String(s.name)] || s.name;
      topTbody.append(`
        <tr class="border-b border-gray-100 hover:bg-blue-50">
          <td class="p-3 font-semibold text-gray-700">${medal}</td>
          <td class="p-3 text-gray-800">${realName}</td>
          <td class="p-3 text-center font-bold text-emerald-600">${s.done} ครั้ง</td>
        </tr>
      `);
    });
  }

  // ===== Details =====
  const detailTbody = $("#clean-details-list");
  detailTbody.empty();
  if (!data.scoreDetails || data.scoreDetails.length === 0) {
    detailTbody.append('<tr><td colspan="4" class="text-center p-4 text-gray-400">ไม่มีข้อมูล</td></tr>');
  } else {
    data.scoreDetails.forEach(d => {
      const roomName = (ALL_CLASSROOMS.find(c => c.id === d.classroom_id) || {}).name || d.classroom_id;
      detailTbody.append(`
        <tr class="border-b border-gray-100 hover:bg-blue-50">
          <td class="p-3 text-gray-600">${d.date}</td>
          <td class="p-3 font-semibold text-gray-800">${roomName}</td>
          <td class="p-3 text-gray-600">${d.checker}</td>
          <td class="p-3 text-center font-bold text-blue-700">${d.total_score}</td>
        </tr>
      `);
    });
  }

  renderCleaningCharts(data.studentStats || [], data.scoreDetails || []);
  renderCleaningStudentList(data.allStudents || data.studentStats || []);
}

function renderCleaningCharts(studentStats, scoreDetails) {
  let done = 0;
  let notDone = 0;
  let leave = 0;
  (studentStats || []).forEach(student => {
    done += Number(student.done) || 0;
    notDone += Number(student.not_done) || 0;
    leave += Number(student.leave) || 0;
  });

  const pieCanvas = document.getElementById('clean-pie-chart');
  if (pieCanvas) {
    if (window.cleanPieChart) window.cleanPieChart.destroy();
    window.cleanPieChart = new Chart(pieCanvas.getContext('2d'), {
      type: 'pie',
      data: {
        labels: ['ทำ', 'ไม่ทำ', 'ลา'],
        datasets: [{ data: [done, notDone, leave], backgroundColor: ['#10b981', '#f97316', '#ef4444'] }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { position: 'right' }, title: { display: true, text: 'สัดส่วนการทำเวร' } }
      }
    });
  }

  const roomBuckets = {};
  (scoreDetails || []).forEach(detail => {
    const [score, maxScore] = String(detail.total_score).split('/').map(Number);
    if (!Number.isFinite(score) || !Number.isFinite(maxScore) || maxScore <= 0) return;
    const roomId = String(detail.classroom_id || '');
    if (!roomBuckets[roomId]) roomBuckets[roomId] = [];
    roomBuckets[roomId].push((score / maxScore) * 100);
  });

  const roomLabels = [];
  const roomValues = [];
  Object.keys(roomBuckets).sort().forEach(roomId => {
    const scores = roomBuckets[roomId];
    const average = scores.reduce((sum, score) => sum + score, 0) / scores.length;
    const classroom = (ALL_CLASSROOMS || []).find(item => String(item.id) === roomId);
    roomLabels.push(classroom ? classroom.name : roomId);
    roomValues.push(Number(average.toFixed(1)));
  });

  const barCanvas = document.getElementById('clean-bar-chart');
  if (barCanvas) {
    if (window.cleanBarChart) window.cleanBarChart.destroy();
    window.cleanBarChart = new Chart(barCanvas.getContext('2d'), {
      type: 'bar',
      data: {
        labels: roomLabels,
        datasets: [{ label: 'คะแนนเฉลี่ย (%)', data: roomValues, backgroundColor: '#2563eb' }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { display: false }, title: { display: true, text: 'คะแนนเฉลี่ยแต่ละห้อง' } },
        scales: { y: { beginAtZero: true, max: 100 } }
      }
    });
  }
}

let currentSubjectCtx = null;

function escapeSummaryHtml(value) {
  return String(value == null ? '' : value).replace(/[&<>"']/g, char => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[char]));
}

function initSubjectSummary() {
  const teacher = JSON.parse(localStorage.getItem('teacher') || '{}');
  const teacherId = teacher.username || teacher.name || teacher.email || '';

  const today = TODAY;
  const [year, month] = today.split('-').map(Number);

  if (!document.getElementById('summary-subject-start')._flatpickr) {

      type: 'pie',
      data: {
        labels: ['มา', 'ขาด', 'สาย', 'ลา', 'ป่วย'],
        datasets: [{
          data: [totals.present || 0, totals.absent || 0, totals.late || 0, totals.leave || 0, totals.sick || 0],

  const barCanvas = document.getElementById('subject-bar-chart');

        datasets: [
          { label: 'มา', data: present, backgroundColor: '#10b981', stack: 'total' },
          { label: 'ขาด/ลา/สาย/ป่วย', data: others, backgroundColor: '#ef4444', stack: 'total' }

        scales: { x: { stacked: true }, y: { stacked: true, beginAtZero: true, ticks: { precision: 0 } } }

function riskEscapeHtml(value) {
  return String(value == null ? '' : value).replace(/[&<>"']/g, function(char) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[char];
  });
}

function logGeneratedRiskDocumentFor(tabId, documentType, studentId, documentNo) {
  const st = riskViewState[tabId];
  const period = st && st.lastData && st.lastData.period ? st.lastData.period : {};
  let actorName = '';
  try {
    const teacher = JSON.parse(localStorage.getItem('teacher') || '{}');
    actorName = teacher.name || '';
  } catch (error) {
    console.warn('Could not read current app user name for document log:', error);
  }
  return runGoogleScript(
    'logRiskDocumentGeneration', documentType, studentId || '',
    period.startDate || '', period.endDate || '', documentNo || '', actorName
  ).then(function(response) {
    if (!response || response.status !== 'success') throw new Error((response && response.message) || 'บันทึกไม่สำเร็จ');
  }).catch(function(error) {
    console.error('Document created, but its log entry could not be saved:', error);
    Swal.fire('แจ้งเตือน', `สร้างเอกสารแล้ว แต่บันทึกประวัติการสร้างเอกสารไม่สำเร็จ: ${error.message || 'เกิดข้อผิดพลาด'}`, 'warning');
  });
}

function initRiskView(tabId) {
  const $tab = $('#' + tabId);
  const mode = $tab.data('risk-mode') || 'week';
  const prefix = $tab.data('risk-prefix') || 'r';

  if (!$tab.data('initialized')) {
    $tab.data('initialized', true);
    $tab.html(buildRiskViewHtml(prefix));
    const $roomSel = $tab.find('.' + prefix + '-classroom');
    ALL_CLASSROOMS.forEach(c => $roomSel.append(`<option value="${c.id}">${c.name}</option>`));
    riskViewState[tabId] = {
      mode, prefix,
      startDate: null, endDate: null,
      classroomFilter: '',
      weights: { attendance: 40, cleaning: 30, subject: 30 },
      lastData: null,
      loaded: false
    };
    $tab.find('.' + prefix + '-prev').on('click', () => shiftRiskView(tabId, -1));
    $tab.find('.' + prefix + '-next').on('click', () => shiftRiskView(tabId, 1));
    $tab.find('.' + prefix + '-run').on('click', () => loadRiskView(tabId));
    $tab.find('.' + prefix + '-print').on('click', () => printRiskSummaryFor(tabId));
    $tab.find('.' + prefix + '-settings').on('click', () => openRiskSettings(tabId));
    $tab.find('.' + prefix + '-classroom').on('change', function() {
      riskViewState[tabId].classroomFilter = $(this).val();
    });
    $tab.find('.' + prefix + '-settings-save').on('click', () => saveRiskSettings(tabId));
    setRiskPeriodFor(tabId, TODAY);
  }

  const st = riskViewState[tabId];
  if (!st) return;

  // Re-read the shared setting on each tab entry and synchronize all initialized views.
  runGoogleScript('getRiskWeights').then(function(res) {
    if (!res || res.status !== 'success' || !res.data) {
      throw new Error((res && res.message) || 'โหลดค่าน้ำหนักไม่สำเร็จ');
    }
    Object.keys(riskViewState).forEach(function(otherId) {
      const other = riskViewState[otherId];
      if (!other) return;
      other.weights = res.data;
      $('#' + otherId).find('.' + other.prefix + '-weights').text(riskWeightsText(res.data));
    });
  }).catch(function(error) {
    console.warn('Could not refresh shared risk weights:', error);
  }).finally(function() {
    const current = riskViewState[tabId];
    if (!current) return;
    if (current.lastData) {
      renderRiskView(tabId, current.lastData);
      $tab.find('.' + current.prefix + '-empty').addClass('hidden');
      $tab.find('.' + current.prefix + '-content').removeClass('hidden');
    } else {
      loadRiskView(tabId);
    }
  });
}

function setRiskPeriodFor(tabId, baseDateStr) {
  const st = riskViewState[tabId];
  if (!st) return;
  const d = new Date(baseDateStr);
  let start, end;
  if (st.mode === 'week') {
    const dow = d.getDay();
    start = new Date(d); start.setDate(d.getDate() - dow + (dow === 0 ? -6 : 1));
    end = new Date(start); end.setDate(start.getDate() + 4);
  } else {
    start = new Date(d.getFullYear(), d.getMonth(), 1);
    end = new Date(d.getFullYear(), d.getMonth() + 1, 0);
  }
  const fmt = (dt) => [dt.getFullYear(), String(dt.getMonth()+1).padStart(2,'0'), String(dt.getDate()).padStart(2,'0')].join('-');
  st.startDate = fmt(start);
  st.endDate = fmt(end);

  const fmtThai = (ds) => { const p = ds.split('-'); return `${parseInt(p[2])}/${parseInt(p[1])}/${parseInt(p[0])+543}`; };
  const label = (st.mode === 'week' ? 'สัปดาห์' : 'เดือน') + `: ${fmtThai(st.startDate)} - ${fmtThai(st.endDate)}`;
  $('#' + tabId).find('.' + st.prefix + '-date-display').val(label);
}

function shiftRiskView(tabId, dir) {
  const st = riskViewState[tabId];
  if (!st) return;
  const d = new Date(st.startDate);
  if (st.mode === 'week') d.setDate(d.getDate() + dir * 7);
  else d.setMonth(d.getMonth() + dir, 1);
  setRiskPeriodFor(tabId, d.toISOString().split('T')[0]);
  loadRiskView(tabId);
}

async function loadRiskView(tabId) {
  const st = riskViewState[tabId];
  if (!st || !st.startDate) return;
  const $tab = $('#' + tabId);

  $.LoadingOverlay("show", { text: "กำลังประเมิน..." });
  try {
    const res = await runGoogleScript('getStudentRiskAssessment', st.startDate, st.endDate, st.classroomFilter || '', JSON.stringify(st.weights));
    if (res.status !== 'success') throw new Error(res.message);
    st.lastData = res.data;
    renderRiskView(tabId, res.data);
    $tab.find('.' + st.prefix + '-empty').addClass('hidden');
    $tab.find('.' + st.prefix + '-content').removeClass('hidden');
  } catch (err) {
    console.error('Error:', err);
    Swal.fire('ผิดพลาด', err.message, 'error');
  } finally {
    $.LoadingOverlay("hide");
  }
}

function renderRiskView(tabId, data) {
  const st = riskViewState[tabId];
  const $tab = $('#' + tabId);
  const p = st.prefix;
  const { summary, students, period } = data;

  $tab.find('.' + p + '-card-red').text(summary.red);
  $tab.find('.' + p + '-card-yellow').text(summary.yellow);
  $tab.find('.' + p + '-card-green').text(summary.green);
  $tab.find('.' + p + '-card-avg').text(summary.avgScore + '%');
  $tab.find('.' + p + '-card-total').text(`จาก ${summary.totalStudents} คน`);

  renderRiskViewCharts(tabId, summary, students);
  renderRiskViewGrid(tabId, students, period.dates);
  renderRiskViewList(tabId, 'red', students.filter(s => s.category === 'red'));
  renderRiskViewList(tabId, 'yellow', students.filter(s => s.category === 'yellow'));
  renderRiskViewList(tabId, 'green', students.filter(s => s.category === 'green'));
}

function renderRiskViewCharts(tabId, summary, students) {
  const st = riskViewState[tabId];
  const p = st.prefix;

  const pieCanvas = document.getElementById(p + '-pie-chart');
  if (pieCanvas) {
    if (window[p + 'PieChart']) window[p + 'PieChart'].destroy();
    window[p + 'PieChart'] = new Chart(pieCanvas.getContext('2d'), {
      type: 'pie',
      data: {
        labels: ['🔴 ใกล้ชิด', '🟡 ห่วงใย', '🟢 ไว้ใจ'],
        datasets: [{ data: [summary.red, summary.yellow, summary.green], backgroundColor: ['#ef4444', '#eab308', '#10b981'] }]
      },
      options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'right' }, title: { display: true, text: 'สัดส่วนกลุ่ม' } } }
    });
  }

  const top15 = students.slice(0, 15);
  const barCanvas = document.getElementById(p + '-bar-chart');
  if (barCanvas) {
    if (window[p + 'BarChart']) window[p + 'BarChart'].destroy();
    window[p + 'BarChart'] = new Chart(barCanvas.getContext('2d'), {
      type: 'bar',
      data: {
        labels: top15.map(s => s.name.length > 15 ? s.name.substring(0, 15) + '…' : s.name),
        datasets: [{ label: 'Composite', data: top15.map(s => s.composite), backgroundColor: top15.map(s => s.category === 'red' ? '#ef4444' : s.category === 'yellow' ? '#eab308' : '#10b981') }]

function openRiskSettings(tabId) {

function saveRiskSettings(tabId) {
  const st = riskViewState[tabId];
  if (!st) return;
  const p = st.prefix;
  const w = {
    attendance: Number($('#' + p + '-w-att').val()) || 0,
    cleaning: Number($('#' + p + '-w-cln').val()) || 0,
    subject: Number($('#' + p + '-w-subj').val()) || 0
  };
  if (w.attendance + w.cleaning + w.subject <= 0) {
    return Swal.fire('แจ้งเตือน', 'ผลรวมต้องมากกว่า 0', 'warning');
  }

  $.LoadingOverlay('show');
  google.script.run
    .withSuccessHandler(function(res) {
      $.LoadingOverlay('hide');
      if (res.status === 'success') {
        Object.keys(riskViewState).forEach(function(otherId) {
          const other = riskViewState[otherId];
          if (!other) return;
          other.weights = w;
          $('#' + otherId).find('.' + other.prefix + '-weights').text(riskWeightsText(w));
        });
        $('#' + p + '-settings-modal').hide();
        Swal.fire({ icon: 'success', title: 'บันทึกแล้ว — ใช้ร่วมกันทั้ง 2 หน้า', timer: 1500, showConfirmButton: false });
        if (st.lastData) loadRiskView(tabId);
      } else {
        Swal.fire('ผิดพลาด', res.message, 'error');
      }
    })
    .withFailureHandler(function(error) {
      $.LoadingOverlay('hide');
      Swal.fire('ผิดพลาด', (error && error.message) || 'บันทึกค่าน้ำหนักไม่สำเร็จ', 'error');
    })
    .saveRiskWeights(JSON.stringify(w));
}

function formatThaiDate(dateString) {
  if (!dateString) return '';
  const parts = String(dateString).split('-');
  if (parts.length !== 3) return String(dateString);
  return `${parseInt(parts[2], 10)}/${parseInt(parts[1], 10)}/${parseInt(parts[0], 10) + 543}`;
}

function formatThaiDateLong(dateString) {
  if (!dateString) return '...............';
  const months = ['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
  const parts = String(dateString).split('-');
  if (parts.length !== 3) return riskEscapeHtml(dateString);
  const month = parseInt(parts[1], 10) - 1;
  if (month < 0 || month > 11) return '...............';
  return `${parseInt(parts[2], 10)} ${months[month]} ${parseInt(parts[0], 10) + 543}`;
}

let discState = { currentStage: 'all', currentCaseId: null, currentDetail: null };

function initDiscipline() {
  // populate classroom dropdown
  if ($("#disc-classroom option").length <= 1) {
    ALL_CLASSROOMS.forEach(c => $("#disc-classroom").append(`<option value="${discEscapeHtml(c.id)}">${discEscapeHtml(c.name)}</option>`));
  }

  // bind
  $(".disc-stage-btn").off("click").on("click", function() {
    $(".disc-stage-btn").removeClass("bg-blue-700 text-white").addClass("bg-gray-100 text-gray-600");
    $(this).removeClass("bg-gray-100 text-gray-600").addClass("bg-blue-700 text-white");
    discState.currentStage = $(this).data("stage");
    loadDisciplineCases();
  });

  $("#disc-search").off("input").on("input", debounce(() => loadDisciplineCases(), 400));
  $("#disc-classroom").off("change").on("change", loadDisciplineCases);
  $("#disc-refresh").off("click").on("click", loadDisciplineCases);
  $("#disc-sync").off("click").on("click", syncDisciplineNow);
  $("#disc-export").off("click").on("click", exportDisciplineCsv);

  // Modal close handlers
  $("#disc-btn-close").off("click").on("click", () => closeDisciplineCase(discState.currentCaseId));
  $("#disc-btn-advance").off("click").on("click", advanceStageClick);
  $("#disc-meeting-save").off("click").on("click", saveMeetingInfo);
  $("#disc-sig-save").off("click").on("click", saveSignature);
  $("#disc-sig-party").off("change").on("change", function() {
    $("#disc-sig-parent-fields").toggle($(this).val() === "parent");
  });
  $("#disc-activity-pass").off("click").on("click", () => markActivityResult('pass'));
  $("#disc-activity-fail").off("click").on("click", () => markActivityResult('fail'));

  loadDisciplineCases();
}

function debounce(fn, wait) {
  let t;
  return function() { clearTimeout(t); t = setTimeout(fn, wait); };
}

function discEscapeHtml(value) {
  return String(value == null ? '' : value)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

async function loadDisciplineCases() {
  $.LoadingOverlay("show", { text: "กำลังโหลดเคส..." });
  try {
    const filter = {
      stage: discState.currentStage,
      classroom: $("#disc-classroom").val() || "",
      search: $("#disc-search").val() || ""
    };
    const res = await runGoogleScript('getDisciplineCases', filter);
    if (res.status !== 'success') throw new Error(res.message);
    renderDisciplineCases(res.data);
  } catch (err) {
    console.error('loadDisciplineCases:', err);
    Swal.fire('ผิดพลาด', err.message, 'error');
  } finally {
    $.LoadingOverlay("hide");
  }
}

function renderDisciplineCases(data) {
  const { cases, stats } = data;
  // Update counts
  $(".disc-stage-count").each(function() {
    const st = $(this).data("stage");
    let n = 0;
    if (st === 'all') n = (stats.stage1 || 0) + (stats.stage2 || 0) + (stats.stage3 || 0) + (stats.stage4 || 0) + (stats.closed || 0);
    else if (st === '1') n = stats.stage1 || 0;
    else if (st === '2') n = stats.stage2 || 0;
    else if (st === '3') n = stats.stage3 || 0;
    else if (st === '4') n = stats.stage4 || 0;
    else if (st === 'closed') n = stats.closed || 0;
    $(this).text(`(${n})`);
  });

  renderDisciplineCharts(cases || [], stats || {});
  const tbody = $("#disc-list").empty();
  tbody.off('click', '.disc-open-case').on('click', '.disc-open-case', function() {
    openDisciplineCase($(this).attr('data-case-id'));
  });
  $("#disc-empty").addClass("hidden");
  $("#disc-list-container").removeClass("hidden");

  if (cases.length === 0) {
    tbody.append('<tr><td colspan="7" class="text-center p-6 text-gray-400">ไม่พบเคส</td></tr>');
    return;
  }

  const stageBadge = {
    '1': 'bg-amber-100 text-amber-800',

async function exportDisciplineCsv() {
  $.LoadingOverlay('show', { text: 'กำลังสร้าง CSV...' });
  try {
    const filter = {
      stage: discState.currentStage,
      classroom: $('#disc-classroom').val() || '',
      search: $('#disc-search').val() || ''
    };
    const response = await runGoogleScript('getDisciplineCases', filter);
    if (response.status !== 'success') throw new Error(response.message || 'อ่านเคสไม่สำเร็จ');
    const cases = response.data.cases || [];
    if (!cases.length) return Swal.fire('ไม่มีข้อมูล', 'ไม่มีเคสให้ export', 'warning');
    const headers = ['เลขเคส','รหัสนักเรียน','ชื่อ-สกุล','ห้อง','Stage','สถานะ','ทริกเกอร์','เลขตักเตือน','เลขทัณฑ์บน','เลขกิจกรรม','เลขแจ้งผู้ปกครอง','ผอ.เซ็น','ผู้ปกครองเซ็น','นักเรียนเซ็น','สร้างเมื่อ','อัปเดตเมื่อ'];
    const stageLabel = stage => stage === 'closed' ? 'ปิดแล้ว' : `Stage ${stage}`;
    const formatTimestamp = value => value ? String(value).replace('T', ' ').substring(0, 19) : '';
    const rows = cases.map(item => [
      item.case_id, item.student_id, item.student_name, item.classroom_name || item.classroom_id,
      stageLabel(item.stage), item.status, item.trigger, item.warn_doc_no || '', item.bond_doc_no || '',
      item.activity_doc_no || '', item.parent_doc_no || '', item.signed_director_at ? 'เซ็นแล้ว' : '',
      item.signed_parent_at ? 'เซ็นแล้ว' : '', item.signed_student_at ? 'เซ็นแล้ว' : '',
      formatTimestamp(item.created_at), formatTimestamp(item.updated_at)
    ]);
    const escapeCsv = value => {
      let text = String(value == null ? '' : value);
      if (/^[\s]*[=+\-@]/.test(text)) text = "'" + text;
      return '"' + text.replace(/"/g, '""') + '"';
    };
    const csv = '\ufeff' + [headers, ...rows].map(row => row.map(escapeCsv).join(',')).join('\r\n');
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    const filename = `discipline_cases_${new Date().toISOString().split('T')[0]}.csv`;
    link.href = url; link.download = filename;
    document.body.appendChild(link); link.click(); link.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    Swal.fire({ icon: 'success', title: 'Export สำเร็จ', text: `${cases.length} เคส — ${filename}`, timer: 2000, showConfirmButton: false });
  } catch (error) {
    console.error('exportDisciplineCsv:', error);
    Swal.fire('ผิดพลาด', error.message || String(error), 'error');
  } finally {
    $.LoadingOverlay('hide');
  }
}

    { type: 'bond', label: '📋 ทัณฑ์บน', printed: c.printed_bond_at },

        ${d.label}
        ${printedBadge}

    const parties = [

      { key: 'parent', label: '👨‍👩‍👧 ผู้ปกครอง', at: c.signed_parent_at },
      { key: 'student', label: '🎓 นักเรียน', at: c.signed_student_at },
      { key: 'witness1', label: '📋 ครูที่ปรึกษา (พยาน)', at: c.signed_witness1_at },
      { key: 'witness2', label: '📋 งานกิจการฯ (พยาน)', at: c.signed_witness2_at }

      const btn = signed

  } else {
    actSection.addClass('hidden');
  }

  // Parent Meeting (Stage 4)
  const parentSection = $("#disc-parent-section");
  if (c.stage === '4') {
    parentSection.removeClass('hidden');

    if (!$("#disc-meeting-date")[0]._flatpickr) {
      flatpickr("#disc-meeting-date", { dateFormat: "Y-m-d", locale: "th" });

      $("#disc-meeting-date")[0]._flatpickr.setDate(c.meeting_date);
    } else {
      // default: 7 วันข้างหน้า
      const defaultDate = new Date(Date.now() + 7 * 86400000);
      $("#disc-meeting-date")[0]._flatpickr.setDate(defaultDate);
    }
    $("#disc-meeting-time").val(c.meeting_time || '09:00');

      $btn.html('✅ อัปเดตการนัดประชุม').removeClass('bg-blue-700').addClass('bg-emerald-700');
    } else {
      $btn.html('💾 บันทึกการนัด').removeClass('bg-emerald-700').addClass('bg-blue-700');
    }
  } else {
    parentSection.addClass('hidden');
  }
  // Action buttons
  $("#disc-btn-advance").toggle(c.stage !== 'closed' && c.stage !== '4');
  $("#disc-btn-close").toggle(c.stage !== 'closed');
}

function renderActivity(activityData, result) {
  const container = $("#disc-activity").empty();
  if (!activityData || !activityData.items) {
    container.append('<div class="text-sm text-gray-400">ไม่มีกิจกรรม</div>');
    return;
  }
  activityData.items.forEach(it => {
    const itemId = discEscapeHtml(it.id);
    const label = discEscapeHtml(it.label);
    const target = discEscapeHtml(it.target);
    const unit = discEscapeHtml(it.unit || '');
    const progress = discEscapeHtml(it.progress || 0);
    const numericTarget = Number(it.target);
    const numericProgress = Number(it.progress || 0);
    const pct = Number.isFinite(numericTarget) && numericTarget > 0 && Number.isFinite(numericProgress)
      ? Math.max(0, Math.min(100, numericProgress / numericTarget * 100)) : 0;
    container.append(`
      <div class="p-3 bg-gray-50 rounded-xl">
        <div class="flex justify-between items-center mb-1">
          <span class="text-sm font-bold">${label}</span>
          <span class="text-sm">${progress}/${target} ${unit}</span>
        </div>
        <div class="w-full bg-gray-200 rounded-full h-2 mb-2">
          <div class="bg-blue-600 h-2 rounded-full" style="width: ${pct}%"></div>
        </div>
        <div class="flex gap-2">
          <button data-item-id="${itemId}" class="disc-activity-minus px-2 py-1 bg-gray-200 rounded-lg text-xs font-bold">−</button>
          <button data-item-id="${itemId}" class="disc-activity-plus px-2 py-1 bg-blue-100 text-blue-700 rounded-lg text-xs font-bold">+</button>
        </div>
      </div>
    `);
  });
  container.off('click', '.disc-activity-minus').on('click', '.disc-activity-minus', function() {
    updateActivity($(this).attr('data-item-id'), -1);
  });
  container.off('click', '.disc-activity-plus').on('click', '.disc-activity-plus', function() {
    updateActivity($(this).attr('data-item-id'), 1);
  });
  if (result === 'pass') container.append('<div class="p-2 bg-emerald-100 text-emerald-700 rounded-xl text-center font-bold">✅ ผ่านกิจกรรม</div>');
  if (result === 'fail') container.append('<div class="p-2 bg-rose-100 text-rose-700 rounded-xl text-center font-bold">❌ ไม่ผ่านกิจกรรม</div>');
}

async function markActivityResult(result) {
  const label = result === 'pass' ? 'ผ่านกิจกรรม' : 'ไม่ผ่านกิจกรรม (จะยกระดับเป็น Stage 4)';
  const confirm = await Swal.fire({ title: 'ยืนยัน?', text: label, icon: 'question', showCancelButton: true, confirmButtonText: 'ยืนยัน', cancelButtonText: 'ยกเลิก' });
  if (!confirm.isConfirmed) return;

  try {
    const res = await runGoogleScript('markActivityResult', discState.currentCaseId, result);
    if (res.status !== 'success') throw new Error(res.message);

    if (result === 'fail') {
      const advance = await runGoogleScript('advanceDisciplineStage', discState.currentCaseId, '4', 'ไม่ผ่านกิจกรรม', 'system');
      if (advance.status !== 'success') throw new Error(advance.message || 'ยกระดับเป็น Stage 4 ไม่สำเร็จ');
    } else {
      const advance = await runGoogleScript('advanceDisciplineStage', discState.currentCaseId, 'closed', 'ผ่านกิจกรรม', 'system');
      if (advance.status !== 'success') throw new Error(advance.message || 'ปิดเคสไม่สำเร็จ');
    }
    Swal.fire({ icon: 'success', title: 'บันทึกแล้ว', timer: 1500, showConfirmButton: false })
      .then(() => { $("#disc-detail-modal").hide(); loadDisciplineCases(); });
  } catch (err) {
    Swal.fire('ผิดพลาด', err.message, 'error');
  }
}

async function saveMeetingInfo() {
  const dateStr = $("#disc-meeting-date").val();
  const timeStr = $("#disc-meeting-time").val() || '';
  const loc = $("#disc-meeting-loc").val() || '';

  if (!dateStr) {
    return Swal.fire('แจ้งเตือน', 'กรุณาเลือกวันประชุม', 'warning');
  }
  if (!timeStr.trim()) {
    return Swal.fire('แจ้งเตือน', 'กรุณาระบุเวลาประชุม', 'warning');
  }
  if (!loc.trim()) {
    return Swal.fire('แจ้งเตือน', 'กรุณาระบุสถานที่ประชุม', 'warning');
  }

  $.LoadingOverlay("show", { text: "กำลังบันทึก..." });
  try {
    const res = await runGoogleScript('saveMeetingMeta', discState.currentCaseId, dateStr, timeStr, loc);
    if (res.status !== 'success') throw new Error(res.message);

    Swal.fire({
      icon: 'success',
      title: 'บันทึกแล้ว',
      html: `📅 ${discEscapeHtml(dateStr)}<br>🕐 ${discEscapeHtml(timeStr)}<br>📍 ${discEscapeHtml(loc)}`,
      timer: 2000,
      showConfirmButton: false
    });

    // อัปเดต cache + refresh modal
    discState.currentDetail.case.meeting_date = dateStr;
    discState.currentDetail.case.meeting_time = timeStr;
    discState.currentDetail.case.meeting_location = loc;
    $('#disc-meeting-save').html('📝 อัปเดตการนัดประชุม')
      .removeClass('bg-blue-700').addClass('bg-emerald-700');
  } catch (err) {
    Swal.fire('ผิดพลาด', err.message, 'error');
  } finally {
    $.LoadingOverlay("hide");
  }
}



async function openDisciplineForStudent(studentId, studentName) {
  $.LoadingOverlay('show', { text: 'กำลังค้นหาเคสวินัย...' });
  try {
    const response = await runGoogleScript('getDisciplineCases', { search: String(studentId || '') });
    if (response.status !== 'success') throw new Error(response.message || 'ค้นหาเคสไม่สำเร็จ');
    const cases = response.data.cases || [];
    const active = cases.find(item => String(item.student_id) === String(studentId) && item.stage !== 'closed' && item.status !== 'closed');
    $.LoadingOverlay('hide');
    $('.nav-tab').removeClass('active');
    $('.nav-tab[data-tab="discipline"]').addClass('active');
    $('.tab-content').removeClass('active').hide();
    $('#discipline').addClass('active').show();
    discState.currentStage = 'all';
    $('#disc-search').val('');
    $('#disc-classroom').val('');
    initDiscipline();
    if (active) {
      setTimeout(() => openDisciplineCase(active.case_id), 350);
    } else {
      setTimeout(() => {
        $('#disc-search').val(studentName || studentId);
        $('#disc-classroom').val('');
        $('.disc-stage-btn').removeClass('bg-blue-700 text-white').addClass('bg-gray-100 text-gray-600');
        $('.disc-stage-btn[data-stage="all"]').removeClass('bg-gray-100 text-gray-600').addClass('bg-blue-700 text-white');
        discState.currentStage = 'all';
        loadDisciplineCases();
      }, 350);
      Swal.fire({
        icon: 'info', title: 'ยังไม่มีเคสวินัยที่เปิดอยู่',
        html: `นักเรียน <strong>${riskEscapeHtml(studentName || studentId)}</strong> ยังไม่มีเคสที่เปิดอยู่ในระบบ<br><small>หากเข้าเกณฑ์ ให้ครูตรวจสอบแล้วใช้ปุ่ม Sync ด้วยตนเอง</small>`,
        confirmButtonText: 'รับทราบ'
      });
    }
    window.scrollTo({ top: 0, behavior: 'smooth' });
  } catch (error) {
    $.LoadingOverlay('hide');
    Swal.fire('ผิดพลาด', error.message || String(error), 'error');
  }
}

let disciplinePrintWindow = null;
let disciplinePrintCaseId = null;
let disciplinePrintDocType = null;
window.addEventListener('message', async function(event) {
  const message = event.data || {};
  if (!disciplinePrintWindow || event.source !== disciplinePrintWindow || message.type !== 'nkw-discipline-print-complete') return;
  if (String(message.caseId) !== String(disciplinePrintCaseId) || message.docType !== disciplinePrintDocType) return;
  const caseId = disciplinePrintCaseId;
  const docType = disciplinePrintDocType;
  disciplinePrintWindow = null;
  disciplinePrintCaseId = null;
  disciplinePrintDocType = null;
  try {
    const result = await runGoogleScript('markDocPrinted', caseId, docType);
    if (result.status !== 'success') throw new Error(result.message || 'บันทึกสถานะพิมพ์ไม่สำเร็จ');
    if (discState.currentDetail && String(discState.currentDetail.case.case_id) === String(caseId)) {
      discState.currentDetail.case[`printed_${docType}_at`] = new Date().toISOString();
      renderCaseDetail(discState.currentDetail);
    }
  } catch (error) {
    console.error('markDocPrinted:', error);
  }
});

async function printDisciplineDoc(docType) {
  let win = null;
  try {
    // Open synchronously from the user's click so the popup is not blocked by the server request.
    win = window.open('', '_blank');
    if (!win) throw new Error('กรุณาอนุญาต Pop-up');
    disciplinePrintWindow = win;
    disciplinePrintCaseId = discState.currentCaseId;
    disciplinePrintDocType = docType;
    win.document.open();
    win.document.write('<!doctype html><html><meta charset="utf-8"><title>กำลังเตรียมเอกสาร</title><body>กำลังเตรียมเอกสารสำหรับพิมพ์…</body></html>');
    win.document.close();

    $.LoadingOverlay('show', { text: 'กำลังเตรียมเอกสาร...' });
    const response = await runGoogleScript('getDisciplineDocHtml', discState.currentCaseId, docType);
    if (response.status !== 'success') throw new Error(response.message || 'เตรียมเอกสารไม่สำเร็จ');
    if (win.closed) return;
    win.document.open();
    win.document.write(response.data.html);
    win.document.close();
  } catch (error) {
    if (win && !win.closed) win.close();
    disciplinePrintWindow = null;
    disciplinePrintCaseId = null;
    disciplinePrintDocType = null;
    Swal.fire('ผิดพลาด', error.message || String(error), 'error');
  } finally {
    $.LoadingOverlay('hide');
  }
}
</script>
