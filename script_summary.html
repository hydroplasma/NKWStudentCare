<script>
    function loadClassroomSummary() {
        try {
            console.log('Loading classroom summary');
            $("#summary-classroom").val("");
            $("#summary-date").val(checkDateExpiration("summary-date", TODAY));
            $("#summary-period-buttons .period-btn").removeClass("active bg-indigo-600 text-white").addClass("text-gray-700 bg-white");
            $("#summary-period-buttons .period-btn[data-period='morning']").addClass("active bg-indigo-600 text-white").removeClass("text-gray-700 bg-white");
            $("#classroom-summary-list").empty();
            $("#classroom-students-list").empty();
            if (window.classroomPieChart) {
                window.classroomPieChart.destroy();
                window.classroomPieChart = null;
            }
            if (window.classroomBarChart) {
                window.classroomBarChart.destroy();
                window.classroomBarChart = null;
            }
            $("#empty-dashboard").show();
            $("#classroom-chart-container").hide();
            $("#classroom-table-container").hide();
            $("#classroom-students-list-container").hide();
            // Removed line related to classroom-preview-btn
            loadClassroomsDropdown("#summary-classroom");
            updateClassroomSummaryTitle();
        } catch (error) {
            console.error('Error in loadClassroomSummary:', error);
            Swal.fire({
                icon: 'error',
                title: 'ข้อผิดพลาด',
                text: 'เกิดข้อผิดพลาดในการโหลดสรุปตามห้องเรียน: ' + error.message,
                confirmButtonText: 'ตกลง'
            });
        }
    }

    async function updateClassroomSummaryTitle() {
        try {
            const classroomId = $("#summary-classroom").val();
            const date = $("#summary-date").val() || TODAY;
            const period = $("#summary-period-buttons .period-btn.active").data("period") || 'morning';
            const periodName = period ? PERIODS.find(p => p.id === period)?.name || period : 'เช้า';
            
            const teacher = JSON.parse(localStorage.getItem("teacher") || "{}");
            if (!teacher || !teacher.classroom_ids) {
                // If no teacher data, set a default title and return
                const schoolName = CONFIG.school_config.schoolName || 'โรงเรียน';
                 $("#classroom-summary-title").html(`
                    สรุปเช็คชื่อนักเรียน ห้อง -- เลือกห้องเรียน --<br>
                    ${schoolName}<br>
                    วันที่ ${formatDateThai(date)} ช่วง${periodName}
                `);
                return;
            }
            const allowedClassroomIds = teacher.classroom_ids;

            $.LoadingOverlay("show");
            const response = await runGoogleScript('getClassrooms', allowedClassroomIds);
            $.LoadingOverlay("hide"); // Hide overlay after script run

            let classroomName = '-- เลือกห้องเรียน --';
            const schoolName = CONFIG.school_config.schoolName || 'โรงเรียน';

            if (response.status === 'success') {
                const classrooms = response.data;
                 if (classrooms && classrooms.length > 0 && classroomId) {
                    classroomName = classrooms.find(c => c.id === classroomId)?.name || classroomId;
                }
            } else {
                console.warn(response.error.details || 'Failed to load classrooms for title');
                // Keep classroomName as '-- เลือกห้องเรียน --' or classroomId if it exists
                if (classroomId) classroomName = classroomId;
            }
            
            $("#classroom-summary-title").html(`
                สรุปเช็คชื่อนักเรียน ห้อง ${classroomName}<br>
                ${schoolName}<br>
                วันที่ ${formatDateThai(date)} ช่วง${periodName}
            `);
        } catch (error) {
            $.LoadingOverlay("hide");
            console.error('Error in updateClassroomSummaryTitle:', error);
             const date = $("#summary-date").val() || TODAY;
            const period = $("#summary-period-buttons .period-btn.active").data("period") || 'morning';
            const periodName = period ? PERIODS.find(p => p.id === period)?.name || period : 'เช้า';
            const schoolName = CONFIG.school_config.schoolName || 'โรงเรียน';
            $("#classroom-summary-title").html(`
                สรุปเช็คชื่อนักเรียน ห้อง -- เลือกห้องเรียน --<br>
                ${schoolName}<br>
                วันที่ ${formatDateThai(date)} ช่วง${periodName}
            `);
            Swal.fire({
                icon: 'error',
                title: 'ข้อผิดพลาด',
                text: 'เกิดข้อผิดพลาดในการอัปเดตหัวข้อสรุปห้องเรียน: ' + error.message,
                confirmButtonText: 'ตกลง'
            });
        }
    }

    async function loadClassroomsDropdown(containerId) { // This function is duplicated in script_main, ensure consistency or refactor
        try {
            console.log('Loading classrooms dropdown for container:', containerId);
            const classroomSelect = $(containerId);
            classroomSelect.empty();
            classroomSelect.append('<option value="">-- เลือกห้องเรียน --</option>');
            const teacher = JSON.parse(localStorage.getItem("teacher") || "{}");
             if (!teacher || !teacher.classroom_ids || !Array.isArray(teacher.classroom_ids) || teacher.classroom_ids.length === 0) {
                console.warn('No teacher data or classroom_ids for dropdown');
                return;
            }
            const allowedClassroomIds = teacher.classroom_ids;

            $.LoadingOverlay("show");
            const response = await runGoogleScript('getClassrooms', allowedClassroomIds);
            $.LoadingOverlay("hide");
            if (response.status !== 'success') {
                throw new Error(response.error.details || 'Failed to load classrooms');
            }
            const classrooms = response.data;
            if (!classrooms || !classrooms.length) {
                 console.warn('No classrooms returned from server for dropdown');
                return;
            }
            classrooms.forEach(classroom => {
                if (allowedClassroomIds.includes(classroom.id)) {
                    classroomSelect.append(`<option value="${classroom.id}">${classroom.name}</option>`);
                }
            });
            if (classroomSelect.find('option').length <= 1) {
                console.warn('No allowed classrooms to populate dropdown');
            }
        } catch (error) {
            $.LoadingOverlay("hide");
            console.error('Error in loadClassroomsDropdown (summary):', error);
            // Avoid Swal here if it's too disruptive for a dropdown load failure
        }
    }

    async function loadClassroomSummaryData(classroomId, date, period) {
        try {
            $.LoadingOverlay("show");
            console.log('Loading classroom summary data for:', { classroomId, date, period });

            const attendanceResponse = await runGoogleScript('getAttendance', date, period, classroomId);
            if (attendanceResponse.status !== 'success') {
                throw new Error(attendanceResponse.error.details || 'Failed to load attendance data');
            }
            const attendanceLog = attendanceResponse.data;
            const filteredData = attendanceLog.filter(entry =>
                entry.room_id === classroomId &&
                entry.date === date &&
                entry.period === period
            ).sort((a, b) => new Date(b.updated_at || b.date) - new Date(a.updated_at || b.date));
            
            if (filteredData.length === 0) {
                $.LoadingOverlay("hide");
                Swal.fire({
                    icon: 'info',
                    title: 'ไม่พบข้อมูล',
                    text: 'ยังไม่มีข้อมูลการเช็คชื่อสำหรับห้องเรียน วันที่ และช่วงเวลาที่เลือก',
                    confirmButtonText: 'ตกลง'
                });
                $("#classroom-chart-container").hide();
                $("#classroom-table-container").hide();
                $("#classroom-students-list-container").hide();
                // Removed line related to classroom-preview-btn
                $("#empty-dashboard").show();
                return;
            }

            const studentResponse = await runGoogleScript('getStudents', [classroomId]);
            if (studentResponse.status !== 'success') {
                throw new Error(studentResponse.error.details || 'Failed to load students');
            }
            const studentsByClassroom = studentResponse.data;
            const students = studentsByClassroom[classroomId] || [];

            const latestEntry = filteredData[0];
            const statusCounts = {};
            STATUS_LIST.forEach(status => {
                statusCounts[status.label] = 0;
            });
            
            const allStudents = [];
            latestEntry.students.forEach(student => {
                if (statusCounts[student.status] !== undefined) {
                    statusCounts[student.status]++;
                } else {
                    console.warn('Unknown status found:', student.status);
                }
                const studentData = students.find(s => String(s.student_id) === String(student.student_id));
                if (studentData) {
                    allStudents.push({
                        student_id: student.student_id,
                        no: studentData.no,
                        name: studentData.name,
                        status: student.status,
                        reason: student.reason || ''
                    });
                }
            });
            
            const tableData = [{
                date: latestEntry.date,
                period: PERIODS.find(p => p.id === latestEntry.period)?.name || latestEntry.period,
                counts: statusCounts
            }];

            updateClassroomTable(tableData, allStudents.length);
            updateClassroomCharts(statusCounts);
            updateClassroomStudentsList(allStudents);

            $("#classroom-table-container").show();
            $("#classroom-chart-container").show();
            $("#classroom-students-list-container").show();
            // Removed lines related to classroom-preview-btn
            $("#empty-dashboard").hide();

            // Removed event listener for classroom-preview-btn

            $.LoadingOverlay("hide");
        } catch (error) {
            $.LoadingOverlay("hide");
            console.error('Error in loadClassroomSummaryData:', error);
            Swal.fire({
                icon: 'error',
                title: 'ข้อผิดพลาด',
                text: 'เกิดข้อผิดพลาดในการโหลดข้อมูลสรุป: ' + error.message,
                confirmButtonText: 'ตกลง'
            });
        }
    }

    function updateClassroomCharts(statusCounts) {
        try {
            const pieCanvas = document.getElementById('classroom-pie-chart');
            if (!pieCanvas) {
                // console.warn('Canvas for classroom pie chart not found.');
                return;
            }
            const pieCtx = pieCanvas.getContext('2d');
            if (window.classroomPieChart) {
                window.classroomPieChart.destroy();
            }
            window.classroomPieChart = new Chart(pieCtx, {
                type: 'pie',
                data: {
                    labels: STATUS_LIST.map(status => status.label),
                    datasets: [{
                        data: STATUS_LIST.map(status => statusCounts[status.label] || 0),
                        backgroundColor: STATUS_LIST.map(status => status.hexColor)
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { position: 'right' },
                        title: {
                            display: true,
                            text: 'สัดส่วนสถานะการเข้าเรียน'
                        }
                    },
                    layout: {
                        padding: 10
                    }
                }
            });

            const barCanvas = document.getElementById('classroom-bar-chart');
             if (!barCanvas) {
                // console.warn('Canvas for classroom bar chart not found.');
                return;
            }
            const barCtx = barCanvas.getContext('2d');
            if (window.classroomBarChart) {
                window.classroomBarChart.destroy();
            }
            window.classroomBarChart = new Chart(barCtx, {
                type: 'bar',
                data: {
                    labels: STATUS_LIST.map(status => status.label),
                    datasets: [{
                        label: 'จำนวนนักเรียน',
                        data: STATUS_LIST.map(status => statusCounts[status.label] || 0),
                        backgroundColor: STATUS_LIST.map(status => status.hexColor)
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false },
                        title: {
                            display: true,
                            text: 'จำนวนนักเรียนตามสถานะการเข้าเรียน'
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            ticks: { precision: 0 }
                        }
                    },
                    layout: {
                        padding: {
                            top: 10,
                            bottom: 10
                        }
                    }
                }
            });

            const pieChartCard = $('#classroom-pie-chart').closest('.bg-white.rounded-lg.shadow.p-4');
            if (pieChartCard.length) {
                 $('#classroom-pie-chart').css({ 'width': '100%', 'height': '300px' });
            }


            const barChartCard = $('#classroom-bar-chart').closest('.bg-white.rounded-lg.shadow.p-4');
             if (barChartCard.length) {
                $('#classroom-bar-chart').css({ 'width': '100%', 'height': '300px' });
            }

        } catch (error) {
            console.error('Error in updateClassroomCharts:', error);
            // Avoid Swal here as it can be too disruptive if charts fail repeatedly
        }
    }

    function updateClassroomTable(tableData, totalStudents) {
        try {
            const container = $("#classroom-summary-list");
            container.empty();
            
            tableData.forEach(entry => {
                const totalCard = `
                    <div class="p-4 text-center rounded-lg shadow-sm" style="background-color: ${lightenColor('#e5e7eb', 20)}; color: #374151;">
                        <div class="flex items-center justify-center mb-2">
                            <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path>
                            </svg>
                            <h3 class="text-sm font-medium">นักเรียนทั้งหมด</h3>
                        </div>
                        <p class="text-lg font-semibold">${totalStudents} คน</p>
                        <p class="text-xs text-gray-500">(100%)</p>
                    </div>
                `;

                const cards = STATUS_LIST.map(status => {
                    const count = entry.counts[status.label] || 0;
                    const percentage = totalStudents > 0 ? ((count / totalStudents) * 100).toFixed(2) : 0;
                    const hexColor = status.hexColor || '#000000';
                    const lighterColor = lightenColor(hexColor, 80);
                    const darkerColor = darkenColor(hexColor, 20);
                    return `
                        <div class="p-4 text-center rounded-lg shadow-sm" style="background-color: ${lighterColor}; color: ${darkerColor};">
                            <div class="flex items-center justify-center mb-2">
                                <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                                </svg>
                                <h3 class="text-sm font-medium">${status.label}</h3>
                            </div>
                            <p class="text-lg font-semibold">${count} คน</p>
                            <p class="text-xs text-gray-500">(${percentage}%)</p>
                        </div>
                    `;
                }).join('');
                
                container.append(`
                    <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-6 gap-4">
                        ${totalCard}
                        ${cards}
                    </div>
                `);
            });
        } catch (error) {
            console.error('Error in updateClassroomTable:', error);
            // Avoid Swal here
        }
    }

    function updateClassroomStudentsList(studentList) {
        try {
            const studentsList = $("#classroom-students-list");
            studentsList.empty();
            
            if (studentList.length === 0) {
                studentsList.append('<tr><td colspan="4" class="px-6 py-4 text-center text-gray-500">ไม่มีข้อมูลนักเรียน</td></tr>');
                return;
            }

            studentList.forEach(student => {
                const row = `
                    <tr class="border-b border-gray-200">
                        <td class="px-6 py-4 whitespace-nowrap border-r border-gray-200">${student.student_id}</td>
                        <td class="px-6 py-4 whitespace-nowrap border-r border-gray-200">${student.no}</td>
                        <td class="px-6 py-4 whitespace-nowrap border-r border-gray-200">${student.name}</td>
                        <td class="px-6 py-4 whitespace-nowrap">${student.status}${student.reason ? ` (${student.reason})` : ''}</td>
                    </tr>
                `;
                studentsList.append(row);
            });

            const table = studentsList.closest('table');
            table.addClass('min-w-full w-full border');
            table.closest('.table-responsive').addClass('w-full');
            table.find('thead tr').addClass('bg-gradient-to-r from-blue-400 to-teal-400 text-white border-b border-gray-300');
            table.find('thead th').addClass('border-r border-gray-300 font-bold');
            table.find('thead th:last-child').removeClass('border-r');
            table.find('tbody tr td:last-child').removeClass('border-r');
        } catch (error) {
            console.error('Error in updateClassroomStudentsList:', error);
            // Avoid Swal here
        }
    }

    function loadOverallSummary() {
        try {
            console.log('Loading overall summary');
            const date = $("#overall-date").val() || TODAY;
            let period = $("#overall-period-buttons .period-btn.active").data("period");
            if (!period) {
                period = "morning";
                $("#overall-period-buttons .period-btn[data-period='morning']").addClass("active bg-indigo-600 text-white").removeClass("text-gray-700 bg-white");
            }
            $("#overall-chart-container").hide();
            $("#overall-table-container").hide();
            $("#overall-status-summary").hide();
            // Removed line related to overall-preview-btn
            $("#overall-empty-dashboard").show();
             updateOverallSummaryTitle(); // Call title update here
            if (date && period) {
                loadOverallSummaryData(date, period);
            } else {
                console.warn('Missing date or period for overall summary');
            }
        } catch (error) {
            console.error('Error in loadOverallSummary:', error);
            Swal.fire({
                icon: 'error',
                title: 'ข้อผิดพลาด',
                text: 'เกิดข้อผิดพลาดในการโหลดสรุปภาพรวม: ' + error.message,
                confirmButtonText: 'ตกลง'
            });
        }
    }

    function updateOverallSummaryTitle() {
        try {
            const date = $("#overall-date").val() || TODAY;
            const period = $("#overall-period-buttons .period-btn.active").data("period") || 'morning';
            const periodName = period ? PERIODS.find(p => p.id === period)?.name || period : 'เช้า';
            
            const schoolName = CONFIG.school_config.schoolName || 'โรงเรียน';
            $("#overall-summary-title").html(`
                สรุปเช็คชื่อนักเรียนทั้งโรงเรียน<br>
                ${schoolName}<br>
                วันที่ ${formatDateThai(date)} ช่วง${periodName}
            `);
        } catch (error) {
            console.error('Error in updateOverallSummaryTitle:', error);
            // Avoid Swal here
        }
    }

    async function loadOverallSummaryData(date, period) {
        try {
            $.LoadingOverlay("show");
            console.log('Loading overall summary data for date:', date, 'and period:', period);

            const classroomResponse = await runGoogleScript('getClassrooms', []);
            if (classroomResponse.status !== 'success') {
                throw new Error(classroomResponse.error.details || 'Failed to load classrooms');
            }
            const allClassrooms = classroomResponse.data;

            const attendanceResponse = await runGoogleScript('getAttendance', date, period, null);
            if (attendanceResponse.status !== 'success') {
                throw new Error(attendanceResponse.error.details || 'Failed to load attendance data');
            }
            const attendanceLog = attendanceResponse.data;
            const filteredData = attendanceLog.filter(entry => 
                entry.date === date && 
                entry.period === period
            ).sort((a, b) => new Date(b.updated_at || b.date) - new Date(a.updated_at || b.date));
            
            if (filteredData.length === 0 && (!allClassrooms || allClassrooms.length === 0)) {
                $.LoadingOverlay("hide");
                Swal.fire({
                    icon: 'info',
                    title: 'ไม่พบข้อมูล',
                    text: 'ยังไม่มีข้อมูลการเช็คชื่อสำหรับวันที่และช่วงเวลาที่เลือก และไม่มีห้องเรียนในระบบ',
                    confirmButtonText: 'ตกลง'
                });
                $("#overall-chart-container").hide();
                $("#overall-table-container").hide();
                $("#overall-status-summary").hide();
                // Removed line related to overall-preview-btn
                $("#overall-empty-dashboard").show();
                return;
            }

            const studentResponse = await runGoogleScript('getStudents', allClassrooms.map(c => c.id));
            if (studentResponse.status !== 'success') {
                throw new Error(studentResponse.error.details || 'Failed to load students');
            }
            const studentsByClassroom = studentResponse.data;

            const statusCounts = {};
            STATUS_LIST.forEach(status => {
                statusCounts[status.label] = 0;
            });
            
            const tableData = [];
            const statusStudents = {};
            STATUS_LIST.forEach(status => {
                if (status.label !== "มา") {
                    statusStudents[status.label] = [];
                }
            });
            const latestEntries = {};
            filteredData.forEach(entry => {
                if (!latestEntries[entry.room_id] || new Date(entry.updated_at || entry.date) > new Date(latestEntries[entry.room_id].updated_at || entry.date)) {
                    latestEntries[entry.room_id] = entry;
                }
            });

            let totalStudents = 0;
            allClassrooms.forEach(classroom => {
                const dayCounts = {};
                STATUS_LIST.forEach(status => {
                    dayCounts[status.label] = 0;
                });

                const entry = latestEntries[classroom.id];
                if (entry) {
                    entry.students.forEach(student => {
                        if (statusCounts[student.status] !== undefined) {
                            statusCounts[student.status]++;
                            dayCounts[student.status]++;
                        } else {
                            console.warn('Unknown status found:', student.status);
                        }
                        const studentData = studentsByClassroom[classroom.id]?.find(s => String(s.student_id) === String(student.student_id));
                        if (studentData && student.status !== "มา") {
                            if (statusStudents[student.status]) {
                                statusStudents[student.status].push({
                                    classroom: classroom.name,
                                    student_id: student.student_id,
                                    no: studentData.no,
                                    name: studentData.name,
                                    status: student.status,
                                    reason: student.reason || ''
                                });
                            }
                        }
                    });
                }

                const studentCount = studentsByClassroom[classroom.id]?.length || 0;
                totalStudents += studentCount;
                const periodName = PERIODS.find(p => p.id === period)?.name || period;
                tableData.push({
                    date: date,
                    classroom: classroom.name,
                    period: periodName,
                    counts: dayCounts,
                    studentCount: studentCount,
                    checked: !!entry,
                    classroomId: classroom.id
                });
            });

            updateOverallTable(tableData, statusCounts, totalStudents);
            updateOverallCharts(statusCounts);
            updateOverallStatusSummary(statusStudents);
            
            $("#overall-table-container").show();
            $("#overall-chart-container").show();
            $("#overall-status-summary").show();
            // Removed lines related to overall-preview-btn
            $("#overall-empty-dashboard").hide();

            // Removed event listener for overall-preview-btn
            
            $.LoadingOverlay("hide");
        } catch (error) {
            $.LoadingOverlay("hide");
            console.error('Error in loadOverallSummaryData:', error);
            Swal.fire({
                icon: 'error',
                title: 'ข้อผิดพลาด',
                text: 'เกิดข้อผิดพลาดในการโหลดข้อมูลสรุปทั้งโรงเรียน: ' + error.message,
                confirmButtonText: 'ตกลง'
            });
        }
    }

    function updateOverallCharts(statusCounts) {
        try {
            const pieCanvas = document.getElementById('overall-pie-chart');
            if (!pieCanvas) {
                // console.warn('Canvas for overall pie chart not found.');
                return;
            }
            const pieCtx = pieCanvas.getContext('2d');
            if (window.overallPieChart) {
                window.overallPieChart.destroy();
            }
            window.overallPieChart = new Chart(pieCtx, {
                type: 'pie',
                data: {
                    labels: STATUS_LIST.map(status => status.label),
                    datasets: [{
                        data: STATUS_LIST.map(status => statusCounts[status.label] || 0),
                        backgroundColor: STATUS_LIST.map(status => status.hexColor)
                    }]
                },
                options: {
                    responsive: true,

async function loadCleaningSummary() {
  try {
    $("#cleaning-summary-empty").show();
    $("#cleaning-summary-content").addClass("hidden");

    // Default: ต้นเดือน → วันนี้
    const today = TODAY;
    const start = today.slice(0, 7) + '-01';

    if (!$("#cleaning-summary-start").val()) {
      $("#cleaning-summary-start").val(start);
      flatpickr("#cleaning-summary-start", {
        dateFormat: "Y-m-d", locale: "th", defaultDate: start
      });
    }
    if (!$("#cleaning-summary-end").val()) {
      $("#cleaning-summary-end").val(today);
      flatpickr("#cleaning-summary-end", {
        dateFormat: "Y-m-d", locale: "th", defaultDate: today
      });
    }

    // Load classroom dropdown (เฉพาะครั้งแรก)
    if ($("#cleaning-summary-room option").length <= 1) {
      const cr = await runGoogleScript('getClassrooms', []);
      if (cr.status === 'success') {
        cr.data.forEach(c => {
          $("#cleaning-summary-room").append(`<option value="${c.id}">${c.name}</option>`);
        });
      }
    }

    // Bind run button
    $("#cleaning-summary-run").off("click").on("click", runCleaningSummary);
  } catch (error) {
    console.error('Error in loadCleaningSummary:', error);
  }
}

async function runCleaningSummary() {
  const startDate = $("#cleaning-summary-start").val();
  const endDate = $("#cleaning-summary-end").val();
  const classroomId = $("#cleaning-summary-room").val() || "";

  if (!startDate || !endDate) {
    Swal.fire('แจ้งเตือน', 'กรุณาเลือกช่วงวันที่', 'warning');
    return;
  }
  if (startDate > endDate) {
    Swal.fire('แจ้งเตือน', 'วันที่เริ่มต้นต้องไม่มากกว่าวันที่สิ้นสุด', 'warning');
    return;
  }

  $.LoadingOverlay("show", { text: "กำลังประมวลผล..." });
  try {
    const res = await runGoogleScript('getCleaningStats', {
      startDate, endDate, classroom_id: classroomId
    });

    if (res.status !== 'success') throw new Error(res.message);

    renderCleaningSummary(res.data);
    $("#cleaning-summary-empty").hide();
    $("#cleaning-summary-content").removeClass("hidden");
  } catch (error) {
    console.error('Error:', error);
    Swal.fire('ผิดพลาด', error.message, 'error');
  } finally {
    $.LoadingOverlay("hide");
  }
}

function renderCleaningSummary(data) {
  // ===== Summary Cards =====
  $("#clean-stat-avg").text((data.avgScore || 0) + '%');
  $("#clean-stat-total").text((data.scoreDetails || []).length);

  // Top room
  const roomScores = {};
  (data.scoreDetails || []).forEach(d => {
    if (!roomScores[d.classroom_id]) roomScores[d.classroom_id] = [];
    const [s, m] = String(d.total_score).split('/').map(Number);
    if (!isNaN(s) && !isNaN(m) && m > 0) roomScores[d.classroom_id].push((s / m) * 100);
  });
  let topRoom = '-';
  let topAvg = 0;
  for (const room in roomScores) {
    const avg = roomScores[room].reduce((a, b) => a + b, 0) / roomScores[room].length;
    if (avg > topAvg) {
      topAvg = avg;
      const found = ALL_CLASSROOMS.find(c => c.id === room);
      topRoom = found ? found.name : room;
    }
  }
  $("#clean-stat-top-room").text(topRoom);

  // ===== Top 5 Students =====
  const topTbody = $("#clean-top-students");
  topTbody.empty();
  if (!data.topStudents || data.topStudents.length === 0) {
    topTbody.append('<tr><td colspan="3" class="text-center p-4 text-gray-400">ไม่มีข้อมูล</td></tr>');
  } else {
    // map student_id → name (จาก CONFIG.students ถ้ามี)
    const nameMap = {};
    for (const room in (window.CONFIG_STUDENTS || {})) {
      (window.CONFIG_STUDENTS[room] || []).forEach(s => {
        nameMap[String(s.student_id)] = s.name;
      });
    }

    data.topStudents.forEach((s, i) => {
      const medal = i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : `#${i + 1}`;
      const realName = nameMap[String(s.name)] || s.name;
      topTbody.append(`
        <tr class="border-b border-gray-100 hover:bg-blue-50">
          <td class="p-3 font-semibold text-gray-700">${medal}</td>
          <td class="p-3 text-gray-800">${realName}</td>
          <td class="p-3 text-center font-bold text-emerald-600">${s.done} ครั้ง</td>
        </tr>
      `);
    });
  }

  // ===== Details =====
  const detailTbody = $("#clean-details-list");
  detailTbody.empty();
  if (!data.scoreDetails || data.scoreDetails.length === 0) {
    detailTbody.append('<tr><td colspan="4" class="text-center p-4 text-gray-400">ไม่มีข้อมูล</td></tr>');
  } else {
    data.scoreDetails.forEach(d => {
      const roomName = (ALL_CLASSROOMS.find(c => c.id === d.classroom_id) || {}).name || d.classroom_id;
      detailTbody.append(`
        <tr class="border-b border-gray-100 hover:bg-blue-50">
          <td class="p-3 text-gray-600">${d.date}</td>
          <td class="p-3 font-semibold text-gray-800">${roomName}</td>
          <td class="p-3 text-gray-600">${d.checker}</td>
          <td class="p-3 text-center font-bold text-blue-700">${d.total_score}</td>
        </tr>
      `);
    });
  }

  renderCleaningCharts(data.studentStats || [], data.scoreDetails || []);
  renderCleaningStudentList(data.allStudents || data.studentStats || []);
}

function renderCleaningCharts(studentStats, scoreDetails) {
  let done = 0;
  let notDone = 0;
  let leave = 0;
  (studentStats || []).forEach(student => {
    done += Number(student.done) || 0;
    notDone += Number(student.not_done) || 0;
    leave += Number(student.leave) || 0;
  });

  const pieCanvas = document.getElementById('clean-pie-chart');
  if (pieCanvas) {
    if (window.cleanPieChart) window.cleanPieChart.destroy();
    window.cleanPieChart = new Chart(pieCanvas.getContext('2d'), {
      type: 'pie',
      data: {
        labels: ['ทำ', 'ไม่ทำ', 'ลา'],
        datasets: [{ data: [done, notDone, leave], backgroundColor: ['#10b981', '#f97316', '#ef4444'] }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { position: 'right' }, title: { display: true, text: 'สัดส่วนการทำเวร' } }
      }
    });
  }

  const roomBuckets = {};
  (scoreDetails || []).forEach(detail => {
    const [score, maxScore] = String(detail.total_score).split('/').map(Number);
    if (!Number.isFinite(score) || !Number.isFinite(maxScore) || maxScore <= 0) return;
    const roomId = String(detail.classroom_id || '');
    if (!roomBuckets[roomId]) roomBuckets[roomId] = [];
    roomBuckets[roomId].push((score / maxScore) * 100);
  });

  const roomLabels = [];
  const roomValues = [];
  Object.keys(roomBuckets).sort().forEach(roomId => {
    const scores = roomBuckets[roomId];
    const average = scores.reduce((sum, score) => sum + score, 0) / scores.length;
    const classroom = (ALL_CLASSROOMS || []).find(item => String(item.id) === roomId);
    roomLabels.push(classroom ? classroom.name : roomId);
    roomValues.push(Number(average.toFixed(1)));
  });

  const barCanvas = document.getElementById('clean-bar-chart');
  if (barCanvas) {
    if (window.cleanBarChart) window.cleanBarChart.destroy();
    window.cleanBarChart = new Chart(barCanvas.getContext('2d'), {
      type: 'bar',
      data: {
        labels: roomLabels,
        datasets: [{ label: 'คะแนนเฉลี่ย (%)', data: roomValues, backgroundColor: '#2563eb' }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { display: false }, title: { display: true, text: 'คะแนนเฉลี่ยแต่ละห้อง' } },
        scales: { y: { beginAtZero: true, max: 100 } }
      }
    });
  }
}

let currentSubjectCtx = null;

function escapeSummaryHtml(value) {
  return String(value == null ? '' : value).replace(/[&<>"']/g, char => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[char]));
}

function initSubjectSummary() {

async function runSubjectSummaryV2() {
  const subjectKey = $('#summary-subject-select').val();
  const startDate = $('#summary-subject-start').val();
  const endDate = $('#summary-subject-end').val();
  if (!subjectKey) return Swal.fire('แจ้งเตือน', 'กรุณาเลือกวิชา', 'warning');
  if (!startDate || !endDate) return Swal.fire('แจ้งเตือน', 'กรุณาเลือกช่วงวันที่', 'warning');
  if (startDate > endDate) return Swal.fire('แจ้งเตือน', 'วันที่เริ่มต้นต้องไม่เกินวันที่สิ้นสุด', 'warning');

  const teacher = JSON.parse(localStorage.getItem('teacher') || '{}');
  const teacherId = teacher.username || teacher.name || teacher.email || '';
  $.LoadingOverlay('show', { text: 'กำลังประมวลผล...' });
  try {
    const response = await runGoogleScript('getSubjectAttendanceSummaryV2', teacherId, subjectKey, startDate, endDate, null);
    if (!response || response.status !== 'success') throw new Error((response && response.message) || 'ไม่สามารถโหลดข้อมูลได้');
    renderSubjectSummaryV2(subjectKey, response.data || {}, startDate, endDate);
    $('#subject-summary-empty').addClass('hidden');
    $('#subject-summary-content').removeClass('hidden');
  } catch (error) {
    Swal.fire('ผิดพลาด', error.message || String(error), 'error');
  } finally {
    $.LoadingOverlay('hide');
  }
}

function renderSubjectSummaryV2(subjectKey, data, startDate, endDate) {
  const totals = data.totals || { present: 0, absent: 0, leave: 0, late: 0, sick: 0, total: 0 };
  const students = Array.isArray(data.students) ? data.students : [];
  const total = Number(totals.total) || 0;
  const percent = value => (total ? ((Number(value) || 0) / total * 100).toFixed(1) : '0.0') + '%';

  $('#subj-card-present').text(totals.present || 0);
  $('#subj-card-present-pct').text(percent(totals.present));
  $('#subj-card-absent').text(totals.absent || 0);
  $('#subj-card-absent-pct').text(percent(totals.absent));
  $('#subj-card-late').text(totals.late || 0);
  $('#subj-card-late-pct').text(percent(totals.late));
  $('#subj-card-leave').text(totals.leave || 0);
  $('#subj-card-leave-pct').text(percent(totals.leave));
  $('#subj-card-sick').text(totals.sick || 0);
  $('#subj-card-sick-pct').text(percent(totals.sick));

  renderSubjectCharts(totals, data.dailyTrend || {});
  $('#subject-summary-title').text(`📋 สรุปรายบุคคล — ${students.length} คน (รวม ${total} ครั้ง)`);
  const tbody = $('#subject-summary-tbody').empty();

  if (!students.length) {
    tbody.append('<tr><td colspan="11" class="text-center p-6 text-gray-400">ไม่พบข้อมูล</td></tr>');
  } else {
    students.forEach(student => {
      const attendancePct = Number(student.total) > 0 ? ((Number(student.present) / Number(student.total)) * 100).toFixed(0) : '0';
      const gradeRoom = String(student.gradeLevel || '') + (student.room ? '/' + student.room : '');
      const percentColor = attendancePct >= 80 ? 'text-emerald-600' : attendancePct >= 50 ? 'text-amber-600' : 'text-rose-600';
      tbody.append(`
        <tr class="border-b border-gray-100 hover:bg-blue-50">
          <td class="p-3 text-center text-gray-600 text-sm">${escapeSummaryHtml(gradeRoom)}</td>
          <td class="p-3 text-center text-gray-600 text-sm">${escapeSummaryHtml(student.id)}</td>
          <td class="p-3 text-gray-800 text-sm font-medium">${escapeSummaryHtml(student.name)}</td>
          <td class="p-3 text-center font-bold text-emerald-600">${Number(student.present) || 0}</td>
          <td class="p-3 text-center font-bold text-rose-600">${Number(student.absent) || 0}</td>
          <td class="p-3 text-center font-bold text-amber-600">${Number(student.late) || 0}</td>
          <td class="p-3 text-center font-bold text-blue-600">${Number(student.leave) || 0}</td>
          <td class="p-3 text-center font-bold text-purple-600">${Number(student.sick) || 0}</td>
          <td class="p-3 text-center font-bold bg-gray-100">${Number(student.total) || 0}</td>
          <td class="p-3 text-center font-bold ${percentColor}">${attendancePct}%</td>
          <td class="p-3 text-center">
            <button type="button" class="student-detail-btn px-3 py-1 bg-blue-100 text-blue-700 rounded-lg text-xs font-bold hover:bg-blue-200 active:scale-95"
              data-student-id="${escapeSummaryHtml(student.id)}" data-student-name="${escapeSummaryHtml(student.name)}"
              data-subject-key="${escapeSummaryHtml(subjectKey)}" data-start-date="${escapeSummaryHtml(startDate)}"
              data-end-date="${escapeSummaryHtml(endDate)}" aria-label="ดูรายละเอียด ${escapeSummaryHtml(student.name)}">👁️</button>
          </td>
        </tr>
      `);
    });

    tbody.append(`
      <tr class="font-bold bg-blue-100">
        <td colspan="3" class="p-3 text-center">รวมทั้งสิ้น</td>
        <td class="p-3 text-center text-emerald-700">${Number(totals.present) || 0}</td>
        <td class="p-3 text-center text-rose-700">${Number(totals.absent) || 0}</td>
        <td class="p-3 text-center text-amber-700">${Number(totals.late) || 0}</td>

      $(this).attr('data-subject-key'), $(this).attr('data-start-date'), $(this).attr('data-end-date')
    );

}

function renderSubjectCharts(totals, dailyTrend) {
  const pieCanvas = document.getElementById('subject-pie-chart');
  if (pieCanvas) {
    if (window.subjectPieChart) window.subjectPieChart.destroy();
    window.subjectPieChart = new Chart(pieCanvas.getContext('2d'), {
      type: 'pie',
      data: {
        labels: ['มา', 'ขาด', 'สาย', 'ลา', 'ป่วย'],
        datasets: [{
          data: [totals.present || 0, totals.absent || 0, totals.late || 0, totals.leave || 0, totals.sick || 0],
          backgroundColor: ['#10b981', '#ef4444', '#eab308', '#3b82f6', '#a855f7']
        }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { position: 'right' }, title: { display: true, text: 'สัดส่วนการเข้าเรียน' } }
      }
    });
  }

  const dates = Object.keys(dailyTrend).sort();
  const present = dates.map(date => dailyTrend[date].present || 0);
  const others = dates.map(date => (dailyTrend[date].absent || 0) + (dailyTrend[date].leave || 0) + (dailyTrend[date].late || 0) + (dailyTrend[date].sick || 0));
  const barCanvas = document.getElementById('subject-bar-chart');
  if (barCanvas) {
    if (window.subjectBarChart) window.subjectBarChart.destroy();
    window.subjectBarChart = new Chart(barCanvas.getContext('2d'), {
      type: 'bar',
      data: {
        labels: dates.map(date => {
          const parts = date.split('-');
          return `${parseInt(parts[2], 10)}/${parseInt(parts[1], 10)}`;
        }),
        datasets: [
          { label: 'มา', data: present, backgroundColor: '#10b981', stack: 'total' },
          { label: 'ขาด/ลา/สาย/ป่วย', data: others, backgroundColor: '#ef4444', stack: 'total' }
        ]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { position: 'top' }, title: { display: true, text: 'แนวโน้มรายวัน' } },
        scales: { x: { stacked: true }, y: { stacked: true, beginAtZero: true, ticks: { precision: 0 } } }
      }
    });
  }
}

let weeklyState = {
  currentMode: 'attendance',
  currentStartDate: null,
  currentEndDate: null,
  currentPeriod: 'morning'
};

function initWeeklySummary() {
  setWeek(TODAY);

  $(".weekly-mode-btn").off("click").on("click", function() {
    $(".weekly-mode-btn").removeClass("bg-blue-700 text-white").addClass("bg-gray-100 text-gray-600");
    $(this).removeClass("bg-gray-100 text-gray-600").addClass("bg-blue-700 text-white");
    weeklyState.currentMode = $(this).data('mode');
    $("#weekly-period-row").toggle(weeklyState.currentMode === 'attendance');
    loadWeeklyReport();
  });

  loadPeriodButtons("#weekly-period-buttons");
  $("#weekly-period-buttons").off("click", ".period-btn").on("click", ".period-btn", function() {
    $("#weekly-period-buttons .period-btn").removeClass("active text-white").addClass("text-gray-700 bg-white");
    $(this).addClass("active text-white").removeClass("text-gray-700 bg-white");
    weeklyState.currentPeriod = $(this).data('period');
    loadWeeklyReport();
  });

  $("#weekly-prev").off("click").on("click", () => shiftWeek(-7));
  $("#weekly-next").off("click").on("click", () => shiftWeek(7));

  loadWeeklyReport();
}

function setWeek(baseDateStr) {
  const d = new Date(baseDateStr);
  const dayOfWeek = d.getDay();
  const firstDay = new Date(d);
  firstDay.setDate(d.getDate() - dayOfWeek + (dayOfWeek === 0 ? -6 : 1));
  const lastDay = new Date(firstDay);
  lastDay.setDate(firstDay.getDate() + 4);

  const fmt = (dt) => {
    const p = [dt.getFullYear(), String(dt.getMonth() + 1).padStart(2, '0'), String(dt.getDate()).padStart(2, '0')];
    return p.join('-');
  };

  weeklyState.currentStartDate = fmt(firstDay);
  weeklyState.currentEndDate = fmt(lastDay);
  updateWeeklyRangeLabel();
}

function shiftWeek(days) {
  const d = new Date(weeklyState.currentStartDate);
  d.setDate(d.getDate() + days);
  const fmt = (dt) => {
    const p = [dt.getFullYear(), String(dt.getMonth() + 1).padStart(2, '0'), String(dt.getDate()).padStart(2, '0')];
    return p.join('-');
  };
  setWeek(fmt(d));
  loadWeeklyReport();
}

function updateWeeklyRangeLabel() {
  const fmt = (ds) => {
    const p = ds.split('-');
    return `${parseInt(p[2])}/${parseInt(p[1])}`;
  };
  const year = parseInt(weeklyState.currentStartDate.split('-')[0]) + 543;
  $("#weekly-range").text(`${fmt(weeklyState.currentStartDate)} - ${fmt(weeklyState.currentEndDate)} / ${year}`);
}

async function loadWeeklyReport() {
  $("#weekly-empty").show().text("กำลังโหลด...");
  $("#weekly-table-container").addClass("hidden");

  const teacher = JSON.parse(localStorage.getItem('teacher') || '{}');
  const teacherEmail = teacher.username || teacher.email || '';

  const options = {
    period: weeklyState.currentMode === 'attendance' ? weeklyState.currentPeriod : '',
    teacherEmail: teacherEmail
  };

  try {
    const res = await runGoogleScript('getWeeklyCheckReport',
      weeklyState.currentStartDate, weeklyState.currentEndDate,
      weeklyState.currentMode, options);
    if (res.status !== 'success') throw new Error(res.message);
    renderWeeklyTable(res.data, weeklyState.currentMode);
    $("#weekly-empty").hide();
    $("#weekly-table-container").removeClass("hidden");
  } catch (err) {
    $("#weekly-empty").text("ผิดพลาด: " + err.message);
  }
}

function renderWeeklyTable(data, mode) {
  const { weekDates, rows } = data;
  const dayNames = ['อา.', 'จ.', 'อ.', 'พ.', 'พฤ.', 'ศ.', 'ส.'];

  // Header
  let thead = '<tr class="bg-blue-700 text-white">';
  thead += '<th class="p-3 text-left">รายการ</th>';
  weekDates.forEach(d => {
    const dayOfWeek = new Date(d + 'T00:00:00Z').getUTCDay();
    const [_, m, dd] = d.split('-');
    thead += `<th class="p-3 text-center">${dayNames[dayOfWeek]}<br><span class="text-xs opacity-75">${parseInt(dd)}/${parseInt(m)}</span></th>`;
  });
  thead += '<th class="p-3 text-center">รวม</th><th class="p-3 text-center">%</th>';
  thead += '</tr>';
  $("#weekly-thead").html(thead);

  // Body
  const tbody = $("#weekly-tbody").empty();

  rows.forEach(r => {
    const scheduledDates = weekDates.filter(d => d in r.dates);
    const checkedCount = scheduledDates.filter(d => r.dates[d] === true).length;
    const pct = scheduledDates.length > 0 ? ((checkedCount / scheduledDates.length) * 100).toFixed(0) : 0;
    const pctColor = pct >= 80 ? 'text-emerald-600' : pct >= 50 ? 'text-amber-600' : 'text-rose-600';

    let html = `<tr class="border-b border-gray-100 hover:bg-blue-50">`;
    html += `<td class="p-3 font-medium text-gray-800">${escapeSummaryHtml(r.name)}${r.sublabel ? ` <span class="text-xs text-gray-500">(${escapeSummaryHtml(r.sublabel)})</span>` : ''}</td>`;

    weekDates.forEach(d => {
      const isScheduled = d in r.dates;
      const isChecked = r.dates[d] === true;
      if (!isScheduled) {
        html += '<td class="p-3 text-center text-gray-300">—</td>';
      } else {
        const icon = isChecked ? '<span class="text-emerald-600 font-bold">✓</span>' : '<span class="text-red-500 font-bold">⚡</span>';
        const cursor = r.clickable ? 'cursor-pointer hover:bg-blue-100' : '';
        const clickData = r.clickable
          ? `data-date="${escapeSummaryHtml(d)}" data-row-id="${escapeSummaryHtml(r.id)}" data-mode="${escapeSummaryHtml(mode)}" data-meta="${escapeSummaryHtml(JSON.stringify(r.meta || {}))}"`
          : '';
        html += `<td class="p-3 text-center ${cursor} ${r.clickable ? 'weekly-cell' : ''}" ${clickData}>${icon}</td>`;
      }
    });

    html += `<td class="p-3 text-center font-bold">${checkedCount}/${scheduledDates.length}</td>`;
    html += `<td class="p-3 text-center font-bold ${pctColor}">${pct}%</td>`;
    html += '</tr>';
    tbody.append(html);
  });

  tbody.off('click', '.weekly-cell').on('click', '.weekly-cell', function() {
    const cell = $(this);
    handleWeeklyCellClick(cell.attr('data-date'), cell.attr('data-row-id'), cell.attr('data-mode'), cell.attr('data-meta') || '{}');
  });

  // Footer
  let tfoot = '<tr class="bg-blue-100 font-bold">';
  tfoot += '<td class="p-3">รวม</td>';
  weekDates.forEach(d => {
    let checked = 0, total = 0;
    rows.forEach(r => {
      if (d in r.dates) {
        total++;
        if (r.dates[d]) checked++;
      }
    });
    tfoot += `<td class="p-3 text-center">${checked}/${total}</td>`;
  });
  tfoot += '<td class="p-3 text-center">—</td><td class="p-3 text-center">—</td></tr>';
  $("#weekly-tfoot").html(tfoot);
}

function handleWeeklyCellClick(date, rowId, mode, metaJson) {
  const meta = JSON.parse(metaJson);

  if (mode === 'attendance') {
    const roomName = (ALL_CLASSROOMS.find(c => c.id === rowId) || {}).name || rowId;
    openAttendanceModal(date, weeklyState.currentPeriod, rowId, roomName);
  } else if (mode === 'cleaning') {
    const roomName = (ALL_CLASSROOMS.find(c => c.id === rowId) || {}).name || rowId;
    openCleaningModal(date, rowId, roomName);
  } else if (mode === 'subject') {
    // เปิด subject modal พร้อม preselect
    openSubjectAttendanceModal({ date: date, subjectCode: meta.code });
  }
}


// ========================================
// PHASE 3.5: Risk Assessment UI
// ========================================
let riskState = {
  mode: 'week',
  startDate: null,
  endDate: null,
  classroomFilter: '',
  weights: { attendance: 40, cleaning: 30, subject: 30 },
  lastData: null,
  requestId: 0
};

function resetRiskAssessmentState() {
  riskState.mode = 'week';
  riskState.startDate = null;
  riskState.endDate = null;
  riskState.classroomFilter = '';
  riskState.weights = { attendance: 40, cleaning: 30, subject: 30 };
  riskState.lastData = null;
  riskState.requestId++;
  $('#risk-classroom').removeData('risk-loaded').empty().append($('<option>').val('').text('ทุกห้อง'));
  $('#risk-content').addClass('hidden');
  $('#risk-empty').removeClass('hidden').text('เลือกช่วงวันที่แล้วกดประเมิน');
  $('#risk-settings-modal, #risk-detail-modal, #risk-daily-modal').hide();
  if (window.riskPieChart) { window.riskPieChart.destroy(); window.riskPieChart = null; }
  if (window.riskBarChart) { window.riskBarChart.destroy(); window.riskBarChart = null; }
}

async function initRiskAssessment() {
  if (!riskState.startDate) setRiskPeriod(TODAY);
  $('#risk-view-mode').val(riskState.mode);
  $('#risk-view-mode').off('change.risk').on('change.risk', function() {
    riskState.mode = $(this).val();
    setRiskPeriod(riskState.startDate || TODAY);
    loadRiskAssessment();
  });
  $('#risk-prev').off('click.risk').on('click.risk', function() { shiftRiskPeriod(-1); });
  $('#risk-next').off('click.risk').on('click.risk', function() { shiftRiskPeriod(1); });
  $('#risk-run').off('click.risk').on('click.risk', loadRiskAssessment);
  $('#risk-print-summary').off('click.risk').on('click.risk', printRiskSummary);
  $('#risk-classroom').off('change.risk').on('change.risk', function() {
    riskState.classroomFilter = String($(this).val() || '');
    loadRiskAssessment();
  });
  $('#risk-settings-btn').off('click.risk').on('click.risk', function() {
    $('#risk-w-att').val(riskState.weights.attendance);
    $('#risk-w-cln').val(riskState.weights.cleaning);
    $('#risk-w-subj').val(riskState.weights.subject);
    $('#risk-settings-modal').css('display', 'flex');
  });
  $('[data-risk-close]').off('click.risk').on('click.risk', function() {
    $('#' + $(this).attr('data-risk-close')).hide();
  });
  $('#risk-settings-save').off('click.risk').on('click.risk', saveRiskWeightSettings);

  try {
    await Promise.all([loadRiskClassrooms(), loadRiskWeightSettings()]);
    if (riskState.lastData) renderRiskAssessment(riskState.lastData);
    else await loadRiskAssessment();
  } catch (error) {
    console.error('Risk assessment initialization error:', error);
    $('#risk-content').addClass('hidden');
    $('#risk-empty').removeClass('hidden').text(`เริ่มต้นหน้าประเมินไม่สำเร็จ: ${error.message || 'เกิดข้อผิดพลาด'}`);
    $.LoadingOverlay('hide');
    Swal.fire('ผิดพลาด', error.message || 'เริ่มต้นหน้าประเมินความเสี่ยงไม่สำเร็จ', 'error');
  }
}

async function loadRiskClassrooms() {
  const select = $('#risk-classroom');
  if (select.data('risk-loaded')) return;
  let rooms = Array.isArray(ALL_CLASSROOMS) ? ALL_CLASSROOMS.slice() : [];
  if (!rooms.length) {
    const response = await runGoogleScript('getClassrooms', []);
    if (response.status !== 'success') throw new Error(response.message || 'โหลดรายชื่อห้องไม่สำเร็จ');
    rooms = response.data || [];
    if (typeof ALL_CLASSROOMS !== 'undefined') ALL_CLASSROOMS = rooms;
  }
  select.empty().append($('<option>').val('').text('ทุกห้อง'));
  rooms.forEach(function(room) {
    select.append($('<option>').val(room.id).text(room.name || room.id));
  });
  select.val(riskState.classroomFilter);
  select.data('risk-loaded', true);
}

async function loadRiskWeightSettings() {
  const response = await runGoogleScript('getRiskWeights');
  if (response.status === 'success' && response.data) {
    riskState.weights = {
      attendance: Number(response.data.attendance),
      cleaning: Number(response.data.cleaning),
      subject: Number(response.data.subject)
    };
    updateRiskWeightsDisplay();
  }
}

async function saveRiskWeightSettings() {
  const weights = {
    attendance: Number($('#risk-w-att').val()),
    cleaning: Number($('#risk-w-cln').val()),
    subject: Number($('#risk-w-subj').val())
  };
  if (Object.keys(weights).some(function(key) { return !Number.isFinite(weights[key]) || weights[key] < 0 || weights[key] > 100; }) ||
      weights.attendance + weights.cleaning + weights.subject <= 0) {
    Swal.fire('แจ้งเตือน', 'น้ำหนักแต่ละกิจกรรมต้องอยู่ระหว่าง 0 ถึง 100 และผลรวมต้องมากกว่า 0', 'warning');
    return;
  }
  $.LoadingOverlay('show', { text: 'กำลังบันทึกน้ำหนัก...' });
  try {
    const response = await runGoogleScript('saveRiskWeights', JSON.stringify(weights));
    if (response.status !== 'success') throw new Error(response.message || 'บันทึกน้ำหนักไม่สำเร็จ');
    riskState.weights = weights;
    updateRiskWeightsDisplay();
    $('#risk-settings-modal').hide();
    await loadRiskAssessment();
    Swal.fire({ icon: 'success', title: 'บันทึกแล้ว', timer: 1200, showConfirmButton: false });
  } catch (error) {
    Swal.fire('ผิดพลาด', error.message, 'error');
  } finally {
    $.LoadingOverlay('hide');
  }
}

function updateRiskWeightsDisplay() {
  const w = riskState.weights;
  $('#risk-weights-display').text(`เข้าแถว ${w.attendance}% | เขตพื้นที่ ${w.cleaning}% | เข้าเรียน ${w.subject}%`);
}

function riskFormatISO(date) {
  return [date.getFullYear(), String(date.getMonth() + 1).padStart(2, '0'), String(date.getDate()).padStart(2, '0')].join('-');
}

function setRiskPeriod(baseDateStr) {
  const parts = String(baseDateStr || TODAY).split('-').map(Number);
  const d = new Date(parts[0], parts[1] - 1, parts[2]);
  let start;
  let end;
  if (riskState.mode === 'week') {
    const day = d.getDay();
    start = new Date(d);
    start.setDate(d.getDate() - (day === 0 ? 6 : day - 1));
    end = new Date(start);
    end.setDate(start.getDate() + 4);
  } else {
    start = new Date(d.getFullYear(), d.getMonth(), 1);
    end = new Date(d.getFullYear(), d.getMonth() + 1, 0);
  }
  riskState.startDate = riskFormatISO(start);
  riskState.endDate = riskFormatISO(end);
  const thaiDate = function(dateStr) {
    const p = dateStr.split('-');
    return `${Number(p[2])}/${Number(p[1])}/${Number(p[0]) + 543}`;
  };
  const prefix = riskState.mode === 'week' ? 'สัปดาห์' : 'เดือน';
  $('#risk-date-display').val(`${prefix}: ${thaiDate(riskState.startDate)} - ${thaiDate(riskState.endDate)}`);
}

function shiftRiskPeriod(direction) {
  const parts = riskState.startDate.split('-').map(Number);
  const date = new Date(parts[0], parts[1] - 1, parts[2]);
  if (riskState.mode === 'week') date.setDate(date.getDate() + direction * 7);
  else date.setMonth(date.getMonth() + direction);
  setRiskPeriod(riskFormatISO(date));
  loadRiskAssessment();
}

async function loadRiskAssessment() {
  if (!riskState.startDate || !riskState.endDate) return;
  const requestId = ++riskState.requestId;
  riskState.lastData = null;
  $('#risk-content').addClass('hidden');
  $('#risk-empty').removeClass('hidden').text('กำลังประเมิน...');
  $.LoadingOverlay('show', { text: 'กำลังประเมิน...' });
  try {
    const response = await runGoogleScript(
      'getStudentRiskAssessment', riskState.startDate, riskState.endDate,
      riskState.classroomFilter || '', JSON.stringify(riskState.weights)
    );
    if (requestId !== riskState.requestId) return;
    if (response.status !== 'success') throw new Error(response.message || 'ประเมินไม่สำเร็จ');
    riskState.lastData = response.data;
    renderRiskAssessment(response.data);
    $('#risk-empty').addClass('hidden');
    $('#risk-content').removeClass('hidden');
  } catch (error) {
    if (requestId === riskState.requestId) {
      console.error('Risk assessment error:', error);
      riskState.lastData = null;
      $('#risk-content').addClass('hidden');
      $('#risk-empty').removeClass('hidden').text(`โหลดผลประเมินไม่สำเร็จ: ${error.message || 'เกิดข้อผิดพลาด'}`);
      Swal.fire('ผิดพลาด', error.message || 'โหลดผลประเมินไม่สำเร็จ', 'error');
    }
  } finally {
    if (requestId === riskState.requestId) $.LoadingOverlay('hide');
  }
}

function riskEscapeHtml(value) {
  return String(value == null ? '' : value).replace(/[&<>"']/g, function(char) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[char];
  });
}

function riskCategoryLabel(category) {
  return category === 'red' ? '🔴 ใกล้ชิด' : category === 'yellow' ? '🟡 ห่วงใย' : '🟢 ไว้ใจ';
}

function renderRiskAssessment(data) {
  if (!data || typeof data !== 'object' || !data.summary || !data.period) throw new Error('รูปแบบข้อมูลประเมินไม่ถูกต้อง');
  const summary = Object.assign({ red: 0, yellow: 0, green: 0, avgScore: 0, totalStudents: 0, scoredStudents: 0 }, data.summary);
  const students = (Array.isArray(data.students) ? data.students : []).filter(function(student) { return student && typeof student === 'object'; }).map(function(student) {
    const composite = student.composite === null || student.composite === undefined ? null : Number(student.composite);
    return Object.assign({}, student, {
      composite: Number.isFinite(composite) ? composite : null,
      category: ['red', 'yellow', 'green'].includes(student.category) ? student.category : 'yellow',
      breakdown: Object.assign({ attendance: null, cleaning: null, subject: null }, student.breakdown || {}),
      dailyScores: student.dailyScores && typeof student.dailyScores === 'object' ? student.dailyScores : {}
    });
  });
  const dates = Array.isArray(data.period.dates) ? data.period.dates : [];
  $('#risk-card-red').text(summary.red || 0);
  $('#risk-card-yellow').text(summary.yellow || 0);
  $('#risk-card-green').text(summary.green || 0);
  $('#risk-card-avg').text(summary.scoredStudents ? `${summary.avgScore}%` : '—');
  $('#risk-card-total').text(`จาก ${summary.totalStudents || 0} คน (${summary.scoredStudents || 0} คนมีข้อมูล)`);
  renderRiskCharts(summary, students, dates);
  renderRiskGrid(students, dates);
  renderRiskList('red', students.filter(function(student) { return student.category === 'red'; }));
  renderRiskList('yellow', students.filter(function(student) { return student.category === 'yellow'; }));
  renderRiskList('green', students.filter(function(student) { return student.category === 'green'; }));
}

function riskWeekStart(dateStr) {
  const p = dateStr.split('-').map(Number);
  const date = new Date(p[0], p[1] - 1, p[2]);
  const day = date.getDay();
  date.setDate(date.getDate() - (day === 0 ? 6 : day - 1));
  return riskFormatISO(date);
}

function renderRiskCharts(summary, students, dates) {
  const pieCanvas = document.getElementById('risk-pie-chart');
  if (pieCanvas && typeof Chart !== 'undefined') {
    if (window.riskPieChart) window.riskPieChart.destroy();
    window.riskPieChart = new Chart(pieCanvas.getContext('2d'), {
      type: 'pie',
      data: {
        labels: ['🔴 ใกล้ชิด', '🟡 ห่วงใย / ไม่มีข้อมูล', '🟢 ไว้ใจ'],
        datasets: [{ data: [summary.red || 0, summary.yellow || 0, summary.green || 0], backgroundColor: ['#ef4444', '#eab308', '#10b981'] }]
      },
      options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'right' }, title: { display: true, text: 'สัดส่วนกลุ่มความเสี่ยง' } } }
    });
  }

  const weeks = {};
  (dates || []).forEach(function(date) {
    const key = riskWeekStart(date);
    if (!weeks[key]) weeks[key] = [];
    weeks[key].push(date);
  });
  const labels = Object.keys(weeks).sort().map(function(start) {
    const p = start.split('-');
    return `สัปดาห์ ${Number(p[2])}/${Number(p[1])}`;
  });
  const counts = { red: [], yellow: [], green: [] };
  Object.keys(weeks).sort().forEach(function(weekStart) {
    const weekDates = weeks[weekStart];
    const count = { red: 0, yellow: 0, green: 0 };
    students.forEach(function(student) {
      const values = weekDates.map(function(date) {
        const day = student.dailyScores && student.dailyScores[date];
        return day && Number.isFinite(Number(day.score)) ? Number(day.score) : null;
      }).filter(function(value) { return value !== null; });
      if (!values.length) return;
      const average = values.reduce(function(sum, value) { return sum + value; }, 0) / values.length;
      const category = average >= 85 ? 'green' : average >= 60 ? 'yellow' : 'red';
      count[category]++;
    });
    ['red', 'yellow', 'green'].forEach(function(category) { counts[category].push(count[category]); });
  });
  const barCanvas = document.getElementById('risk-bar-chart');
  if (barCanvas && typeof Chart !== 'undefined') {
    if (window.riskBarChart) window.riskBarChart.destroy();
    window.riskBarChart = new Chart(barCanvas.getContext('2d'), {
      type: 'bar',
      data: {
        labels: labels,
        datasets: [
          { label: '🔴 ใกล้ชิด', data: counts.red, backgroundColor: '#ef4444' },
          { label: '🟡 ห่วงใย', data: counts.yellow, backgroundColor: '#eab308' },
          { label: '🟢 ไว้ใจ', data: counts.green, backgroundColor: '#10b981' }
        ]
      },
      options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'top' }, title: { display: true, text: 'แนวโน้มรายสัปดาห์ (ค่าเฉลี่ยรายวัน)' } }, scales: { x: { stacked: true }, y: { stacked: true, beginAtZero: true, ticks: { precision: 0 } } } }
    });
  }
}

function renderRiskGrid(students, dates) {
  const dayNames = ['อา.', 'จ.', 'อ.', 'พ.', 'พฤ.', 'ศ.', 'ส.'];
  let header = '<tr class="bg-slate-800 text-white"><th class="p-2 text-left">ชื่อ-สกุล</th><th class="p-2 text-center">ห้อง</th>';
  dates.forEach(function(date) {
    const p = date.split('-').map(Number);
    const day = new Date(p[0], p[1] - 1, p[2]).getDay();
    header += `<th class="p-2 text-center text-xs">${dayNames[day]}<br><span class="opacity-75">${p[2]}/${p[1]}</span></th>`;
  });
  header += '<th class="p-2 text-center">รวม</th><th class="p-2 text-center">กลุ่ม</th></tr>';
  $('#risk-grid-thead').html(header);
  const tbody = $('#risk-grid-tbody').empty();
  if (!students.length) {
    tbody.append(`<tr><td colspan="${dates.length + 4}" class="text-center p-6 text-gray-400">ไม่มีรายชื่อนักเรียนในช่วงที่เลือก</td></tr>`);
    return;
  }
  students.forEach(function(student) {
    let row = `<tr class="border-b border-gray-100 hover:bg-blue-50"><td class="p-2 text-gray-800 text-sm font-medium">${riskEscapeHtml(student.name)}</td><td class="p-2 text-center text-gray-600 text-xs">${riskEscapeHtml(student.classroom_name)}</td>`;
    dates.forEach(function(date) {
      const day = student.dailyScores && student.dailyScores[date];
      if (!day) row += '<td class="p-2 text-center text-gray-300 text-xs">⚪</td>';
      else {
        const color = day.category === 'green' ? 'background:#dcfce7;color:#166534' : day.category === 'yellow' ? 'background:#fef3c7;color:#92400e' : 'background:#fee2e2;color:#991b1b';
        row += `<td class="p-1 text-center text-xs"><button type="button" class="risk-daily-button rounded px-2 py-1 font-bold" style="${color}" data-student-id="${riskEscapeHtml(student.id)}" data-classroom-id="${riskEscapeHtml(student.classroom_id)}" data-risk-date="${date}" title="คะแนน ${day.score}%">${day.score}%</button></td>`;
      }
    });
    const composite = student.composite === null ? '—' : `${student.composite}%`;
    row += `<td class="p-2 text-center font-bold text-gray-800">${composite}</td><td class="p-2 text-center"><span class="px-2 py-1 rounded-lg text-xs font-bold">${riskCategoryLabel(student.category)}</span></td></tr>`;
    tbody.append(row);
  });
  tbody.off('click.risk', '.risk-daily-button').on('click.risk', '.risk-daily-button', function() {
    showRiskDaily($(this).attr('data-student-id'), $(this).attr('data-classroom-id'), $(this).attr('data-risk-date'));
  });
}

function renderRiskList(category, students) {
  const tbody = $(`#risk-list-${category}`).empty();
  const container = $(`#risk-list-${category}-container`);
  if (!students.length) { container.hide(); return; }
  container.show();
  students.forEach(function(student) {
    const pct = function(item) {
      if (!item) return '<span class="text-gray-300">—</span>';
      const color = item.score >= 85 ? 'text-emerald-600' : item.score >= 60 ? 'text-amber-600' : 'text-rose-600';
      return `<span class="font-bold ${color}">${item.score}%</span>`;
    };
    const studentId = riskEscapeHtml(student.id);
    const classroomId = riskEscapeHtml(student.classroom_id);
    const printButtons = category === 'red' ? `
      <button type="button" class="risk-print-warning px-2 py-1 bg-rose-100 text-rose-700 rounded-lg text-xs font-bold hover:bg-rose-200 mr-1" data-student-id="${studentId}" data-classroom-id="${classroomId}" title="พิมพ์หนังสือแจ้งเตือน">📄</button>

  });
  tbody.off('click.risk', '.risk-print-warning').on('click.risk', '.risk-print-warning', function() {
    openPrintWarning($(this).attr('data-student-id'), $(this).attr('data-classroom-id'));
  });
  tbody.off('click.risk', '.risk-print-activity').on('click.risk', '.risk-print-activity', function() {
    openPrintActivity($(this).attr('data-student-id'), $(this).attr('data-classroom-id'));

}

function riskEventsText(events, kind) {
  if (!events || !events.length) return 'ไม่มีข้อมูล';
  return events.map(function(event) {
    let label = event.status || '';
    if (kind === 'attendance' && event.period) label += ` (${event.period})`;
    if (kind === 'subject' && event.subject) label += ` [${event.subject}]`;
    return riskEscapeHtml(label);
  }).join('<br>');
}

function riskBreakdownCard(icon, label, data, color) {
  if (!data) return `<div class="p-3 rounded-xl bg-gray-100"><div class="text-xs font-bold text-gray-500">${icon} ${label}</div><div class="text-lg font-extrabold text-gray-400 mt-1">ไม่มีข้อมูล</div></div>`;
  return `<div class="p-3 rounded-xl" style="background:${color.bg}"><div class="text-xs font-bold" style="color:${color.text}">${icon} ${label}</div><div class="text-2xl font-extrabold mt-1" style="color:${color.text}">${data.score}%</div><div class="text-xs mt-1" style="color:${color.text}">${data.points} / ${data.total} ครั้ง</div></div>`;
}

async function riskFetchStudentDetail(studentId, classroomId) {
  const response = await runGoogleScript('getStudentRiskDetail', studentId, riskState.startDate, riskState.endDate, classroomId || '', JSON.stringify(riskState.weights));
  if (response.status !== 'success') throw new Error(response.message || 'โหลดรายละเอียดไม่สำเร็จ');
  const data = response.data;
  if (!data || !data.student || !Array.isArray(data.days)) throw new Error('รูปแบบข้อมูลรายละเอียดไม่ถูกต้อง');
  const student = Object.assign({}, data.student, { breakdown: Object.assign({ attendance: null, cleaning: null, subject: null }, data.student.breakdown || {}) });
  const days = data.days.filter(function(day) { return day && typeof day === 'object'; }).map(function(day) {
    return Object.assign({}, day, {
      attendance: Array.isArray(day.attendance) ? day.attendance : [],
      cleaning: Array.isArray(day.cleaning) ? day.cleaning : [],
      subject: Array.isArray(day.subject) ? day.subject : []
    });
  });
  return Object.assign({}, data, { student: student, days: days });
}

async function showRiskDetail(studentId, classroomId) {
  $('#risk-detail-title').text('กำลังโหลดรายละเอียด...');
  $('#risk-detail-sub').text('');
  $('#risk-detail-modal').css('display', 'flex');
  $('#risk-detail-tbody').html('<tr><td colspan="5" class="text-center p-5 text-gray-400">กำลังโหลด...</td></tr>');
  try {
    const data = await riskFetchStudentDetail(studentId, classroomId);
    const student = data.student;
    $('#risk-detail-title').text(`👁️ ${student.name}`);
    $('#risk-detail-sub').text(`ห้อง ${student.classroom_name} | Composite ${student.composite === null ? '—' : `${student.composite}%`} | ${riskCategoryLabel(student.category)}`);
    $('#risk-detail-breakdown').html(
      riskBreakdownCard('📝', 'เข้าแถว', student.breakdown.attendance, { bg: '#dcfce7', text: '#166534' }) +
      riskBreakdownCard('🧹', 'เขตพื้นที่', student.breakdown.cleaning, { bg: '#dbeafe', text: '#1e40af' }) +
      riskBreakdownCard('📚', 'เข้าเรียน', student.breakdown.subject, { bg: '#f3e8ff', text: '#6b21a8' })
    );
    const tbody = $('#risk-detail-tbody').empty();
    data.days.forEach(function(day) {
      const hasEvents = day.attendance.length || day.cleaning.length || day.subject.length;
      if (!hasEvents) return;
      const scoreText = day.score === null ? 'ไม่มีข้อมูล' : `${day.score}% ${riskCategoryLabel(day.category)}`;
      tbody.append(`<tr class="border-b border-gray-100"><td class="p-3 text-gray-700 text-sm">${riskEscapeHtml(day.date)}</td><td class="p-3 text-sm">${riskEventsText(day.attendance, 'attendance')}</td><td class="p-3 text-sm">${riskEventsText(day.cleaning, 'cleaning')}</td><td class="p-3 text-sm">${riskEventsText(day.subject, 'subject')}</td><td class="p-3 text-center text-xs">${riskEscapeHtml(scoreText)}</td></tr>`);
    });
    if (!tbody.children().length) tbody.append('<tr><td colspan="5" class="text-center p-5 text-gray-400">ไม่มีข้อมูลในช่วงวันที่นี้</td></tr>');
  } catch (error) {
    $('#risk-detail-tbody').html(`<tr><td colspan="5" class="text-center p-5 text-rose-600">${riskEscapeHtml(error.message)}</td></tr>`);
  }
}

async function showRiskDaily(studentId, classroomId, date) {
  $('#risk-daily-title').text(`📅 ${date}`);
  $('#risk-daily-sub').text('กำลังโหลดรายละเอียด...');

    html += `<div class="p-3 rounded-xl mt-2 text-center ${day.category === 'red' ? 'bg-rose-100 text-rose-800' : day.category === 'yellow' ? 'bg-amber-100 text-amber-800' : day.category === 'green' ? 'bg-emerald-100 text-emerald-800' : 'bg-gray-100 text-gray-700'}"><div class="text-xs font-bold">คะแนนรวมวันนี้</div><div class="text-3xl font-extrabold">${day.score === null ? 'ไม่มีข้อมูล' : `${day.score}%`}</div></div>`;

async function showPrintConfig(type, studentId, classroomId) {
  const students = riskState.lastData && Array.isArray(riskState.lastData.students) ? riskState.lastData.students : [];
  const student = students.find(function(item) {
    return String(item.id) === String(studentId) && (!classroomId || String(item.classroom_id) === String(classroomId));
  });
  if (!student) {
    Swal.fire('แจ้งเตือน', 'ไม่พบนักเรียนในผลการประเมินปัจจุบัน', 'warning');
    return;
  }

  let selectedType = type;
  let history = { redCount: null, yellowCount: null, recommendation: 'none' };
  let historyMessage = 'ยังไม่ได้โหลดประวัติกลุ่มสี';
  $.LoadingOverlay('show', { text: 'กำลังโหลดประวัติ 8 สัปดาห์...' });
  try {
    const response = await runGoogleScript('getStudentRiskHistory', student.id, 8, student.classroom_id || classroomId || '');
    if (response.status === 'success' && response.data) {
      history = response.data;
      if (history.recommendation === 'warning' || history.recommendation === 'activity') selectedType = history.recommendation;
      const recommendationLabel = history.recommendation === 'activity'
        ? 'แนะนำหนังสือทำกิจกรรม' : history.recommendation === 'warning'
          ? 'แนะนำหนังสือแจ้งเตือน' : 'ยังไม่มีข้อแนะนำจากประวัติสีแดง';
      historyMessage = `กลุ่มแดง ${history.redCount} ครั้งใน 8 สัปดาห์ — ${recommendationLabel}`;
    } else {
      historyMessage = 'โหลดประวัติไม่สำเร็จ — เลือกประเภทเอกสารได้เอง';
    }
  } catch (error) {
    historyMessage = 'โหลดประวัติไม่สำเร็จ — เลือกประเภทเอกสารได้เอง';
    console.warn('Could not load student risk history:', error);
  } finally {
    $.LoadingOverlay('hide');
  }
  currentPrintTarget = {
    type: selectedType,
    studentId: String(student.id),
    classroomId: String(student.classroom_id || classroomId || ''),
    history: history
  };
  $('#print-history-summary').text(historyMessage);

  const schoolName = typeof CONFIG !== 'undefined' && CONFIG.school_config && CONFIG.school_config.schoolName
    ? CONFIG.school_config.schoolName : 'โรงเรียน';
  $('#print-school').val(schoolName);
  $('#print-doc-type').val(selectedType);
  $('#print-doc-no').val(`ศธ 04201/${new Date().getFullYear() + 543 + Math.floor(Math.random() * 1000)}`);
  $('#print-director').val('');

  const docDate = document.getElementById('print-doc-date');
  const activityStart = document.getElementById('print-act-start');
  const activityEnd = document.getElementById('print-act-end');
  if (!docDate._flatpickr) flatpickr(docDate, { dateFormat: 'Y-m-d', locale: 'th', defaultDate: new Date() });
  if (!activityStart._flatpickr) flatpickr(activityStart, { dateFormat: 'Y-m-d', locale: 'th', defaultDate: new Date() });
  if (!activityEnd._flatpickr) flatpickr(activityEnd, { dateFormat: 'Y-m-d', locale: 'th', defaultDate: new Date(Date.now() + 14 * 24 * 60 * 60 * 1000) });
  docDate._flatpickr.setDate(new Date());
  activityStart._flatpickr.setDate(new Date());
  activityEnd._flatpickr.setDate(new Date(Date.now() + 14 * 24 * 60 * 60 * 1000));

  $('#print-activity-options').toggleClass('hidden', selectedType !== 'activity');
  $('#print-doc-type').off('change.print').on('change.print', function() {
    $('#print-activity-options').toggleClass('hidden', $(this).val() !== 'activity');
  });
  $('#print-config-modal').css('display', 'flex');
  $('#print-config-confirm').off('click.print').on('click.print', async function() {
    const docType = $('#print-doc-type').val();
    $('#print-config-modal').hide();
    if (docType === 'warning') await printWarningLetter(student);
    else await printBehaviorActivity(student);
  });
}

async function printWarningLetter(student) {
  // Open the print window synchronously from the click gesture to avoid popup blockers.
  const win = window.open('', '_blank');
  if (!win) {
    Swal.fire('แจ้งเตือน', 'กรุณาอนุญาต Pop-up เพื่อพิมพ์หนังสือ', 'warning');
    return;
  }
  $.LoadingOverlay('show', { text: 'กำลังเตรียมเอกสาร...' });
  try {
    const history = currentPrintTarget && currentPrintTarget.history ? currentPrintTarget.history : { redCount: null, weeks: [] };
    const docNo = $('#print-doc-no').val() || '............';
    const school = $('#print-school').val() || 'โรงเรียน';
    const director = $('#print-director').val() || '....................................';
    const docDate = $('#print-doc-date').val() || new Date().toISOString().split('T')[0];
    const teacher = JSON.parse(localStorage.getItem('teacher') || '{}');
    const teacherName = teacher.name || '....................................';
    const period = riskState.lastData.period;
    const rangeText = `ตั้งแต่วันที่ ${formatThaiDate(period.startDate)} ถึง ${formatThaiDate(period.endDate)}`;
    const breakdown = student.breakdown || {};
    const detailLines = [];
    if (breakdown.attendance) detailLines.push(`การเข้าแถว: ${breakdown.attendance.score}% (${breakdown.attendance.points}/${breakdown.attendance.total} ครั้ง)`);
    if (breakdown.cleaning) detailLines.push(`การทำเวรเขตพื้นที่: ${breakdown.cleaning.score}% (${breakdown.cleaning.points}/${breakdown.cleaning.total} ครั้ง)`);
    if (breakdown.subject) detailLines.push(`การเข้าเรียน: ${breakdown.subject.score}% (${breakdown.subject.points}/${breakdown.subject.total} ครั้ง)`);
    const html = buildWarningLetterHtml({
      school: school, docNo: docNo, docDate: docDate, director: director, teacherName: teacherName,
      student: student, rangeText: rangeText, detailLines: detailLines,
      redCount: history.redCount, composite: student.composite, streak: student.streak
    });
    win.document.open();
    win.document.write(html);
    win.document.close();
    await logGeneratedRiskDocument('warning', student.id, $('#print-doc-no').val());
  } catch (error) {
    if (!win.closed) win.close();
    Swal.fire('ผิดพลาด', error.message || 'เตรียมหนังสือไม่สำเร็จ', 'error');
  } finally {
    $.LoadingOverlay('hide');
  }
}

function buildWarningLetterHtml(options) {
  const escape = riskEscapeHtml;
  const school = escape(options.school);
  const student = options.student || {};
  const studentName = escape(student.name);
  const classroomName = escape(student.classroom_name);
  const studentId = escape(student.id);
  const composite = options.composite == null ? '—' : escape(options.composite);
  const streak = Number(options.streak) || 0;
  const reasonText = [];
  if (options.composite != null && Number(options.composite) < 60) reasonText.push('คะแนนรวมต่ำกว่า 60%');
  if (streak >= 3) reasonText.push(`ขาดเรียนติดต่อกัน ${escape(streak)} วัน`);
  const reason = reasonText.length ? reasonText.join(' หรือ ') : 'เข้าเกณฑ์ติดตามกลุ่มใกล้ชิดของโรงเรียน';
  const details = (options.detailLines || []).map(function(line) {
    return `<div style="padding-left:2.5cm;text-indent:-0.5cm">• ${escape(line)}</div>`;
  }).join('');
  const docNo = escape(options.docNo);
  const docDateThai = formatThaiDateLong(options.docDate);
  const director = escape(options.director);

async function printBehaviorActivity(student) {
  // Open the print window synchronously from the click gesture to avoid popup blockers.
  const win = window.open('', '_blank');
  if (!win) {
    Swal.fire('แจ้งเตือน', 'กรุณาอนุญาต Pop-up เพื่อพิมพ์หนังสือ', 'warning');
    return;
  }
  $.LoadingOverlay('show', { text: 'กำลังเตรียมเอกสาร...' });
  try {
    const history = currentPrintTarget && currentPrintTarget.history ? currentPrintTarget.history : { redCount: null };
    const docNo = $('#print-doc-no').val() || '............';
    const school = $('#print-school').val() || 'โรงเรียน';
    const director = $('#print-director').val() || '....................................';
    const docDate = $('#print-doc-date').val() || new Date().toISOString().split('T')[0];
    const teacher = JSON.parse(localStorage.getItem('teacher') || '{}');
    const teacherName = teacher.name || '....................................';
    const activities = $('.print-act-check:checked').map(function() { return $(this).val(); }).get();
    const actStart = $('#print-act-start').val() || '';
    const actEnd = $('#print-act-end').val() || '';
    const period = riskState.lastData.period;
    const rangeText = `ตั้งแต่วันที่ ${formatThaiDate(period.startDate)} ถึง ${formatThaiDate(period.endDate)}`;
    const html = buildBehaviorActivityHtml({
      school: school, docNo: docNo, docDate: docDate, director: director, teacherName: teacherName,
      student: student, rangeText: rangeText, activities: activities,
      actStart: actStart, actEnd: actEnd, redCount: history.redCount,
      composite: student.composite, streak: student.streak
    });
    win.document.open();
    win.document.write(html);
    win.document.close();
    await logGeneratedRiskDocument('activity', student.id, $('#print-doc-no').val());
  } catch (error) {
    if (!win.closed) win.close();
    Swal.fire('ผิดพลาด', error.message || 'เตรียมหนังสือไม่สำเร็จ', 'error');
  } finally {
    $.LoadingOverlay('hide');
  }
}

function formatThaiDate(dateString) {
  if (!dateString) return '';
  const parts = String(dateString).split('-');
  if (parts.length !== 3) return String(dateString);
  return `${parseInt(parts[2], 10)}/${parseInt(parts[1], 10)}/${parseInt(parts[0], 10) + 543}`;
}

function formatThaiDateLong(dateString) {
  if (!dateString) return '...............';
  const months = ['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
  const parts = String(dateString).split('-');
  if (parts.length !== 3) return riskEscapeHtml(dateString);
  const month = parseInt(parts[1], 10) - 1;
  if (month < 0 || month > 11) return '...............';
  return `${parseInt(parts[2], 10)} ${months[month]} ${parseInt(parts[0], 10) + 543}`;
}
