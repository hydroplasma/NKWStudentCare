<script>
    function loadClassroomSummary() {
        try {
            console.log('Loading classroom summary');
            $("#summary-classroom").val("");
            $("#summary-date").val(checkDateExpiration("summary-date", TODAY));
            $("#summary-period-buttons .period-btn").removeClass("active bg-indigo-600 text-white").addClass("text-gray-700 bg-white");
            $("#summary-period-buttons .period-btn[data-period='morning']").addClass("active bg-indigo-600 text-white").removeClass("text-gray-700 bg-white");
            $("#classroom-summary-list").empty();
            $("#classroom-students-list").empty();
            if (window.classroomPieChart) {
                window.classroomPieChart.destroy();
                window.classroomPieChart = null;
            }
            if (window.classroomBarChart) {
                window.classroomBarChart.destroy();
                window.classroomBarChart = null;
            }
            $("#empty-dashboard").show();
            $("#classroom-chart-container").hide();
            $("#classroom-table-container").hide();
            $("#classroom-students-list-container").hide();
            // Removed line related to classroom-preview-btn
            loadClassroomsDropdown("#summary-classroom");
            updateClassroomSummaryTitle();
        } catch (error) {
            console.error('Error in loadClassroomSummary:', error);
            Swal.fire({
                icon: 'error',
                title: 'ข้อผิดพลาด',
                text: 'เกิดข้อผิดพลาดในการโหลดสรุปตามห้องเรียน: ' + error.message,
                confirmButtonText: 'ตกลง'
            });
        }
    }

    async function updateClassroomSummaryTitle() {
        try {
            const classroomId = $("#summary-classroom").val();
            const date = $("#summary-date").val() || TODAY;
            const period = $("#summary-period-buttons .period-btn.active").data("period") || 'morning';
            const periodName = period ? PERIODS.find(p => p.id === period)?.name || period : 'เช้า';
            
            const teacher = JSON.parse(localStorage.getItem("teacher") || "{}");
            if (!teacher || !teacher.classroom_ids) {
                // If no teacher data, set a default title and return
                const schoolName = CONFIG.school_config.schoolName || 'โรงเรียน';
                 $("#classroom-summary-title").html(`
                    สรุปเช็คชื่อนักเรียน ห้อง -- เลือกห้องเรียน --<br>
                    ${schoolName}<br>
                    วันที่ ${formatDateThai(date)} ช่วง${periodName}
                `);
                return;
            }
            const allowedClassroomIds = teacher.classroom_ids;

            $.LoadingOverlay("show");
            const response = await runGoogleScript('getClassrooms', allowedClassroomIds);
            $.LoadingOverlay("hide"); // Hide overlay after script run

            let classroomName = '-- เลือกห้องเรียน --';
            const schoolName = CONFIG.school_config.schoolName || 'โรงเรียน';

            if (response.status === 'success') {
                const classrooms = response.data;
                 if (classrooms && classrooms.length > 0 && classroomId) {
                    classroomName = classrooms.find(c => c.id === classroomId)?.name || classroomId;
                }
            } else {
                console.warn(response.error.details || 'Failed to load classrooms for title');
                // Keep classroomName as '-- เลือกห้องเรียน --' or classroomId if it exists
                if (classroomId) classroomName = classroomId;
            }
            
            $("#classroom-summary-title").html(`
                สรุปเช็คชื่อนักเรียน ห้อง ${classroomName}<br>
                ${schoolName}<br>
                วันที่ ${formatDateThai(date)} ช่วง${periodName}
            `);
        } catch (error) {
            $.LoadingOverlay("hide");
            console.error('Error in updateClassroomSummaryTitle:', error);
             const date = $("#summary-date").val() || TODAY;
            const period = $("#summary-period-buttons .period-btn.active").data("period") || 'morning';
            const periodName = period ? PERIODS.find(p => p.id === period)?.name || period : 'เช้า';
            const schoolName = CONFIG.school_config.schoolName || 'โรงเรียน';
            $("#classroom-summary-title").html(`
                สรุปเช็คชื่อนักเรียน ห้อง -- เลือกห้องเรียน --<br>
                ${schoolName}<br>
                วันที่ ${formatDateThai(date)} ช่วง${periodName}
            `);
            Swal.fire({
                icon: 'error',
                title: 'ข้อผิดพลาด',
                text: 'เกิดข้อผิดพลาดในการอัปเดตหัวข้อสรุปห้องเรียน: ' + error.message,
                confirmButtonText: 'ตกลง'
            });
        }
    }

    async function loadClassroomsDropdown(containerId) { // This function is duplicated in script_main, ensure consistency or refactor
        try {
            console.log('Loading classrooms dropdown for container:', containerId);
            const classroomSelect = $(containerId);
            classroomSelect.empty();
            classroomSelect.append('<option value="">-- เลือกห้องเรียน --</option>');
            const teacher = JSON.parse(localStorage.getItem("teacher") || "{}");
             if (!teacher || !teacher.classroom_ids || !Array.isArray(teacher.classroom_ids) || teacher.classroom_ids.length === 0) {
                console.warn('No teacher data or classroom_ids for dropdown');
                return;
            }
            const allowedClassroomIds = teacher.classroom_ids;

            $.LoadingOverlay("show");
            const response = await runGoogleScript('getClassrooms', allowedClassroomIds);
            $.LoadingOverlay("hide");
            if (response.status !== 'success') {
                throw new Error(response.error.details || 'Failed to load classrooms');
            }
            const classrooms = response.data;
            if (!classrooms || !classrooms.length) {
                 console.warn('No classrooms returned from server for dropdown');
                return;
            }
            classrooms.forEach(classroom => {
                if (allowedClassroomIds.includes(classroom.id)) {
                    classroomSelect.append(`<option value="${classroom.id}">${classroom.name}</option>`);
                }
            });
            if (classroomSelect.find('option').length <= 1) {
                console.warn('No allowed classrooms to populate dropdown');
            }
        } catch (error) {
            $.LoadingOverlay("hide");
            console.error('Error in loadClassroomsDropdown (summary):', error);
            // Avoid Swal here if it's too disruptive for a dropdown load failure
        }
    }

    async function loadClassroomSummaryData(classroomId, date, period) {
        try {
            $.LoadingOverlay("show");
            console.log('Loading classroom summary data for:', { classroomId, date, period });

            const attendanceResponse = await runGoogleScript('getAttendance', date, period, classroomId);
            if (attendanceResponse.status !== 'success') {
                throw new Error(attendanceResponse.error.details || 'Failed to load attendance data');
            }
            const attendanceLog = attendanceResponse.data;
            const filteredData = attendanceLog.filter(entry =>
                entry.room_id === classroomId &&
                entry.date === date &&
                entry.period === period
            ).sort((a, b) => new Date(b.updated_at || b.date) - new Date(a.updated_at || b.date));
            
            if (filteredData.length === 0) {
                $.LoadingOverlay("hide");
                Swal.fire({
                    icon: 'info',
                    title: 'ไม่พบข้อมูล',
                    text: 'ยังไม่มีข้อมูลการเช็คชื่อสำหรับห้องเรียน วันที่ และช่วงเวลาที่เลือก',
                    confirmButtonText: 'ตกลง'
                });
                $("#classroom-chart-container").hide();
                $("#classroom-table-container").hide();
                $("#classroom-students-list-container").hide();
                // Removed line related to classroom-preview-btn
                $("#empty-dashboard").show();
                return;
            }

            const studentResponse = await runGoogleScript('getStudents', [classroomId]);
            if (studentResponse.status !== 'success') {
                throw new Error(studentResponse.error.details || 'Failed to load students');
            }
            const studentsByClassroom = studentResponse.data;
            const students = studentsByClassroom[classroomId] || [];

            const latestEntry = filteredData[0];
            const statusCounts = {};
            STATUS_LIST.forEach(status => {
                statusCounts[status.label] = 0;
            });
            
            const allStudents = [];
            latestEntry.students.forEach(student => {
                if (statusCounts[student.status] !== undefined) {
                    statusCounts[student.status]++;
                } else {
                    console.warn('Unknown status found:', student.status);
                }
                const studentData = students.find(s => String(s.student_id) === String(student.student_id));
                if (studentData) {
                    allStudents.push({
                        student_id: student.student_id,
                        no: studentData.no,
                        name: studentData.name,
                        status: student.status,
                        reason: student.reason || ''
                    });
                }
            });
            
            const tableData = [{
                date: latestEntry.date,
                period: PERIODS.find(p => p.id === latestEntry.period)?.name || latestEntry.period,
                counts: statusCounts
            }];

            updateClassroomTable(tableData, allStudents.length);
            updateClassroomCharts(statusCounts);
            updateClassroomStudentsList(allStudents);

            $("#classroom-table-container").show();
            $("#classroom-chart-container").show();
            $("#classroom-students-list-container").show();
            // Removed lines related to classroom-preview-btn
            $("#empty-dashboard").hide();

            // Removed event listener for classroom-preview-btn

            $.LoadingOverlay("hide");
        } catch (error) {
            $.LoadingOverlay("hide");
            console.error('Error in loadClassroomSummaryData:', error);
            Swal.fire({
                icon: 'error',
                title: 'ข้อผิดพลาด',
                text: 'เกิดข้อผิดพลาดในการโหลดข้อมูลสรุป: ' + error.message,
                confirmButtonText: 'ตกลง'
            });
        }
    }

    function updateClassroomCharts(statusCounts) {
        try {
            const pieCanvas = document.getElementById('classroom-pie-chart');
            if (!pieCanvas) {
                // console.warn('Canvas for classroom pie chart not found.');
                return;
            }
            const pieCtx = pieCanvas.getContext('2d');
            if (window.classroomPieChart) {
                window.classroomPieChart.destroy();
            }
            window.classroomPieChart = new Chart(pieCtx, {
                type: 'pie',
                data: {
                    labels: STATUS_LIST.map(status => status.label),
                    datasets: [{
                        data: STATUS_LIST.map(status => statusCounts[status.label] || 0),
                        backgroundColor: STATUS_LIST.map(status => status.hexColor)
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { position: 'right' },
                        title: {
                            display: true,
                            text: 'สัดส่วนสถานะการเข้าเรียน'
                        }
                    },
                    layout: {
                        padding: 10
                    }
                }
            });

            const barCanvas = document.getElementById('classroom-bar-chart');
             if (!barCanvas) {
                // console.warn('Canvas for classroom bar chart not found.');
                return;
            }
            const barCtx = barCanvas.getContext('2d');
            if (window.classroomBarChart) {
                window.classroomBarChart.destroy();
            }
            window.classroomBarChart = new Chart(barCtx, {
                type: 'bar',
                data: {
                    labels: STATUS_LIST.map(status => status.label),
                    datasets: [{
                        label: 'จำนวนนักเรียน',
                        data: STATUS_LIST.map(status => statusCounts[status.label] || 0),
                        backgroundColor: STATUS_LIST.map(status => status.hexColor)
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false },
                        title: {
                            display: true,
                            text: 'จำนวนนักเรียนตามสถานะการเข้าเรียน'
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            ticks: { precision: 0 }
                        }
                    },
                    layout: {
                        padding: {
                            top: 10,
                            bottom: 10
                        }
                    }
                }
            });

            const pieChartCard = $('#classroom-pie-chart').closest('.bg-white.rounded-lg.shadow.p-4');
            if (pieChartCard.length) {
                 $('#classroom-pie-chart').css({ 'width': '100%', 'height': '300px' });
            }


            const barChartCard = $('#classroom-bar-chart').closest('.bg-white.rounded-lg.shadow.p-4');
             if (barChartCard.length) {
                $('#classroom-bar-chart').css({ 'width': '100%', 'height': '300px' });
            }

        } catch (error) {
            console.error('Error in updateClassroomCharts:', error);
            // Avoid Swal here as it can be too disruptive if charts fail repeatedly
        }
    }

    function updateClassroomTable(tableData, totalStudents) {
        try {
            const container = $("#classroom-summary-list");
            container.empty();
            
            tableData.forEach(entry => {
                const totalCard = `
                    <div class="p-4 text-center rounded-lg shadow-sm" style="background-color: ${lightenColor('#e5e7eb', 20)}; color: #374151;">
                        <div class="flex items-center justify-center mb-2">
                            <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path>
                            </svg>
                            <h3 class="text-sm font-medium">นักเรียนทั้งหมด</h3>
                        </div>
                        <p class="text-lg font-semibold">${totalStudents} คน</p>
                        <p class="text-xs text-gray-500">(100%)</p>
                    </div>
                `;

                const cards = STATUS_LIST.map(status => {
                    const count = entry.counts[status.label] || 0;
                    const percentage = totalStudents > 0 ? ((count / totalStudents) * 100).toFixed(2) : 0;
                    const hexColor = status.hexColor || '#000000';
                    const lighterColor = lightenColor(hexColor, 80);
                    const darkerColor = darkenColor(hexColor, 20);
                    return `
                        <div class="p-4 text-center rounded-lg shadow-sm" style="background-color: ${lighterColor}; color: ${darkerColor};">
                            <div class="flex items-center justify-center mb-2">
                                <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                                </svg>
                                <h3 class="text-sm font-medium">${status.label}</h3>
                            </div>
                            <p class="text-lg font-semibold">${count} คน</p>
                            <p class="text-xs text-gray-500">(${percentage}%)</p>
                        </div>
                    `;
                }).join('');
                
                container.append(`
                    <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-6 gap-4">
                        ${totalCard}
                        ${cards}
                    </div>
                `);
            });
        } catch (error) {
            console.error('Error in updateClassroomTable:', error);
            // Avoid Swal here
        }
    }

    function updateClassroomStudentsList(studentList) {
        try {
            const studentsList = $("#classroom-students-list");
            studentsList.empty();
            
            if (studentList.length === 0) {
                studentsList.append('<tr><td colspan="4" class="px-6 py-4 text-center text-gray-500">ไม่มีข้อมูลนักเรียน</td></tr>');
                return;
            }

            studentList.forEach(student => {
                const row = `
                    <tr class="border-b border-gray-200">
                        <td class="px-6 py-4 whitespace-nowrap border-r border-gray-200">${student.student_id}</td>
                        <td class="px-6 py-4 whitespace-nowrap border-r border-gray-200">${student.no}</td>
                        <td class="px-6 py-4 whitespace-nowrap border-r border-gray-200">${student.name}</td>
                        <td class="px-6 py-4 whitespace-nowrap">${student.status}${student.reason ? ` (${student.reason})` : ''}</td>
                    </tr>
                `;
                studentsList.append(row);
            });

            const table = studentsList.closest('table');
            table.addClass('min-w-full w-full border');
            table.closest('.table-responsive').addClass('w-full');
            table.find('thead tr').addClass('bg-gradient-to-r from-blue-400 to-teal-400 text-white border-b border-gray-300');
            table.find('thead th').addClass('border-r border-gray-300 font-bold');
            table.find('thead th:last-child').removeClass('border-r');
            table.find('tbody tr td:last-child').removeClass('border-r');
        } catch (error) {
            console.error('Error in updateClassroomStudentsList:', error);
            // Avoid Swal here
        }
    }

    function loadOverallSummary() {
        try {
            console.log('Loading overall summary');
            const date = $("#overall-date").val() || TODAY;
            let period = $("#overall-period-buttons .period-btn.active").data("period");
            if (!period) {
                period = "morning";
                $("#overall-period-buttons .period-btn[data-period='morning']").addClass("active bg-indigo-600 text-white").removeClass("text-gray-700 bg-white");
            }
            $("#overall-chart-container").hide();
            $("#overall-table-container").hide();
            $("#overall-status-summary").hide();
            // Removed line related to overall-preview-btn
            $("#overall-empty-dashboard").show();
             updateOverallSummaryTitle(); // Call title update here
            if (date && period) {
                loadOverallSummaryData(date, period);
            } else {
                console.warn('Missing date or period for overall summary');
            }
        } catch (error) {
            console.error('Error in loadOverallSummary:', error);
            Swal.fire({
                icon: 'error',
                title: 'ข้อผิดพลาด',
                text: 'เกิดข้อผิดพลาดในการโหลดสรุปภาพรวม: ' + error.message,
                confirmButtonText: 'ตกลง'
            });
        }
    }

    function updateOverallSummaryTitle() {
        try {
            const date = $("#overall-date").val() || TODAY;
            const period = $("#overall-period-buttons .period-btn.active").data("period") || 'morning';
            const periodName = period ? PERIODS.find(p => p.id === period)?.name || period : 'เช้า';
            
            const schoolName = CONFIG.school_config.schoolName || 'โรงเรียน';
            $("#overall-summary-title").html(`
                สรุปเช็คชื่อนักเรียนทั้งโรงเรียน<br>
                ${schoolName}<br>
                วันที่ ${formatDateThai(date)} ช่วง${periodName}
            `);
        } catch (error) {
            console.error('Error in updateOverallSummaryTitle:', error);
            // Avoid Swal here
        }
    }

    async function loadOverallSummaryData(date, period) {
        try {
            $.LoadingOverlay("show");
            console.log('Loading overall summary data for date:', date, 'and period:', period);

            const classroomResponse = await runGoogleScript('getClassrooms', []);
            if (classroomResponse.status !== 'success') {
                throw new Error(classroomResponse.error.details || 'Failed to load classrooms');
            }
            const allClassrooms = classroomResponse.data;

            const attendanceResponse = await runGoogleScript('getAttendance', date, period, null);
            if (attendanceResponse.status !== 'success') {
                throw new Error(attendanceResponse.error.details || 'Failed to load attendance data');
            }
            const attendanceLog = attendanceResponse.data;
            const filteredData = attendanceLog.filter(entry => 
                entry.date === date && 
                entry.period === period
            ).sort((a, b) => new Date(b.updated_at || b.date) - new Date(a.updated_at || b.date));
            
            if (filteredData.length === 0 && (!allClassrooms || allClassrooms.length === 0)) {
                $.LoadingOverlay("hide");
                Swal.fire({
                    icon: 'info',
                    title: 'ไม่พบข้อมูล',
                    text: 'ยังไม่มีข้อมูลการเช็คชื่อสำหรับวันที่และช่วงเวลาที่เลือก และไม่มีห้องเรียนในระบบ',
                    confirmButtonText: 'ตกลง'
                });
                $("#overall-chart-container").hide();
                $("#overall-table-container").hide();
                $("#overall-status-summary").hide();
                // Removed line related to overall-preview-btn
                $("#overall-empty-dashboard").show();
                return;
            }

            const studentResponse = await runGoogleScript('getStudents', allClassrooms.map(c => c.id));
            if (studentResponse.status !== 'success') {
                throw new Error(studentResponse.error.details || 'Failed to load students');
            }
            const studentsByClassroom = studentResponse.data;

            const statusCounts = {};
            STATUS_LIST.forEach(status => {
                statusCounts[status.label] = 0;
            });
            
            const tableData = [];
            const statusStudents = {};
            STATUS_LIST.forEach(status => {
                if (status.label !== "มา") {
                    statusStudents[status.label] = [];
                }
            });
            const latestEntries = {};
            filteredData.forEach(entry => {
                if (!latestEntries[entry.room_id] || new Date(entry.updated_at || entry.date) > new Date(latestEntries[entry.room_id].updated_at || entry.date)) {
                    latestEntries[entry.room_id] = entry;
                }
            });

            let totalStudents = 0;
            allClassrooms.forEach(classroom => {
                const dayCounts = {};
                STATUS_LIST.forEach(status => {
                    dayCounts[status.label] = 0;
                });

                const entry = latestEntries[classroom.id];
                if (entry) {
                    entry.students.forEach(student => {
                        if (statusCounts[student.status] !== undefined) {
                            statusCounts[student.status]++;
                            dayCounts[student.status]++;
                        } else {
                            console.warn('Unknown status found:', student.status);
                        }
                        const studentData = studentsByClassroom[classroom.id]?.find(s => String(s.student_id) === String(student.student_id));
                        if (studentData && student.status !== "มา") {
                            if (statusStudents[student.status]) {
                                statusStudents[student.status].push({
                                    classroom: classroom.name,
                                    student_id: student.student_id,
                                    no: studentData.no,
                                    name: studentData.name,
                                    status: student.status,
                                    reason: student.reason || ''
                                });
                            }
                        }
                    });
                }

                const studentCount = studentsByClassroom[classroom.id]?.length || 0;
                totalStudents += studentCount;
                const periodName = PERIODS.find(p => p.id === period)?.name || period;
                tableData.push({
                    date: date,
                    classroom: classroom.name,
                    period: periodName,
                    counts: dayCounts,
                    studentCount: studentCount,
                    checked: !!entry,
                    classroomId: classroom.id
                });
            });

            updateOverallTable(tableData, statusCounts, totalStudents);
            updateOverallCharts(statusCounts);
            updateOverallStatusSummary(statusStudents);
            
            $("#overall-table-container").show();
            $("#overall-chart-container").show();
            $("#overall-status-summary").show();
            // Removed lines related to overall-preview-btn
            $("#overall-empty-dashboard").hide();

            // Removed event listener for overall-preview-btn
            
            $.LoadingOverlay("hide");
        } catch (error) {
            $.LoadingOverlay("hide");
            console.error('Error in loadOverallSummaryData:', error);
            Swal.fire({
                icon: 'error',
                title: 'ข้อผิดพลาด',
                text: 'เกิดข้อผิดพลาดในการโหลดข้อมูลสรุปทั้งโรงเรียน: ' + error.message,
                confirmButtonText: 'ตกลง'
            });
        }
    }

    function updateOverallCharts(statusCounts) {
        try {
            const pieCanvas = document.getElementById('overall-pie-chart');
            if (!pieCanvas) {
                // console.warn('Canvas for overall pie chart not found.');
                return;
            }
            const pieCtx = pieCanvas.getContext('2d');
            if (window.overallPieChart) {
                window.overallPieChart.destroy();
            }
            window.overallPieChart = new Chart(pieCtx, {
                type: 'pie',
                data: {
                    labels: STATUS_LIST.map(status => status.label),
                    datasets: [{
                        data: STATUS_LIST.map(status => statusCounts[status.label] || 0),
                        backgroundColor: STATUS_LIST.map(status => status.hexColor)
                    }]
                },
                options: {
                    responsive: true,

async function loadCleaningSummary() {
  try {
    $("#cleaning-summary-empty").show();
    $("#cleaning-summary-content").addClass("hidden");

    // Default: ต้นเดือน → วันนี้
    const today = TODAY;
    const start = today.slice(0, 7) + '-01';

    if (!$("#cleaning-summary-start").val()) {
      $("#cleaning-summary-start").val(start);
      flatpickr("#cleaning-summary-start", {
        dateFormat: "Y-m-d", locale: "th", defaultDate: start
      });
    }
    if (!$("#cleaning-summary-end").val()) {
      $("#cleaning-summary-end").val(today);
      flatpickr("#cleaning-summary-end", {
        dateFormat: "Y-m-d", locale: "th", defaultDate: today
      });
    }

    // Load classroom dropdown (เฉพาะครั้งแรก)
    if ($("#cleaning-summary-room option").length <= 1) {
      const cr = await runGoogleScript('getClassrooms', []);
      if (cr.status === 'success') {
        cr.data.forEach(c => {
          $("#cleaning-summary-room").append(`<option value="${c.id}">${c.name}</option>`);
        });
      }
    }

    // Bind run button
    $("#cleaning-summary-run").off("click").on("click", runCleaningSummary);
  } catch (error) {
    console.error('Error in loadCleaningSummary:', error);
  }
}

async function runCleaningSummary() {
  const startDate = $("#cleaning-summary-start").val();
  const endDate = $("#cleaning-summary-end").val();
  const classroomId = $("#cleaning-summary-room").val() || "";

  if (!startDate || !endDate) {
    Swal.fire('แจ้งเตือน', 'กรุณาเลือกช่วงวันที่', 'warning');
    return;
  }
  if (startDate > endDate) {
    Swal.fire('แจ้งเตือน', 'วันที่เริ่มต้นต้องไม่มากกว่าวันที่สิ้นสุด', 'warning');
    return;
  }

  $.LoadingOverlay("show", { text: "กำลังประมวลผล..." });
  try {
    const res = await runGoogleScript('getCleaningStats', {
      startDate, endDate, classroom_id: classroomId
    });

    if (res.status !== 'success') throw new Error(res.message);

    renderCleaningSummary(res.data);
    $("#cleaning-summary-empty").hide();
    $("#cleaning-summary-content").removeClass("hidden");
  } catch (error) {
    console.error('Error:', error);
    Swal.fire('ผิดพลาด', error.message, 'error');
  } finally {
    $.LoadingOverlay("hide");
  }
}

function renderCleaningSummary(data) {
  // ===== Summary Cards =====
  $("#clean-stat-avg").text((data.avgScore || 0) + '%');
  $("#clean-stat-total").text((data.scoreDetails || []).length);

  // Top room
  const roomScores = {};
  (data.scoreDetails || []).forEach(d => {
    if (!roomScores[d.classroom_id]) roomScores[d.classroom_id] = [];
    const [s, m] = String(d.total_score).split('/').map(Number);
    if (!isNaN(s) && !isNaN(m) && m > 0) roomScores[d.classroom_id].push((s / m) * 100);
  });
  let topRoom = '-';
  let topAvg = 0;
  for (const room in roomScores) {
    const avg = roomScores[room].reduce((a, b) => a + b, 0) / roomScores[room].length;
    if (avg > topAvg) {
      topAvg = avg;
      const found = ALL_CLASSROOMS.find(c => c.id === room);
      topRoom = found ? found.name : room;
    }
  }
  $("#clean-stat-top-room").text(topRoom);

  // ===== Top 5 Students =====
  const topTbody = $("#clean-top-students");
  topTbody.empty();
  if (!data.topStudents || data.topStudents.length === 0) {
    topTbody.append('<tr><td colspan="3" class="text-center p-4 text-gray-400">ไม่มีข้อมูล</td></tr>');
  } else {
    // map student_id → name (จาก CONFIG.students ถ้ามี)
    const nameMap = {};
    for (const room in (window.CONFIG_STUDENTS || {})) {
      (window.CONFIG_STUDENTS[room] || []).forEach(s => {
        nameMap[String(s.student_id)] = s.name;
      });
    }

    data.topStudents.forEach((s, i) => {
      const medal = i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : `#${i + 1}`;
      const realName = nameMap[String(s.name)] || s.name;
      topTbody.append(`
        <tr class="border-b border-gray-100 hover:bg-blue-50">
          <td class="p-3 font-semibold text-gray-700">${medal}</td>
          <td class="p-3 text-gray-800">${realName}</td>
          <td class="p-3 text-center font-bold text-emerald-600">${s.done} ครั้ง</td>
        </tr>
      `);
    });
  }

  // ===== Details =====
  const detailTbody = $("#clean-details-list");
  detailTbody.empty();
  if (!data.scoreDetails || data.scoreDetails.length === 0) {
    detailTbody.append('<tr><td colspan="4" class="text-center p-4 text-gray-400">ไม่มีข้อมูล</td></tr>');
  } else {
    data.scoreDetails.forEach(d => {
      const roomName = (ALL_CLASSROOMS.find(c => c.id === d.classroom_id) || {}).name || d.classroom_id;
      detailTbody.append(`
        <tr class="border-b border-gray-100 hover:bg-blue-50">
          <td class="p-3 text-gray-600">${d.date}</td>
          <td class="p-3 font-semibold text-gray-800">${roomName}</td>
          <td class="p-3 text-gray-600">${d.checker}</td>
          <td class="p-3 text-center font-bold text-blue-700">${d.total_score}</td>
        </tr>
      `);
    });
  }

  renderCleaningCharts(data.studentStats || [], data.scoreDetails || []);
  renderCleaningStudentList(data.allStudents || data.studentStats || []);
}

function renderCleaningCharts(studentStats, scoreDetails) {
  let done = 0;
  let notDone = 0;
  let leave = 0;
  (studentStats || []).forEach(student => {
    done += Number(student.done) || 0;
    notDone += Number(student.not_done) || 0;
    leave += Number(student.leave) || 0;
  });

  const pieCanvas = document.getElementById('clean-pie-chart');
  if (pieCanvas) {
    if (window.cleanPieChart) window.cleanPieChart.destroy();
    window.cleanPieChart = new Chart(pieCanvas.getContext('2d'), {
      type: 'pie',
      data: {
        labels: ['ทำ', 'ไม่ทำ', 'ลา'],
        datasets: [{ data: [done, notDone, leave], backgroundColor: ['#10b981', '#f97316', '#ef4444'] }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { position: 'right' }, title: { display: true, text: 'สัดส่วนการทำเวร' } }
      }
    });
  }

  const roomBuckets = {};
  (scoreDetails || []).forEach(detail => {
    const [score, maxScore] = String(detail.total_score).split('/').map(Number);
    if (!Number.isFinite(score) || !Number.isFinite(maxScore) || maxScore <= 0) return;
    const roomId = String(detail.classroom_id || '');
    if (!roomBuckets[roomId]) roomBuckets[roomId] = [];
    roomBuckets[roomId].push((score / maxScore) * 100);
  });

  const roomLabels = [];
  const roomValues = [];
  Object.keys(roomBuckets).sort().forEach(roomId => {
    const scores = roomBuckets[roomId];
    const average = scores.reduce((sum, score) => sum + score, 0) / scores.length;
    const classroom = (ALL_CLASSROOMS || []).find(item => String(item.id) === roomId);
    roomLabels.push(classroom ? classroom.name : roomId);
    roomValues.push(Number(average.toFixed(1)));
  });

  const barCanvas = document.getElementById('clean-bar-chart');
  if (barCanvas) {
    if (window.cleanBarChart) window.cleanBarChart.destroy();
    window.cleanBarChart = new Chart(barCanvas.getContext('2d'), {
      type: 'bar',
      data: {
        labels: roomLabels,
        datasets: [{ label: 'คะแนนเฉลี่ย (%)', data: roomValues, backgroundColor: '#2563eb' }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { display: false }, title: { display: true, text: 'คะแนนเฉลี่ยแต่ละห้อง' } },
        scales: { y: { beginAtZero: true, max: 100 } }
      }
    });
  }
}

let currentSubjectCtx = null;

function escapeSummaryHtml(value) {
  return String(value == null ? '' : value).replace(/[&<>"']/g, char => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[char]));
}

function initSubjectSummary() {

async function runSubjectSummaryV2() {
  const subjectKey = $('#summary-subject-select').val();
  const startDate = $('#summary-subject-start').val();
  const endDate = $('#summary-subject-end').val();
  if (!subjectKey) return Swal.fire('แจ้งเตือน', 'กรุณาเลือกวิชา', 'warning');
  if (!startDate || !endDate) return Swal.fire('แจ้งเตือน', 'กรุณาเลือกช่วงวันที่', 'warning');
  if (startDate > endDate) return Swal.fire('แจ้งเตือน', 'วันที่เริ่มต้นต้องไม่เกินวันที่สิ้นสุด', 'warning');

  const teacher = JSON.parse(localStorage.getItem('teacher') || '{}');
  const teacherId = teacher.username || teacher.name || teacher.email || '';
  $.LoadingOverlay('show', { text: 'กำลังประมวลผล...' });
  try {
    const response = await runGoogleScript('getSubjectAttendanceSummaryV2', teacherId, subjectKey, startDate, endDate, null);
    if (!response || response.status !== 'success') throw new Error((response && response.message) || 'ไม่สามารถโหลดข้อมูลได้');
    renderSubjectSummaryV2(subjectKey, response.data || {}, startDate, endDate);
    $('#subject-summary-empty').addClass('hidden');
    $('#subject-summary-content').removeClass('hidden');
  } catch (error) {
    Swal.fire('ผิดพลาด', error.message || String(error), 'error');
  } finally {
    $.LoadingOverlay('hide');
  }
}

function renderSubjectSummaryV2(subjectKey, data, startDate, endDate) {
  const totals = data.totals || { present: 0, absent: 0, leave: 0, late: 0, sick: 0, total: 0 };
  const students = Array.isArray(data.students) ? data.students : [];
  const total = Number(totals.total) || 0;
  const percent = value => (total ? ((Number(value) || 0) / total * 100).toFixed(1) : '0.0') + '%';

  $('#subj-card-present').text(totals.present || 0);
  $('#subj-card-present-pct').text(percent(totals.present));
  $('#subj-card-absent').text(totals.absent || 0);
  $('#subj-card-absent-pct').text(percent(totals.absent));
  $('#subj-card-late').text(totals.late || 0);
  $('#subj-card-late-pct').text(percent(totals.late));
  $('#subj-card-leave').text(totals.leave || 0);
  $('#subj-card-leave-pct').text(percent(totals.leave));
  $('#subj-card-sick').text(totals.sick || 0);
  $('#subj-card-sick-pct').text(percent(totals.sick));

  renderSubjectCharts(totals, data.dailyTrend || {});
  $('#subject-summary-title').text(`📋 สรุปรายบุคคล — ${students.length} คน (รวม ${total} ครั้ง)`);
  const tbody = $('#subject-summary-tbody').empty();

  if (!students.length) {
    tbody.append('<tr><td colspan="11" class="text-center p-6 text-gray-400">ไม่พบข้อมูล</td></tr>');
  } else {
    students.forEach(student => {
      const attendancePct = Number(student.total) > 0 ? ((Number(student.present) / Number(student.total)) * 100).toFixed(0) : '0';
      const gradeRoom = String(student.gradeLevel || '') + (student.room ? '/' + student.room : '');
      const percentColor = attendancePct >= 80 ? 'text-emerald-600' : attendancePct >= 50 ? 'text-amber-600' : 'text-rose-600';
      tbody.append(`
        <tr class="border-b border-gray-100 hover:bg-blue-50">
          <td class="p-3 text-center text-gray-600 text-sm">${escapeSummaryHtml(gradeRoom)}</td>
          <td class="p-3 text-center text-gray-600 text-sm">${escapeSummaryHtml(student.id)}</td>
          <td class="p-3 text-gray-800 text-sm font-medium">${escapeSummaryHtml(student.name)}</td>
          <td class="p-3 text-center font-bold text-emerald-600">${Number(student.present) || 0}</td>
          <td class="p-3 text-center font-bold text-rose-600">${Number(student.absent) || 0}</td>
          <td class="p-3 text-center font-bold text-amber-600">${Number(student.late) || 0}</td>
          <td class="p-3 text-center font-bold text-blue-600">${Number(student.leave) || 0}</td>
          <td class="p-3 text-center font-bold text-purple-600">${Number(student.sick) || 0}</td>
          <td class="p-3 text-center font-bold bg-gray-100">${Number(student.total) || 0}</td>
          <td class="p-3 text-center font-bold ${percentColor}">${attendancePct}%</td>
          <td class="p-3 text-center">
            <button type="button" class="student-detail-btn px-3 py-1 bg-blue-100 text-blue-700 rounded-lg text-xs font-bold hover:bg-blue-200 active:scale-95"
              data-student-id="${escapeSummaryHtml(student.id)}" data-student-name="${escapeSummaryHtml(student.name)}"
              data-subject-key="${escapeSummaryHtml(subjectKey)}" data-start-date="${escapeSummaryHtml(startDate)}"
              data-end-date="${escapeSummaryHtml(endDate)}" aria-label="ดูรายละเอียด ${escapeSummaryHtml(student.name)}">👁️</button>
          </td>
        </tr>
      `);
    });

    tbody.append(`
      <tr class="font-bold bg-blue-100">
        <td colspan="3" class="p-3 text-center">รวมทั้งสิ้น</td>
        <td class="p-3 text-center text-emerald-700">${Number(totals.present) || 0}</td>
        <td class="p-3 text-center text-rose-700">${Number(totals.absent) || 0}</td>
        <td class="p-3 text-center text-amber-700">${Number(totals.late) || 0}</td>

      $(this).attr('data-subject-key'), $(this).attr('data-start-date'), $(this).attr('data-end-date')
    );

}

function renderSubjectCharts(totals, dailyTrend) {
  const pieCanvas = document.getElementById('subject-pie-chart');
  if (pieCanvas) {
    if (window.subjectPieChart) window.subjectPieChart.destroy();
    window.subjectPieChart = new Chart(pieCanvas.getContext('2d'), {
      type: 'pie',
      data: {
        labels: ['มา', 'ขาด', 'สาย', 'ลา', 'ป่วย'],
        datasets: [{
          data: [totals.present || 0, totals.absent || 0, totals.late || 0, totals.leave || 0, totals.sick || 0],
          backgroundColor: ['#10b981', '#ef4444', '#eab308', '#3b82f6', '#a855f7']
        }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { position: 'right' }, title: { display: true, text: 'สัดส่วนการเข้าเรียน' } }
      }
    });
  }

  const dates = Object.keys(dailyTrend).sort();
  const present = dates.map(date => dailyTrend[date].present || 0);
  const others = dates.map(date => (dailyTrend[date].absent || 0) + (dailyTrend[date].leave || 0) + (dailyTrend[date].late || 0) + (dailyTrend[date].sick || 0));
  const barCanvas = document.getElementById('subject-bar-chart');
  if (barCanvas) {
    if (window.subjectBarChart) window.subjectBarChart.destroy();
    window.subjectBarChart = new Chart(barCanvas.getContext('2d'), {
      type: 'bar',
      data: {
        labels: dates.map(date => {
          const parts = date.split('-');
          return `${parseInt(parts[2], 10)}/${parseInt(parts[1], 10)}`;
        }),
        datasets: [
          { label: 'มา', data: present, backgroundColor: '#10b981', stack: 'total' },
          { label: 'ขาด/ลา/สาย/ป่วย', data: others, backgroundColor: '#ef4444', stack: 'total' }
        ]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { position: 'top' }, title: { display: true, text: 'แนวโน้มรายวัน' } },
        scales: { x: { stacked: true }, y: { stacked: true, beginAtZero: true, ticks: { precision: 0 } } }
      }
    });
  }
}

let weeklyState = {
  currentMode: 'attendance',
  currentStartDate: null,
  currentEndDate: null,
  currentPeriod: 'morning'
};

function initWeeklySummary() {
  setWeek(TODAY);

  $(".weekly-mode-btn").off("click").on("click", function() {
    $(".weekly-mode-btn").removeClass("bg-blue-700 text-white").addClass("bg-gray-100 text-gray-600");
    $(this).removeClass("bg-gray-100 text-gray-600").addClass("bg-blue-700 text-white");
    weeklyState.currentMode = $(this).data('mode');
    $("#weekly-period-row").toggle(weeklyState.currentMode === 'attendance');
    loadWeeklyReport();
  });

  loadPeriodButtons("#weekly-period-buttons");
  $("#weekly-period-buttons").off("click", ".period-btn").on("click", ".period-btn", function() {
    $("#weekly-period-buttons .period-btn").removeClass("active text-white").addClass("text-gray-700 bg-white");
    $(this).addClass("active text-white").removeClass("text-gray-700 bg-white");
    weeklyState.currentPeriod = $(this).data('period');
    loadWeeklyReport();
  });

  $("#weekly-prev").off("click").on("click", () => shiftWeek(-7));
  $("#weekly-next").off("click").on("click", () => shiftWeek(7));

  loadWeeklyReport();
}

function setWeek(baseDateStr) {
  const d = new Date(baseDateStr);
  const dayOfWeek = d.getDay();
  const firstDay = new Date(d);
  firstDay.setDate(d.getDate() - dayOfWeek + (dayOfWeek === 0 ? -6 : 1));
  const lastDay = new Date(firstDay);
  lastDay.setDate(firstDay.getDate() + 4);

  const fmt = (dt) => {
    const p = [dt.getFullYear(), String(dt.getMonth() + 1).padStart(2, '0'), String(dt.getDate()).padStart(2, '0')];
    return p.join('-');
  };

  weeklyState.currentStartDate = fmt(firstDay);
  weeklyState.currentEndDate = fmt(lastDay);
  updateWeeklyRangeLabel();
}

function shiftWeek(days) {
  const d = new Date(weeklyState.currentStartDate);
  d.setDate(d.getDate() + days);
  const fmt = (dt) => {
    const p = [dt.getFullYear(), String(dt.getMonth() + 1).padStart(2, '0'), String(dt.getDate()).padStart(2, '0')];
    return p.join('-');
  };
  setWeek(fmt(d));
  loadWeeklyReport();
}

function updateWeeklyRangeLabel() {
  const fmt = (ds) => {
    const p = ds.split('-');
    return `${parseInt(p[2])}/${parseInt(p[1])}`;
  };
  const year = parseInt(weeklyState.currentStartDate.split('-')[0]) + 543;
  $("#weekly-range").text(`${fmt(weeklyState.currentStartDate)} - ${fmt(weeklyState.currentEndDate)} / ${year}`);
}

async function loadWeeklyReport() {
  $("#weekly-empty").show().text("กำลังโหลด...");
  $("#weekly-table-container").addClass("hidden");

  const teacher = JSON.parse(localStorage.getItem('teacher') || '{}');
  const teacherEmail = teacher.username || teacher.email || '';

  const options = {
    period: weeklyState.currentMode === 'attendance' ? weeklyState.currentPeriod : '',
    teacherEmail: teacherEmail
  };

  try {
    const res = await runGoogleScript('getWeeklyCheckReport',
      weeklyState.currentStartDate, weeklyState.currentEndDate,
      weeklyState.currentMode, options);
    if (res.status !== 'success') throw new Error(res.message);
    renderWeeklyTable(res.data, weeklyState.currentMode);
    $("#weekly-empty").hide();
    $("#weekly-table-container").removeClass("hidden");
  } catch (err) {
    $("#weekly-empty").text("ผิดพลาด: " + err.message);
  }
}

function renderWeeklyTable(data, mode) {
  const { weekDates, rows } = data;
  const dayNames = ['อา.', 'จ.', 'อ.', 'พ.', 'พฤ.', 'ศ.', 'ส.'];

  // Header
  let thead = '<tr class="bg-blue-700 text-white">';
  thead += '<th class="p-3 text-left">รายการ</th>';
  weekDates.forEach(d => {
    const dayOfWeek = new Date(d + 'T00:00:00Z').getUTCDay();
    const [_, m, dd] = d.split('-');
    thead += `<th class="p-3 text-center">${dayNames[dayOfWeek]}<br><span class="text-xs opacity-75">${parseInt(dd)}/${parseInt(m)}</span></th>`;
  });
  thead += '<th class="p-3 text-center">รวม</th><th class="p-3 text-center">%</th>';
  thead += '</tr>';
  $("#weekly-thead").html(thead);

  // Body
  const tbody = $("#weekly-tbody").empty();

  rows.forEach(r => {
    const scheduledDates = weekDates.filter(d => d in r.dates);
    const checkedCount = scheduledDates.filter(d => r.dates[d] === true).length;
    const pct = scheduledDates.length > 0 ? ((checkedCount / scheduledDates.length) * 100).toFixed(0) : 0;
    const pctColor = pct >= 80 ? 'text-emerald-600' : pct >= 50 ? 'text-amber-600' : 'text-rose-600';

    let html = `<tr class="border-b border-gray-100 hover:bg-blue-50">`;
    html += `<td class="p-3 font-medium text-gray-800">${escapeSummaryHtml(r.name)}${r.sublabel ? ` <span class="text-xs text-gray-500">(${escapeSummaryHtml(r.sublabel)})</span>` : ''}</td>`;

    weekDates.forEach(d => {
      const isScheduled = d in r.dates;
      const isChecked = r.dates[d] === true;
      if (!isScheduled) {
        html += '<td class="p-3 text-center text-gray-300">—</td>';
      } else {
        const icon = isChecked ? '<span class="text-emerald-600 font-bold">✓</span>' : '<span class="text-red-500 font-bold">⚡</span>';
        const cursor = r.clickable ? 'cursor-pointer hover:bg-blue-100' : '';
        const clickData = r.clickable
          ? `data-date="${escapeSummaryHtml(d)}" data-row-id="${escapeSummaryHtml(r.id)}" data-mode="${escapeSummaryHtml(mode)}" data-meta="${escapeSummaryHtml(JSON.stringify(r.meta || {}))}"`
          : '';
        html += `<td class="p-3 text-center ${cursor} ${r.clickable ? 'weekly-cell' : ''}" ${clickData}>${icon}</td>`;
      }
    });

    html += `<td class="p-3 text-center font-bold">${checkedCount}/${scheduledDates.length}</td>`;
    html += `<td class="p-3 text-center font-bold ${pctColor}">${pct}%</td>`;
    html += '</tr>';
    tbody.append(html);
  });

  tbody.off('click', '.weekly-cell').on('click', '.weekly-cell', function() {
    const cell = $(this);
    handleWeeklyCellClick(cell.attr('data-date'), cell.attr('data-row-id'), cell.attr('data-mode'), cell.attr('data-meta') || '{}');
  });

  // Footer
  let tfoot = '<tr class="bg-blue-100 font-bold">';
  tfoot += '<td class="p-3">รวม</td>';
  weekDates.forEach(d => {
    let checked = 0, total = 0;
    rows.forEach(r => {
      if (d in r.dates) {
        total++;
        if (r.dates[d]) checked++;
      }
    });
    tfoot += `<td class="p-3 text-center">${checked}/${total}</td>`;
  });
  tfoot += '<td class="p-3 text-center">—</td><td class="p-3 text-center">—</td></tr>';
  $("#weekly-tfoot").html(tfoot);
}

function handleWeeklyCellClick(date, rowId, mode, metaJson) {
  const meta = JSON.parse(metaJson);

  if (mode === 'attendance') {
    const roomName = (ALL_CLASSROOMS.find(c => c.id === rowId) || {}).name || rowId;
    openAttendanceModal(date, weeklyState.currentPeriod, rowId, roomName);
  } else if (mode === 'cleaning') {
    const roomName = (ALL_CLASSROOMS.find(c => c.id === rowId) || {}).name || rowId;
    openCleaningModal(date, rowId, roomName);
  } else if (mode === 'subject') {
    // เปิด subject modal พร้อม preselect
    openSubjectAttendanceModal({ date: date, subjectCode: meta.code });
  }
}

</script>
